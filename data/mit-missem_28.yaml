  type: TYPE_NORMAL
  zh: '[去年的笔记](/2019/security/)：从这次讲座更侧重于作为计算机用户的安全和隐私的角度'
- en: '[Cryptographic Right Answers](https://latacora.micro.blog/2018/04/03/cryptographic-right-answers.html):
    answers “what crypto should I use for X?” for many common X.'
  id: totrans-67
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[密码学正确答案](https://latacora.micro.blog/2018/04/03/cryptographic-right-answers.html)：为许多常见的X提供“我应该为X使用什么密码学？”的答案。'
- en: Exercises
  id: totrans-68
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: '**Entropy.**'
  id: totrans-69
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**熵。**'
- en: Suppose a password is chosen as a concatenation of four lower-case dictionary
    words, where each word is selected uniformly at random from a dictionary of size
    100,000\. An example of such a password is `correcthorsebatterystaple`. How many
    bits of entropy does this have?
  id: totrans-70
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 假设密码是一个由四个小写词典单词组成的连接，其中每个单词是从大小为100,000的词典中随机选择的。这样一个密码的例子是 `correcthorsebatterystaple`。这个密码有多少位的熵？
- en: Consider an alternative scheme where a password is chosen as a sequence of 8
    random alphanumeric characters (including both lower-case and upper-case letters).
    An example is `rg8Ql34g`. How many bits of entropy does this have?
  id: totrans-71
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 考虑一个替代方案，其中密码被选为一个由8个随机字母数字字符组成的序列（包括大小写字母）。一个例子是 `rg8Ql34g`。这个密码有多少位的熵？
- en: Which is the stronger password?
  id: totrans-72
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 哪个密码更强大？
- en: Suppose an attacker can try guessing 10,000 passwords per second. On average,
    how long will it take to break each of the passwords?
  id: totrans-73
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 假设攻击者每秒可以尝试猜测10,000个密码。平均来说，破解每个密码需要多长时间？
- en: '**Cryptographic hash functions.** Download a Debian image from a [mirror](https://www.debian.org/CD/http-ftp/)
    (e.g. [from this Argentinean mirror](http://debian.xfree.com.ar/debian-cd/current/amd64/iso-cd/)).
    Cross-check the hash (e.g. using the `sha256sum` command) with the hash retrieved
    from the official Debian site (e.g. [this file](https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS)
    hosted at `debian.org`, if you’ve downloaded the linked file from the Argentinean
    mirror).'
  id: totrans-74
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**密码学哈希函数。** 从一个[镜像](https://www.debian.org/CD/http-ftp/)（例如[这个阿根廷镜像](http://debian.xfree.com.ar/debian-cd/current/amd64/iso-cd/iso-cd/))下载Debian镜像。使用`sha256sum`命令等交叉检查哈希值，与从官方Debian网站（例如[这个文件](https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS)）检索的哈希值进行比对，如果已从阿根廷镜像下载了链接的文件。'
- en: '**Symmetric cryptography.** Encrypt a file with AES encryption, using [OpenSSL](https://www.openssl.org/):
    `openssl aes-256-cbc -salt -in {input filename} -out {output filename}`. Look
    at the contents using `cat` or `hexdump`. Decrypt it with `openssl aes-256-cbc
    -d -in {input filename} -out {output filename}` and confirm that the contents
    match the original using `cmp`.'
  id: totrans-75
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**对称加密。**使用AES加密对文件进行加密，使用[OpenSSL](https://www.openssl.org/)：`openssl aes-256-cbc
    -salt -in {输入文件名} -out {输出文件名}`。使用`cat`或`hexdump`查看内容。使用`openssl aes-256-cbc -d
    -in {输入文件名} -out {输出文件名}`进行解密，并使用`cmp`确认内容与原始文件匹配。'
- en: '**Asymmetric cryptography.**'
  id: totrans-76
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '**非对称加密。**'
- en: Set up [SSH keys](https://www.digitalocean.com/community/tutorials/how-to-set-up-ssh-keys--2)
    on a computer you have access to (not Athena, because Kerberos interacts weirdly
    with SSH keys). Make sure your private key is encrypted with a passphrase, so
    it is protected at rest.
  id: totrans-77
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在你可以访问的计算机上设置[SSH密钥](https://www.digitalocean.com/community/tutorials/how-to-set-up-ssh-keys--2)（不是Athena，因为Kerberos与SSH密钥交互异常）。确保你的私钥使用密码加密，以便在静止状态下得到保护。
- en: '[Set up GPG](https://www.digitalocean.com/community/tutorials/how-to-use-gpg-to-encrypt-and-sign-messages)'
  id: totrans-78
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[设置GPG](https://www.digitalocean.com/community/tutorials/how-to-use-gpg-to-encrypt-and-sign-messages)'
- en: Send Anish an encrypted email ([public key](https://keybase.io/anish)).
  id: totrans-79
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 向Anish发送加密邮件（[公钥](https://keybase.io/anish)）。
- en: Sign a Git commit with `git commit -S` or create a signed Git tag with `git
    tag -s`. Verify the signature on the commit with `git show --show-signature` or
    on the tag with `git tag -v`.
  id: totrans-80
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用`git commit -S`签署Git提交或使用`git tag -s`创建签署的Git标签。使用`git show --show-signature`在提交上或使用`git
    tag -v`在标签上验证签名。
