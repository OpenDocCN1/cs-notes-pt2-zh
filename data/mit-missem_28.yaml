- en: Security and Cryptography
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 安全和密码学
- en: 原文：[https://missing.csail.mit.edu/2020/security/](https://missing.csail.mit.edu/2020/security/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://missing.csail.mit.edu/2020/security/](https://missing.csail.mit.edu/2020/security/)
- en: Last year’s [security and privacy lecture](/2019/security/) focused on how you
    can be more secure as a computer *user*. This year, we will focus on security
    and cryptography concepts that are relevant in understanding tools covered earlier
    in this class, such as the use of hash functions in Git or key derivation functions
    and symmetric/asymmetric cryptosystems in SSH.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 去年的[安全和隐私讲座](/2019/security/)重点介绍了你作为计算机*用户*如何变得更安全。今年，我们将关注与理解本课程早期介绍的工具相关的安全和密码学概念，例如Git中哈希函数的使用或SSH中的密钥派生函数和对称/非对称加密系统。
- en: This lecture is not a substitute for a more rigorous and complete course on
    computer systems security ([6.858](https://css.csail.mit.edu/6.858/)) or cryptography
    ([6.857](https://courses.csail.mit.edu/6.857/) and 6.875). Don’t do security work
    without formal training in security. Unless you’re an expert, don’t [roll your
    own crypto](https://www.schneier.com/blog/archives/2015/05/amateurs_produc.html).
    The same principle applies to systems security.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 这场讲座不能替代更严格和完整的计算机系统安全([6.858](https://css.csail.mit.edu/6.858/))或密码学([6.857](https://courses.csail.mit.edu/6.857/)和6.875)课程。在没有正式安全培训的情况下不要进行安全工作。除非你是专家，否则不要[自己实现密码学](https://www.schneier.com/blog/archives/2015/05/amateurs_produc.html)。同样的原则也适用于系统安全。
- en: This lecture has a very informal (but we think practical) treatment of basic
    cryptography concepts. This lecture won’t be enough to teach you how to *design*
    secure systems or cryptographic protocols, but we hope it will be enough to give
    you a general understanding of the programs and protocols you already use.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 这场讲座对基本密码学概念进行了非常非正式（但我们认为实用）的处理。这场讲座不足以教你如何*设计*安全系统或密码协议，但我们希望它足以让你对已经使用的程序和协议有一个一般性的理解。
- en: Entropy
  id: totrans-5
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 熵
- en: '[Entropy](https://en.wikipedia.org/wiki/Entropy_(information_theory)) is a
    measure of randomness. This is useful, for example, when determining the strength
    of a password.'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: '[熵](https://en.wikipedia.org/wiki/Entropy_(information_theory))是随机性的度量。这在确定密码强度时很有用。'
- en: '![XKCD 936: Password Strength](../Images/be970f21223af9cf2788cfb344bc4b0e.png)'
  id: totrans-7
  prefs: []
  type: TYPE_IMG
  zh: '![XKCD 936: 密码强度](../Images/be970f21223af9cf2788cfb344bc4b0e.png)'
- en: As the above [XKCD comic](https://xkcd.com/936/) illustrates, a password like
    “correcthorsebatterystaple” is more secure than one like “Tr0ub4dor&3”. But how
    do you quantify something like this?
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 如上[XKCD漫画](https://xkcd.com/936/)所示，像“correcthorsebatterystaple”这样的密码比像“Tr0ub4dor&3”这样的密码更安全。但如何量化这种东西呢？
- en: Entropy is measured in *bits*, and when selecting uniformly at random from a
    set of possible outcomes, the entropy is equal to `log_2(# of possibilities)`.
    A fair coin flip gives 1 bit of entropy. A dice roll (of a 6-sided die) has ~2.58
    bits of entropy.
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 熵以*比特*为单位进行测量，当从一组可能的结果中均匀随机选择时，熵等于`log_2(可能性数量)`。公平的硬币抛掷给出1比特的熵。掷骰子（六面骰子）大约有2.58比特的熵。
- en: You should consider that the attacker knows the *model* of the password, but
    not the randomness (e.g. from [dice rolls](https://en.wikipedia.org/wiki/Diceware))
    used to select a particular password.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 你应该考虑攻击者知道密码的*模型*，但不知道用于选择特定密码的随机性（例如来自[dice rolls](https://en.wikipedia.org/wiki/Diceware)）。
- en: How many bits of entropy is enough? It depends on your threat model. For online
    guessing, as the XKCD comic points out, ~40 bits of entropy is pretty good. To
    be resistant to offline guessing, a stronger password would be necessary (e.g.
    80 bits, or more).
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 需要多少比特的熵才足够？这取决于你的威胁模型。正如XKCD漫画所指出的，大约40比特的熵相当不错。为了抵抗离线猜测，需要更强的密码（例如80比特，或更多）。
- en: Hash functions
  id: totrans-12
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 哈希函数
- en: 'A [cryptographic hash function](https://en.wikipedia.org/wiki/Cryptographic_hash_function)
    maps data of arbitrary size to a fixed size, and has some special properties.
    A rough specification of a hash function is as follows:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 一种[加密哈希函数](https://en.wikipedia.org/wiki/Cryptographic_hash_function)将任意大小的数据映射到固定大小，并具有一些特殊属性。一个哈希函数的大致规范如下：
- en: '[PRE0]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'An example of a hash function is [SHA1](https://en.wikipedia.org/wiki/SHA-1),
    which is used in Git. It maps arbitrary-sized inputs to 160-bit outputs (which
    can be represented as 40 hexadecimal characters). We can try out the SHA1 hash
    on an input using the `sha1sum` command:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 一个哈希函数的例子是[SHA1](https://en.wikipedia.org/wiki/SHA-1)，它在Git中使用。它将任意大小的输入映射到160位的输出（可以表示为40个十六进制字符）。我们可以使用`sha1sum`命令尝试对输入进行SHA1哈希：
- en: '[PRE1]'
  id: totrans-16
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'At a high level, a hash function can be thought of as a hard-to-invert random-looking
    (but deterministic) function (and this is the [ideal model of a hash function](https://en.wikipedia.org/wiki/Random_oracle)).
    A hash function has the following properties:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 在高层次上，哈希函数可以被视为一个难以逆推的看似随机的（但确定性的）函数（这就是哈希函数的[理想模型](https://en.wikipedia.org/wiki/Random_oracle)）。哈希函数具有以下特性：
- en: 'Deterministic: the same input always generates the same output.'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 确定性：相同的输入总是生成相同的输出。
- en: 'Non-invertible: it is hard to find an input `m` such that `hash(m) = h` for
    some desired output `h`.'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 不可逆：很难找到一个输入`m`，使得对于某个期望的输出`h`，有`hash(m) = h`。
- en: 'Target collision resistant: given an input `m_1`, it’s hard to find a different
    input `m_2` such that `hash(m_1) = hash(m_2)`.'
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 目标碰撞抵抗：给定一个输入`m_1`，很难找到一个不同的输入`m_2`，使得`hash(m_1) = hash(m_2)`。
- en: 'Collision resistant: it’s hard to find two inputs `m_1` and `m_2` such that
    `hash(m_1) = hash(m_2)` (note that this is a strictly stronger property than target
    collision resistance).'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 抗碰撞：很难找到两个输入`m_1`和`m_2`，使得`hash(m_1) = hash(m_2)`（注意，这比目标碰撞抵抗是一个更强的特性）。
- en: 'Note: while it may work for certain purposes, SHA-1 is [no longer](https://web.archive.org/web/20260207211148/https://shattered.io/)
    considered a strong cryptographic hash function. You might find this table of
    [lifetimes of cryptographic hash functions](https://valerieaurora.org/hash.html)
    interesting. However, note that recommending specific hash functions is beyond
    the scope of this lecture. If you are doing work where this matters, you need
    formal training in security/cryptography.'
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 注意：虽然它可能适用于某些目的，但SHA-1已不再被认为是强大的加密哈希函数。[不再使用](https://web.archive.org/web/20260207211148/https://shattered.io/)。你可能对[加密哈希函数的寿命表](https://valerieaurora.org/hash.html)感兴趣。然而，请注意，推荐特定的哈希函数超出了本次讲座的范围。如果你在进行与此相关的工作，你需要接受安全/密码学的正规培训。
- en: Applications
  id: totrans-23
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 应用
- en: Git, for content-addressed storage. The idea of a [hash function](https://en.wikipedia.org/wiki/Hash_function)
    is a more general concept (there are non-cryptographic hash functions). Why does
    Git use a cryptographic hash function?
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: Git，用于内容地址存储。哈希函数的概念是一个更通用的概念（存在非加密哈希函数）。为什么Git使用加密哈希函数？
- en: A short summary of the contents of a file. Software can often be downloaded
    from (potentially less trustworthy) mirrors, e.g. Linux ISOs, and it would be
    nice to not have to trust them. The official sites usually post hashes alongside
    the download links (that point to third-party mirrors), so that the hash can be
    checked after downloading a file.
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 文件内容的简要总结。软件通常可以从（可能不太可靠的）镜像站点下载，例如Linux ISO，而且最好不需要信任它们。官方站点通常会在下载链接（指向第三方镜像）旁边发布哈希值，以便在下载文件后可以检查哈希值。
- en: '[Commitment schemes](https://en.wikipedia.org/wiki/Commitment_scheme). Suppose
    you want to commit to a particular value, but reveal the value itself later. For
    example, I want to do a fair coin toss “in my head”, without a trusted shared
    coin that two parties can see. I could choose a value `r = random()`, and then
    share `h = sha256(r)`. Then, you could call heads or tails (we’ll agree that even
    `r` means heads, and odd `r` means tails). After you call, I can reveal my value
    `r`, and you can confirm that I haven’t cheated by checking `sha256(r)` matches
    the hash I shared earlier.'
  id: totrans-26
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[承诺方案](https://en.wikipedia.org/wiki/Commitment_scheme)。假设你想对某个特定值进行承诺，但稍后才会揭示该值。例如，我想在“我脑海中”进行公平的硬币投掷，而不需要一个双方都能看到的可信共享硬币。我可以选择一个值`r
    = random()`，然后分享`h = sha256(r)`。然后，你可以叫正面或反面（我们将同意`r`为偶数表示正面，奇数表示反面）。在你叫出之后，我可以揭示我的值`r`，你可以通过检查`sha256(r)`是否与之前分享的哈希值匹配来确认我没有作弊。'
- en: Key derivation functions
  id: totrans-27
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 密钥派生函数
- en: A related concept to cryptographic hashes, [key derivation functions](https://en.wikipedia.org/wiki/Key_derivation_function)
    (KDFs) are used for a number of applications, including producing fixed-length
    output for use as keys in other cryptographic algorithms. Usually, KDFs are deliberately
    slow, in order to slow down offline brute-force attacks.
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 与加密哈希相关的一个概念是[密钥派生函数](https://en.wikipedia.org/wiki/Key_derivation_function)（KDFs），它们用于许多应用，包括为其他加密算法生成固定长度的输出作为密钥。通常，KDFs会故意设计得较慢，以减缓离线暴力攻击。
- en: Applications
  id: totrans-29
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 应用
- en: Producing keys from passphrases for use in other cryptographic algorithms (e.g.
    symmetric cryptography, see below).
  id: totrans-30
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 从密码短语生成密钥，用于其他加密算法（例如，对称加密，见下文）。
- en: Storing login credentials. Storing plaintext passwords is bad; the right approach
    is to generate and store a random [salt](https://en.wikipedia.org/wiki/Salt_(cryptography))
    `salt = random()` for each user, store `KDF(password + salt)`, and verify login
    attempts by re-computing the KDF given the entered password and the stored salt.
  id: totrans-31
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 存储登录凭证。存储明文密码是错误的；正确的方法是为每个用户生成和存储一个随机的 [盐](https://en.wikipedia.org/wiki/Salt_(cryptography))
    `salt = random()`，存储 `KDF(password + salt)`，并通过重新计算KDF来验证登录尝试，给定输入的密码和存储的盐。
- en: Symmetric cryptography
  id: totrans-32
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 对称密码学
- en: 'Hiding message contents is probably the first concept you think about when
    you think about cryptography. Symmetric cryptography accomplishes this with the
    following set of functionality:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 在考虑密码学时，隐藏消息内容可能是您首先想到的概念。对称密码学通过以下功能集实现这一点：
- en: '[PRE2]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: The encrypt function has the property that given the output (ciphertext), it’s
    hard to determine the input (plaintext) without the key. The decrypt function
    has the obvious correctness property, that `decrypt(encrypt(m, k), k) = m`.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 加密函数具有以下属性：给定输出（密文），如果没有密钥，很难确定输入（明文）。解密函数具有明显的正确性属性，即 `decrypt(encrypt(m, k),
    k) = m`。
- en: An example of a symmetric cryptosystem in wide use today is [AES](https://en.wikipedia.org/wiki/Advanced_Encryption_Standard).
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 目前广泛使用的对称密码系统的一个例子是 [AES](https://en.wikipedia.org/wiki/Advanced_Encryption_Standard)。
- en: Applications
  id: totrans-37
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 应用
- en: Encrypting files for storage in an untrusted cloud service. This can be combined
    with KDFs, so you can encrypt a file with a passphrase. Generate `key = KDF(passphrase)`,
    and then store `encrypt(file, key)`.
  id: totrans-38
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 将文件加密以存储在不信任的云服务中。这可以与KDFs结合使用，因此您可以使用密码加密文件。生成 `key = KDF(passphrase)`，然后存储
    `encrypt(file, key)`。
- en: Asymmetric cryptography
  id: totrans-39
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 非对称密码学
- en: 'The term “asymmetric” refers to there being two keys, with two different roles.
    A private key, as its name implies, is meant to be kept private, while the public
    key can be publicly shared and it won’t affect security (unlike sharing the key
    in a symmetric cryptosystem). Asymmetric cryptosystems provide the following set
    of functionality, to encrypt/decrypt and to sign/verify:'
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: “非对称”一词指的是存在两个密钥，它们具有不同的角色。私钥，正如其名称所暗示的，意味着应该保持私密，而公钥可以公开共享，这不会影响安全性（与对称密码系统中的密钥共享不同）。非对称密码系统提供以下功能集，用于加密/解密和签名/验证：
- en: '[PRE3]'
  id: totrans-41
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: The encrypt/decrypt functions have properties similar to their analogs from
    symmetric cryptosystems. A message can be encrypted using the *public* key. Given
    the output (ciphertext), it’s hard to determine the input (plaintext) without
    the *private* key. The decrypt function has the obvious correctness property,
    that `decrypt(encrypt(m, public key), private key) = m`.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 加密/解密函数具有与对称密码系统中的类似属性。可以使用 *公钥* 加密一条消息。给定输出（密文），如果没有 *私钥*，很难确定输入（明文）。解密函数具有明显的正确性属性，即
    `decrypt(encrypt(m, public key), private key) = m`。
- en: 'Symmetric and asymmetric encryption can be compared to physical locks. A symmetric
    cryptosystem is like a door lock: anyone with the key can lock and unlock it.
    Asymmetric encryption is like a padlock with a key. You could give the unlocked
    lock to someone (the public key), they could put a message in a box and then put
    the lock on, and after that, only you could open the lock because you kept the
    key (the private key).'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 对称加密和非对称加密可以与物理锁进行比较。对称密码系统就像一个门锁：任何拥有密钥的人都可以锁定和解锁它。非对称加密就像一个带钥匙的挂锁。您可以给某人一把未锁的锁（公钥），他们可以将信息放入一个盒子中，然后锁上，之后，只有您才能打开锁，因为您保留了钥匙（私钥）。
- en: The sign/verify functions have the same properties that you would hope physical
    signatures would have, in that it’s hard to forge a signature. No matter the message,
    without the *private* key, it’s hard to produce a signature such that `verify(message,
    signature, public key)` returns true. And of course, the verify function has the
    obvious correctness property that `verify(message, sign(message, private key),
    public key) = true`.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 签名/验证函数具有您希望物理签名具有的相同属性，即很难伪造签名。无论消息如何，如果没有 *私钥*，很难生成一个签名，使得 `verify(message,
    signature, public key)` 返回 true。当然，验证函数具有明显的正确性属性，即 `verify(message, sign(message,
    private key), public key) = true`。
- en: Applications
  id: totrans-45
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 应用
- en: '[PGP email encryption](https://en.wikipedia.org/wiki/Pretty_Good_Privacy).
    People can have their public keys posted online (e.g. in a PGP keyserver, or on
    [Keybase](https://keybase.io/)). Anyone can send them encrypted email.'
  id: totrans-46
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[PGP电子邮件加密](https://en.wikipedia.org/wiki/Pretty_Good_Privacy)。人们可以将他们的公钥发布在网上（例如，在PGP密钥服务器上或在[Keybase](https://keybase.io/）上）。任何人都可以发送加密电子邮件。'
- en: Private messaging. Apps like [Signal](https://signal.org/) and [Keybase](https://keybase.io/)
    use asymmetric keys to establish private communication channels.
  id: totrans-47
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 私人消息。像 [Signal](https://signal.org/) 和 [Keybase](https://keybase.io/) 这样的应用程序使用非对称密钥来建立私人通信通道。
- en: Signing software. Git can have GPG-signed commits and tags. With a posted public
    key, anyone can verify the authenticity of downloaded software.
  id: totrans-48
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 签名软件。Git 可以有 GPG 签名的提交和标签。通过发布的公钥，任何人都可以验证下载的软件的真实性。
- en: Key distribution
  id: totrans-49
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 密钥分发
- en: 'Asymmetric-key cryptography is wonderful, but it has a big challenge of distributing
    public keys / mapping public keys to real-world identities. There are many solutions
    to this problem. Signal has one simple solution: trust on first use, and support
    out-of-band public key exchange (you verify your friends’ “safety numbers” in
    person). PGP has a different solution, which is [web of trust](https://en.wikipedia.org/wiki/Web_of_trust).
    Keybase has yet another solution of [social proof](https://keybase.io/blog/chat-apps-softer-than-tofu)
    (along with other neat ideas). Each model has its merits; we (the instructors)
    like Keybase’s model.'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 非对称密钥加密非常出色，但它面临着将公钥/将公钥映射到现实世界身份的大挑战。针对这个问题有许多解决方案。Signal 提供了一个简单的解决方案：首次使用时信任，并支持带外公钥交换（你亲自验证你朋友的“安全号码”）。PGP
    有一个不同的解决方案，即[信任网](https://en.wikipedia.org/wiki/Web_of_trust)。Keybase 还有一个不同的解决方案，即[社会证明](https://keybase.io/blog/chat-apps-softer-than-tofu)（以及其他一些巧妙的想法）。每种模型都有其优点；我们（讲师）喜欢
    Keybase 的模型。
- en: Case studies
  id: totrans-51
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 案例研究
- en: Password managers
  id: totrans-52
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 密码管理器
- en: This is an essential tool that everyone should try to use (e.g. [KeePassXC](https://keepassxc.org/),
    [pass](https://git.zx2c4.com/password-store/about/), and [1Password](https://1password.com)).
    Password managers make it convenient to use unique, randomly generated high-entropy
    passwords for all your logins, and they save all your passwords in one place,
    encrypted with a symmetric cipher with a key produced from a passphrase using
    a KDF.
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 这是一个每个人都应该尝试使用的必备工具（例如 [KeePassXC](https://keepassxc.org/)，[pass](https://git.zx2c4.com/password-store/about/)，和
    [1Password](https://1password.com)）。密码管理器使得使用唯一、随机生成的高熵密码来管理所有登录变得方便，并且它们将所有密码保存在一个地方，使用从口令生成密钥的对称加密算法加密。
- en: Using a password manager lets you avoid password reuse (so you’re less impacted
    when websites get compromised), use high-entropy passwords (so you’re less likely
    to get compromised), and only need to remember a single high-entropy password.
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 使用密码管理器让你避免密码重复使用（因此当网站被入侵时影响较小），使用高熵密码（因此你被入侵的可能性较小），并且只需要记住一个高熵密码。
- en: Two-factor authentication
  id: totrans-55
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 双因素认证
- en: '[Two-factor authentication](https://en.wikipedia.org/wiki/Multi-factor_authentication)
    (2FA) requires you to use a passphrase (“something you know”) along with a 2FA
    authenticator (like a [YubiKey](https://www.yubico.com/), “something you have”)
    in order to protect against stolen passwords and [phishing](https://en.wikipedia.org/wiki/Phishing)
    attacks.'
  id: totrans-56
  prefs: []
  type: TYPE_NORMAL
  zh: '[双因素认证](https://en.wikipedia.org/wiki/Multi-factor_authentication)（2FA）要求你使用一个口令（“你知道的某物”）以及一个
    2FA 认证器（例如 [YubiKey](https://www.yubico.com/)，“你拥有的某物”），以防止被盗密码和[钓鱼攻击](https://en.wikipedia.org/wiki/Phishing)。'
- en: Full disk encryption
  id: totrans-57
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 全盘加密
- en: Keeping your laptop’s entire disk encrypted is an easy way to protect your data
    in the case that your laptop is stolen. You can use [cryptsetup + LUKS](https://wiki.archlinux.org/index.php/Dm-crypt/Encrypting_a_non-root_file_system)
    on Linux, [BitLocker](https://fossbytes.com/enable-full-disk-encryption-windows-10/)
    on Windows, or [FileVault](https://support.apple.com/en-us/HT204837) on macOS.
    This encrypts the entire disk with a symmetric cipher, with a key protected by
    a passphrase.
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 保持笔记本电脑整个磁盘加密是保护数据的一种简单方法，以防你的笔记本电脑被盗。你可以在 Linux 上使用 [cryptsetup + LUKS](https://wiki.archlinux.org/index.php/Dm-crypt/Encrypting_a_non-root_file_system)，在
    Windows 上使用 [BitLocker](https://fossbytes.com/enable-full-disk-encryption-windows-10/)，或在
    macOS 上使用 [FileVault](https://support.apple.com/en-us/HT204837)。这将使用对称加密算法加密整个磁盘，密钥由口令保护。
- en: Private messaging
  id: totrans-59
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 私人消息
- en: Use [Signal](https://signal.org/) or [Keybase](https://keybase.io/). End-to-end
    security is bootstrapped from asymmetric-key encryption. Obtaining your contacts’
    public keys is the critical step here. If you want good security, you need to
    authenticate public keys out-of-band (with Signal or Keybase), or trust social
    proofs (with Keybase).
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 [Signal](https://signal.org/) 或 [Keybase](https://keybase.io/)。端到端安全是从非对称密钥加密开始的。获取你联系人的公钥是这里的关键步骤。如果你想获得良好的安全性，你需要通过带外方式（使用
    Signal 或 Keybase）验证公钥，或者信任社会证明（使用 Keybase）。
- en: SSH
  id: totrans-61
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: SSH
- en: We’ve covered the use of SSH and SSH keys in an [earlier lecture](/2020/command-line/#remote-machines).
    Let’s look at the cryptography aspects of this.
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 我们在[之前的讲座](/2020/command-line/#remote-machines)中介绍了SSH和SSH密钥的使用。让我们看看这个的密码学方面。
- en: When you run `ssh-keygen`, it generates an asymmetric key pair, `public_key,
    private_key`. This is generated randomly, using entropy provided by the operating
    system (collected from hardware events, etc.). The public key is stored as-is
    (it’s public, so keeping it a secret is not important), but at rest, the private
    key should be encrypted on disk. The `ssh-keygen` program prompts the user for
    a passphrase, and this is fed through a key derivation function to produce a key,
    which is then used to encrypt the private key with a symmetric cipher.
  id: totrans-63
  prefs: []
  type: TYPE_NORMAL
  zh: 当你运行 `ssh-keygen` 时，它会生成一个非对称密钥对，`public_key, private_key`。这是随机生成的，使用操作系统提供的熵（从硬件事件等收集）。公钥以原样存储（它是公开的，所以保密并不重要），但在静止状态下，私钥应该在磁盘上加密。`ssh-keygen`
    程序提示用户输入一个口令短语，然后通过密钥派生函数生成一个密钥，该密钥随后用于使用对称加密算法加密私钥。
- en: In use, once the server knows the client’s public key (stored in the `.ssh/authorized_keys`
    file), a connecting client can prove its identity using asymmetric signatures.
    This is done through [challenge-response](https://en.wikipedia.org/wiki/Challenge%E2%80%93response_authentication).
    At a high level, the server picks a random number and sends it to the client.
    The client then signs this message and sends the signature back to the server,
    which checks the signature against the public key on record. This effectively
    proves that the client is in possession of the private key corresponding to the
    public key that’s in the server’s `.ssh/authorized_keys` file, so the server can
    allow the client to log in.
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 在使用中，一旦服务器知道客户端的公钥（存储在`.ssh/authorized_keys`文件中），连接的客户端可以使用非对称签名来证明其身份。这是通过[挑战-响应](https://en.wikipedia.org/wiki/Challenge%E2%80%93response_authentication)来完成的。在高层上，服务器选择一个随机数并发送给客户端。客户端然后对这条消息进行签名并发送签名回服务器，服务器将签名与记录中的公钥进行比对。这实际上证明了客户端拥有与服务器`.ssh/authorized_keys`文件中的公钥相对应的私钥，因此服务器可以允许客户端登录。
