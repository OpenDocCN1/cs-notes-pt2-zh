- en: Machine Introspection
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 硬件自我检查
- en: 原文：[https://missing.csail.mit.edu/2019/machine-introspection/](https://missing.csail.mit.edu/2019/machine-introspection/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[https://missing.csail.mit.edu/2019/machine-introspection/](https://missing.csail.mit.edu/2019/machine-introspection/)'
- en: Sometimes, computers misbehave. And very often, you want to know why. Let’s
    look at some tools that help you do that!
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 有时候，计算机会表现异常。而且，你通常想知道为什么会这样。让我们看看一些可以帮助你做到这一点的工具！
- en: But first, let’s make sure you’re able to do introspection. Often, system introspection
    requires that you have certain privileges, like being the member of a group (like
    `power` for shutdown). The `root` user has the ultimate privilege; they can do
    pretty much anything. You can run a command as `root` (but be careful!) using
    `sudo`.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 但首先，让我们确保你能够进行自我检查。通常，系统自我检查需要你拥有某些权限，比如成为某个组（如 `power` 用于关机）的成员。`root` 用户拥有最高权限；他们几乎可以做任何事情。你可以使用
    `sudo` 以 `root` 用户身份运行命令（但请小心！）。
- en: What happened?
  id: totrans-4
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 发生了什么？
- en: If something goes wrong, the first place to start is to look at what happened
    around the time when things went wrong. For this, we need to look at logs.
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 如果出现问题，首先要查看事情出错时的情况。为此，我们需要查看日志。
- en: Traditionally, logs were all stored in `/var/log`, and many still are. Usually
    there’s a file or folder per program. Use `grep` or `less` to find your way through
    them.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 传统上，日志都存储在 `/var/log` 中，许多系统仍然如此。通常每个程序都有一个文件或文件夹。使用 `grep` 或 `less` 来浏览它们。
- en: There’s also a kernel log that you can see using the `dmesg` command. This used
    to be available as a plain-text file, but nowadays you often have to go through
    `dmesg` to get at it.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 此外，你还可以使用 `dmesg` 命令查看内核日志。这曾经是一个纯文本文件，但如今你通常需要通过 `dmesg` 来访问它。
- en: Finally, there is the “system log”, which is increasingly where all of your
    log messages go. On *most*, though not all, Linux systems, that log is managed
    by `systemd`, the “system daemon”, which controls all the services that run in
    the background (and much much more at this point). That log is accessible through
    the somewhat inconvenient `journalctl` tool if you are root, or part of the `admin`
    or `wheel` groups.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，是“系统日志”，这通常是所有日志消息的去处。在大多数（但不全是）Linux 系统上，该日志由 `systemd`（“系统守护进程”）管理，它控制所有在后台运行的（以及更多）服务。如果你是
    root 用户或 `admin` 或 `wheel` 组的成员，可以通过 `journalctl` 工具访问该日志，尽管使用起来有些不便。
- en: 'For `journalctl`, you should be aware of these flags in particular:'
  id: totrans-9
  prefs: []
  type: TYPE_NORMAL
  zh: 对于 `journalctl`，你应该特别注意以下标志：
- en: '`-u UNIT`: show only messages related to the given systemd service'
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`-u UNIT`: 仅显示与指定 systemd 服务相关的消息'
- en: '`--full`: don’t truncate long lines (the stupidest feature)'
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`--full`: 不截断长行（最愚蠢的功能）'
- en: '`-b`: only show messages from the latest boot (see also `-b -2`)'
  id: totrans-12
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`-b`: 仅显示最新引导的消息（也见 `-b -2`）'
- en: '`-n100`: only show last 100 entries'
  id: totrans-13
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`-n100`: 仅显示最后 100 条记录'
- en: What is happening?
  id: totrans-14
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 发生了什么？
- en: 'If something *is* wrong, or you just want to get a feel for what’s going on
    in your system, you have a number of tools at your disposal for inspecting the
    currently running system:'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 如果有错误发生，或者你只是想了解系统中的情况，你可以使用一些工具来检查当前运行的系统：
- en: First, there’s `top`, and the improved version `htop`, which show you various
    statistics for the currently running processes on the system. CPU use, memory
    use, process trees, etc. There are lots of shortcuts, but `t` is particularly
    useful for enabling the tree view. You can also see the process tree with `pstree`
    (+ `-p` to include PIDs). If you want to know what those programs are doing, you’ll
    often want to tail their log files. `journalctl -f`, `dmesg -w`, and `tail -f`
    are you friends here.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，有 `top` 和改进版的 `htop`，它们显示了系统当前运行进程的各种统计信息。CPU 使用率、内存使用率、进程树等。有很多快捷键，但 `t`
    用于启用树视图特别有用。你还可以使用 `pstree`（+ `-p` 包括 PIDs）查看进程树。如果你想知道这些程序在做什么，你通常会想查看它们的日志文件。`journalctl
    -f`、`dmesg -w` 和 `tail -f` 是这里的帮手。
- en: Sometimes, you want to know more about the resources being used overall on your
    system. [`dool`](https://github.com/scottchiefbaker/dool) is excellent for that.
    It gives you real-time resource metrics for lots of different subsystems like
    I/O, networking, CPU utilization, context switches, and the like. `man dool` is
    the place to start.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 有时候，你可能想了解系统整体使用的资源。`dool`（[https://github.com/scottchiefbaker/dool](https://github.com/scottchiefbaker/dool)）在这方面非常出色。它为你提供了许多不同子系统（如
    I/O、网络、CPU 利用率、上下文切换等）的实时资源指标。`man dool` 是开始的地方。
- en: 'If you’re running out of disk space, there are two primary utilities you’ll
    want to know about: `df` and `du`. The former shows you the status of all the
    partitions on your system (try it with `-h`), whereas the latter measures the
    size of all the folders you give it, including their contents (see also `-h` and
    `-s`).'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你快用完磁盘空间了，有两个主要的实用工具你可能需要了解：`df`和`du`。前者显示了系统上所有分区的状态（尝试使用`-h`），而后者测量你给出的所有文件夹的大小，包括其内容（也请参阅`-h`和`-s`）。
- en: To figure out what network connections you have open, `ss` is the way to go.
    `ss -t` will show all open TCP connections. `ss -tl` will show all listening (i.e.,
    server) ports on your system. `-p` will also include which process is using that
    connection, and `-n` will give you the raw port numbers.
  id: totrans-19
  prefs: []
  type: TYPE_NORMAL
  zh: 要找出你打开了哪些网络连接，`ss`是最佳选择。`ss -t`会显示所有打开的TCP连接。`ss -tl`会显示系统上所有监听（即服务器）端口。`-p`会包括使用该连接的进程，而`-n`会给你原始端口号。
- en: System configuration
  id: totrans-20
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 系统配置
- en: 'There are *many* ways to configure your system, but we’ll go through two very
    common ones: networking and services. Most applications on your system tell you
    how to configure them in their manpage, and usually it will involve editing files
    in `/etc`; the system configuration directory.'
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 配置系统有多种方法，但我们将介绍两种非常常见的方法：网络和服务。你系统上的大多数应用程序在其manpage中都会告诉你如何配置它们，通常这会涉及到编辑`/etc`中的文件；系统配置目录。
- en: If you want to configure your network, the `ip` command lets you do that. Its
    arguments take on a slightly weird form, but `ip help command` will get you pretty
    far. `ip addr` shows you information about your network interfaces and how they’re
    configured (IP addresses and such), and `ip route` shows you how network traffic
    is routed to different network hosts. Network problems can often be resolved purely
    through the `ip` tool. There’s also `iw` for managing wireless network interfaces.
    `ping` is a handy tool for checking how deeply things are broken. Try pinging
    a hostname (google.com), an external IP address (1.1.1.1), and an internal IP
    address (192.168.1.1 or default gw). You may also want to fiddle with `/etc/resolv.conf`
    to check your DNS settings (how hostnames are resolved to IP addresses).
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你想要配置你的网络，`ip`命令可以让你做到这一点。它的参数采用了一种稍微奇怪的形式，但`ip help command`会带你走得很远。`ip addr`会显示你的网络接口及其配置信息（IP地址等），而`ip
    route`会显示网络流量是如何路由到不同的网络主机的。网络问题通常可以通过`ip`工具完全解决。还有`iw`用于管理无线网络接口。`ping`是一个检查事物损坏程度的实用工具。尝试ping一个主机名（google.com），一个外部IP地址（1.1.1.1），以及一个内部IP地址（192.168.1.1或默认网关）。你可能还想调整`/etc/resolv.conf`来检查你的DNS设置（主机名如何解析为IP地址）。
- en: To configure services, you pretty much have to interact with `systemd` these
    days, for better or for worse. Most services on your system will have a systemd
    service file that defines a systemd *unit*. These files define what command to
    run when that services is started, how to stop it, where to log things, etc. They’re
    usually not too bad to read, and you can find most of them in `/usr/lib/systemd/system/`.
    You can also define your own in `/etc/systemd/system` .
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 要配置服务，现在你几乎不得不与`systemd`进行交互，不管好坏。你系统上的大多数服务都将有一个systemd服务文件，它定义了一个systemd *unit*。这些文件定义了在启动该服务时运行什么命令，如何停止它，在哪里记录日志等。它们通常不难阅读，你可以在`/usr/lib/systemd/system/`中找到大部分。你也可以在`/etc/systemd/system`中定义自己的。
- en: Once you have a systemd service in mind, you use the `systemctl` command to
    interact with it. `systemctl enable UNIT` will set the service to start on boot
    (`disable` removes it again), and `start`, `stop`, and `restart` will do what
    you expect. If something goes wrong, systemd will let you know, and you can use
    `journalctl -u UNIT` to see the application’s log. You can also use `systemctl
    status` to see how all your system services are doing. If your boot feels slow,
    it’s probably due to a couple of slow services, and you can use `systemd-analyze`
    (try it with `blame`) to figure out which ones.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦你有了systemd服务的想法，你就使用`systemctl`命令与之交互。`systemctl enable UNIT`会将服务设置为启动时启动（`disable`会再次将其移除），而`start`、`stop`和`restart`会做你期望的事情。如果出了问题，systemd会通知你，你可以使用`journalctl
    -u UNIT`来查看应用程序的日志。你也可以使用`systemctl status`来查看所有系统服务的情况。如果你的启动感觉很慢，那可能是因为有几个服务运行缓慢，你可以使用`systemd-analyze`（尝试使用`blame`）来找出是哪些服务。
