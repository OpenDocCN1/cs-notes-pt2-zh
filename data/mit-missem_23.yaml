- en: Data Wrangling
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 数据整理
- en: 原文：[https://missing.csail.mit.edu/2020/data-wrangling/](https://missing.csail.mit.edu/2020/data-wrangling/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[https://missing.csail.mit.edu/2020/data-wrangling/](https://missing.csail.mit.edu/2020/data-wrangling/)'
- en: Have you ever wanted to take data in one format and turn it into a different
    format? Of course you have! That, in very general terms, is what this lecture
    is all about. Specifically, massaging data, whether in text or binary format,
    until you end up with exactly what you wanted.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 你是否曾经想要将一种格式的数据转换为另一种格式？当然，你肯定有！在非常一般的意义上，这正是本讲座的主题。具体来说，就是将数据（无论是文本还是二进制格式）处理成你想要的样子。
- en: We’ve already seen some basic data wrangling in past lectures. Pretty much any
    time you use the `|` operator, you are performing some kind of data wrangling.
    Consider a command like `journalctl | grep -i intel`. It finds all system log
    entries that mention Intel (case insensitive). You may not think of it as wrangling
    data, but it is going from one format (your entire system log) to a format that
    is more useful to you (just the intel log entries). Most data wrangling is about
    knowing what tools you have at your disposal, and how to combine them.
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经在之前的讲座中看到了一些基本的数据整理。几乎每次你使用 `|` 操作符时，你都在执行某种数据整理。考虑一个像 `journalctl | grep
    -i intel` 这样的命令。它找到所有提及 Intel（不区分大小写）的系统日志条目。你可能不会把它看作是数据整理，但它确实是从一个格式（你的整个系统日志）转换到一个对你更有用的格式（仅仅是
    intel 日志条目）。大多数数据整理都是关于知道你有什么工具可用，以及如何组合它们。
- en: 'Let’s start from the beginning. To wrangle data, we need two things: data to
    wrangle, and something to do with it. Logs often make for a good use-case, because
    you often want to investigate things about them, and reading the whole thing isn’t
    feasible. Let’s figure out who’s trying to log into my server by looking at my
    server’s log:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们从一开始。要整理数据，我们需要两样东西：要整理的数据，以及处理它的东西。日志通常是一个很好的用例，因为你经常想要调查它们，而阅读整个日志是不切实际的。让我们通过查看我的服务器日志来找出谁试图登录我的服务器：
- en: '[PRE0]'
  id: totrans-5
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'That’s far too much stuff. Let’s limit it to ssh stuff:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 这已经太多东西了。让我们限制到 ssh 相关的内容：
- en: '[PRE1]'
  id: totrans-7
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'Notice that we’re using a pipe to stream a *remote* file through `grep` on
    our local computer! `ssh` is magical, and we will talk more about it in the next
    lecture on the command-line environment. This is still way more stuff than we
    wanted though. And pretty hard to read. Let’s do better:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，我们正在使用管道将一个 *远程* 文件通过本地计算机上的 `grep` 流式传输！`ssh` 是神奇的，我们将在下一讲中更多地讨论命令行环境。但这仍然比我们想要的要多。而且很难阅读。让我们做得更好：
- en: '[PRE2]'
  id: totrans-9
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'Why the additional quoting? Well, our logs may be quite large, and it’s wasteful
    to stream it all to our computer and then do the filtering. Instead, we can do
    the filtering on the remote server, and then massage the data locally. `less`
    gives us a “pager” that allows us to scroll up and down through the long output.
    To save some additional traffic while we debug our command-line, we can even stick
    the current filtered logs into a file so that we don’t have to access the network
    while developing:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 为什么需要额外的引号？嗯，我们的日志可能相当大，将所有内容都流式传输到我们的计算机上然后再进行过滤是浪费的。相反，我们可以在远程服务器上进行过滤，然后在本地上处理数据。`less`
    给我们一个“分页器”，允许我们滚动查看长输出。在调试命令行时，我们甚至可以将当前过滤的日志保存到文件中，这样在开发过程中就不需要访问网络：
- en: '[PRE3]'
  id: totrans-11
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'There’s still a lot of noise here. There are *a lot* of ways to get rid of
    that, but let’s look at one of the most powerful tools in your toolkit: `sed`.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 这里仍然有很多噪音。有很多方法可以去除它，但让我们看看工具箱中最强大的工具之一：`sed`。
- en: '`sed` is a “stream editor” that builds on top of the old `ed` editor. In it,
    you basically give short commands for how to modify the file, rather than manipulate
    its contents directly (although you can do that too). There are tons of commands,
    but one of the most common ones is `s`: substitution. For example, we can write:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '`sed` 是一个“流编辑器”，它建立在旧的 `ed` 编辑器之上。在其中，你基本上给出简短的命令来修改文件，而不是直接操作其内容（尽管你也可以这样做）。有很多命令，但最常见的一个是
    `s`：替换。例如，我们可以写：'
- en: '[PRE4]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: 'What we just wrote was a simple *regular expression*; a powerful construct
    that lets you match text against patterns. The `s` command is written in the form:
    `s/REGEX/SUBSTITUTION/`, where `REGEX` is the regular expression you want to search
    for, and `SUBSTITUTION` is the text you want to substitute matching text with.'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 我们刚才写的是一个简单的 *正则表达式*；一个强大的结构，允许你将文本与模式匹配。`s` 命令的格式是：`s/REGEX/SUBSTITUTION/`，其中
    `REGEX` 是你想要搜索的正则表达式，而 `SUBSTITUTION` 是你想要替换匹配文本的文本。
- en: (You may recognize this syntax from the “Search and replace” section of our
    Vim [lecture notes](/2020/editors/#advanced-vim)! Indeed, Vim uses a syntax for
    searching and replacing that is similar to `sed`’s substitution command. Learning
    one tool often helps you become more proficient with others.)
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: （你可能会从我们的Vim[讲义](/2020/editors/#advanced-vim)的“搜索和替换”部分认出这种语法！实际上，Vim使用的搜索和替换语法与`sed`的替换命令类似。学习一个工具通常可以帮助你更熟练地使用其他工具。）
- en: Regular expressions
  id: totrans-17
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 正则表达式
- en: 'Regular expressions are common and useful enough that it’s worthwhile to take
    some time to understand how they work. Let’s start by looking at the one we used
    above: `/.*Disconnected from /`. Regular expressions are usually (though not always)
    surrounded by `/`. Most ASCII characters just carry their normal meaning, but
    some characters have “special” matching behavior. Exactly which characters do
    what vary somewhat between different implementations of regular expressions, which
    is a source of great frustration. Very common patterns are:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 正则表达式很常见且非常有用，因此花些时间去了解它们的工作原理是值得的。让我们先看看我们上面使用的正则表达式：`/.*Disconnected from
    /`。正则表达式通常（尽管不总是）被`/`包围。大多数ASCII字符只是携带它们正常的意义，但一些字符有“特殊”的匹配行为。确切地说，哪些字符做什么在不同的正则表达式实现之间有所不同，这是令人非常沮丧的一个原因。非常常见的模式有：
- en: '`.` means “any single character” except newline'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`.` 表示“任何单个字符”，除了换行符'
- en: '`*` zero or more of the preceding match'
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`*` 匹配前面的匹配项零次或多次'
- en: '`+` one or more of the preceding match'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`+` 匹配前面的匹配项一次或多次'
- en: '`[abc]` any one character of `a`, `b`, and `c`'
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`[abc]` `a`、`b`和`c`中的任意一个字符'
- en: '`(RX1|RX2)` either something that matches `RX1` or `RX2`'
  id: totrans-23
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`(RX1|RX2)` 匹配`RX1`或`RX2`中的任意一个'
- en: '`^` the start of the line'
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`^` 行首'
- en: '`$` the end of the line'
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`$` 行尾'
- en: '`sed`’s regular expressions are somewhat weird, and will require you to put
    a `\` before most of these to give them their special meaning. Or you can pass
    `-E`.'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: '`sed`的正则表达式有些奇怪，并且你需要在这些字符之前加上`\`来赋予它们特殊意义。或者你可以传递`-E`选项。'
- en: 'So, looking back at `/.*Disconnected from /`, we see that it matches any text
    that starts with any number of characters, followed by the literal string “Disconnected
    from ”. Which is what we wanted. But beware, regular expressions are tricky. What
    if someone tried to log in with the username “Disconnected from”? We’d have:'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，回顾一下`/.*Disconnected from /`，我们看到它匹配任何以任意数量的字符开始的文本，后面跟着字面字符串“Disconnected
    from ”。这正是我们想要的。但请注意，正则表达式很复杂。如果有人尝试使用用户名“Disconnected from”登录呢？我们会得到：
- en: '[PRE5]'
  id: totrans-28
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: What would we end up with? Well, `*` and `+` are, by default, “greedy”. They
    will match as much text as they can. So, in the above, we’d end up with just
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 我们最终会得到什么呢？`*`和`+`默认是“贪婪”的。它们会尽可能多地匹配文本。所以，在上面的例子中，我们最终只会得到
- en: '[PRE6]'
  id: totrans-30
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: 'Which may not be what we wanted. In some regular expression implementations,
    you can just suffix `*` or `+` with a `?` to make them non-greedy, but sadly `sed`
    doesn’t support that. We *could* switch to perl’s command-line mode though, which
    *does* support that construct:'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 这可能不是我们想要的。在一些正则表达式实现中，你可以在`*`或`+`后面加上一个`?`来使它们变得非贪婪，但遗憾的是`sed`不支持这一点。不过，我们可以切换到perl的命令行模式，它**确实**支持这种结构：
- en: '[PRE7]'
  id: totrans-32
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: We’ll stick to `sed` for the rest of this, because it’s by far the more common
    tool for these kinds of jobs. `sed` can also do other handy things like print
    lines following a given match, do multiple substitutions per invocation, search
    for things, etc. But we won’t cover that too much here. `sed` is basically an
    entire topic in and of itself, but there are often better tools.
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 我们将在这部分内容中继续使用`sed`，因为它是这些类型工作中最常见的工具。`sed`还可以执行其他一些方便的操作，比如打印给定匹配之后的行，每次调用进行多次替换，搜索内容等。但在这里我们不会过多地介绍这些。`sed`基本上是一个完整的主题，但通常有更好的工具。
- en: 'Okay, so we also have a suffix we’d like to get rid of. How might we do that?
    It’s a little tricky to match just the text that follows the username, especially
    if the username can have spaces and such! What we need to do is match the *whole*
    line:'
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 好的，所以我们还有一个后缀想要去除。我们该如何做到这一点呢？匹配用户名后面的文本有点棘手，尤其是如果用户名可以有空格等特殊字符时！我们需要匹配的是**整行**：
- en: '[PRE8]'
  id: totrans-35
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: Let’s look at what’s going on with a [regex debugger](https://regex101.com/r/qqbZqh/2).
    Okay, so the start is still as before. Then, we’re matching any of the “user”
    variants (there are two prefixes in the logs). Then we’re matching on any string
    of characters where the username is. Then we’re matching on any single word (`[^
    ]+`; any non-empty sequence of non-space characters). Then the word “port” followed
    by a sequence of digits. Then possibly the suffix `[preauth]`, and then the end
    of the line.
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们用一个 [正则表达式调试器](https://regex101.com/r/qqbZqh/2) 来看看发生了什么。好的，所以开始部分和之前一样。然后，我们匹配任何“用户”变体（日志中有两个前缀）。然后我们匹配用户名所在的所有字符字符串。然后我们匹配任何单个单词（`[^
    ]+`；任何非空的非空格字符序列）。然后是单词“端口”后面跟着一系列数字。然后可能是后缀 `[preauth]`，然后是行尾。
- en: Notice that with this technique, a username of “Disconnected from” won’t confuse
    us any more. Can you see why?
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，使用这种技术，用户名为“断开连接”的名称不会再让我们困惑了。你能看出为什么吗？
- en: 'There is one problem with this though, and that is that the entire log becomes
    empty. We want to *keep* the username after all. For this, we can use “capture
    groups”. Any text matched by a regex surrounded by parentheses is stored in a
    numbered capture group. These are available in the substitution (and in some engines,
    even in the pattern itself!) as `\1`, `\2`, `\3`, etc. So:'
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: 但是这里有一个问题，那就是整个日志都变空了。我们希望 *保留* 用户名。为此，我们可以使用“捕获组”。任何由正则表达式匹配并包围在括号中的文本都会存储在一个编号的捕获组中。这些在替换（以及在某些引擎中，甚至在模式本身！）中可用，如
    `\1`、`\2`、`\3` 等。所以：
- en: '[PRE9]'
  id: totrans-39
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: As you can probably imagine, you can come up with *really* complicated regular
    expressions. For example, here’s an article on how you might match an [e-mail
    address](https://www.regular-expressions.info/email.html). It’s [not easy](https://web.archive.org/web/20221223174323/http://emailregex.com/).
    And there’s [lots of discussion](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression/1917982).
    And people have [written tests](https://fightingforalostcause.net/content/misc/2006/compare-email-regex.php).
    And [test matrices](https://mathiasbynens.be/demo/url-regex). You can even write
    a regex for determining if a given number [is a prime number](https://www.noulakaz.net/2007/03/18/a-regular-expression-to-check-for-prime-numbers/).
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 如你所能想象，你可以想出 *非常* 复杂的正则表达式。例如，这里有一篇文章介绍了如何匹配 [电子邮件地址](https://www.regular-expressions.info/email.html)。这并不容易（[链接](https://web.archive.org/web/20221223174323/http://emailregex.com/)）。而且有很多
    [讨论](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression/1917982)。人们还
    [编写了测试](https://fightingforalostcause.net/content/misc/2006/compare-email-regex.php)。还有
    [测试矩阵](https://mathiasbynens.be/demo/url-regex)。你甚至可以编写一个用于确定给定数字 [是否为素数](https://www.noulakaz.net/2007/03/18/a-regular-expression-to-check-for-prime-numbers/)
    的正则表达式。
- en: Regular expressions are notoriously hard to get right, but they are also very
    handy to have in your toolbox!
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 正则表达式通常很难正确使用，但它们也是你的工具箱中非常有用的工具！
- en: Back to data wrangling
  id: totrans-42
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 回到数据处理
- en: Okay, so we now have
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 好的，所以我们现在有
- en: '[PRE10]'
  id: totrans-44
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: '`sed` can do all sorts of other interesting things, like injecting text (with
    the `i` command), explicitly printing lines (with the `p` command), selecting
    lines by index, and lots of other things. Check `man sed`!'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: '`sed` 可以做各种其他有趣的事情，比如插入文本（使用 `i` 命令），显式打印行（使用 `p` 命令），按索引选择行，以及其他很多事情。查看 `man
    sed`！'
- en: 'Anyway. What we have now gives us a list of all the usernames that have attempted
    to log in. But this is pretty unhelpful. Let’s look for common ones:'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 无论如何。我们现在得到的是所有尝试登录的用户名列表。但这并没有什么帮助。让我们寻找常见的：
- en: '[PRE11]'
  id: totrans-47
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '`sort` will, well, sort its input. `uniq -c` will collapse consecutive lines
    that are the same into a single line, prefixed with a count of the number of occurrences.
    We probably want to sort that too and only keep the most common usernames:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: '`sort` 将按其输入排序。`uniq -c` 将将连续相同的行合并为单行，并在前面加上出现次数的计数。我们可能还想对它进行排序，并只保留最常见的用户名：'
- en: '[PRE12]'
  id: totrans-49
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '`sort -n` will sort in numeric (instead of lexicographic) order. `-k1,1` means
    “sort by only the first whitespace-separated column”. The `,n` part says “sort
    until the `n`th field, where the default is the end of the line. In this *particular*
    example, sorting by the whole line wouldn’t matter, but we’re here to learn!'
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: '`sort -n` 将按数字（而不是按字典顺序）排序。`-k1,1` 表示“仅按第一个空格分隔的列排序”。`，n` 部分表示“排序到第 n 个字段，默认为行尾。在这个
    *特定* 的例子中，按整行排序并不重要，但我们在这里是为了学习！'
- en: If we wanted the *least* common ones, we could use `head` instead of `tail`.
    There’s also `sort -r`, which sorts in reverse order.
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想要最不常见的，我们可以用 `head` 代替 `tail`。还有 `sort -r`，它按逆序排序。
- en: Okay, so that’s pretty cool, but what if we’d like to extract only the usernames
    as a comma-separated list instead of one per line, perhaps for a config file?
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 好的，那确实很酷，但如果我们只想提取用户名作为逗号分隔的列表，而不是每行一个，可能用于配置文件呢？
- en: '[PRE13]'
  id: totrans-53
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: 'If you’re using macOS: note that the command as shown won’t work with the BSD
    `paste` shipped with macOS. See [exercise 4 from the shell tools lecture](/2020/shell-tools/#exercises)
    for more on the difference between BSD and GNU coreutils and instructions for
    how to install GNU coreutils on macOS.'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你正在使用 macOS：请注意，如所示命令在 macOS 中的 BSD `paste` 中无法正常工作。有关 BSD 和 GNU coreutils
    之间的差异以及如何在 macOS 上安装 GNU coreutils 的说明，请参阅[壳工具讲座中的练习 4](/2020/shell-tools/#exercises)。
- en: 'Let’s start with `paste`: it lets you combine lines (`-s`) by a given single-character
    delimiter (`-d`; `,` in this case). But what’s this `awk` business?'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们从 `paste` 开始：它允许你通过给定的单个字符分隔符（`-d`；在这种情况下是 `,`）组合行。但这是什么 `awk` 的事情？
- en: awk – another editor
  id: totrans-56
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: awk – 另一个编辑器
- en: '`awk` is a programming language that just happens to be really good at processing
    text streams. There is *a lot* to say about `awk` if you were to learn it properly,
    but as with many other things here, we’ll just go through the basics.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '`awk` 是一种编程语言，它恰好擅长处理文本流。如果你真正学习 `awk`，有很多东西可以说，但就像这里的其他许多事情一样，我们只会介绍基础知识。'
- en: First, what does `{print $2}` do? Well, `awk` programs take the form of an optional
    pattern plus a block saying what to do if the pattern matches a given line. The
    default pattern (which we used above) matches all lines. Inside the block, `$0`
    is set to the entire line’s contents, and `$1` through `$n` are set to the `n`th
    *field* of that line, when separated by the `awk` field separator (whitespace
    by default, change with `-F`). In this case, we’re saying that, for every line,
    print the contents of the second field, which happens to be the username!
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，`{print $2}` 做什么？嗯，`awk` 程序的形式为可选的模式加上一个块，该块说明如果模式与给定行匹配，则执行什么操作。默认模式（我们上面使用的）匹配所有行。在块内部，`$0`
    被设置为整行内容，而 `$1` 到 `$n` 被设置为该行的第 `n` 个字段，当用 `awk` 字段分隔符（默认为空白字符）分隔时。在这种情况下，我们说的是，对于每一行，打印第二个字段的内容，碰巧这是用户名！
- en: 'Let’s see if we can do something fancier. Let’s compute the number of single-use
    usernames that start with `c` and end with `e`:'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们看看我们能否做一些更复杂的事情。让我们计算以 `c` 开头并以 `e` 结尾的单次使用用户名的数量：
- en: '[PRE14]'
  id: totrans-60
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: There’s a lot to unpack here. First, notice that we now have a pattern (the
    stuff that goes before `{...}`). The pattern says that the first field of the
    line should be equal to 1 (that’s the count from `uniq -c`), and that the second
    field should match the given regular expression. And the block just says to print
    the username. We then count the number of lines in the output with `wc -l`.
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有很多东西要解释。首先，注意我们现在有一个模式（`{...}` 之前的东西）。模式说明行的第一个字段应该等于 1（这是 `uniq -c` 的计数），第二个字段应该匹配给定的正则表达式。块只是说明打印用户名。然后我们使用
    `wc -l` 来计算输出中的行数。
- en: However, `awk` is a programming language, remember?
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，`awk` 是一种编程语言，记得吗？
- en: '[PRE15]'
  id: totrans-63
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '`BEGIN` is a pattern that matches the start of the input (and `END` matches
    the end). Now, the per-line block just adds the count from the first field (although
    it’ll always be 1 in this case), and then we print it out at the end. In fact,
    we *could* get rid of `grep` and `sed` entirely, because `awk` [can do it all](https://web.archive.org/web/20251210045942/https://backreference.org/2010/02/10/idiomatic-awk/),
    but we’ll leave that as an exercise to the reader.'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: '`BEGIN` 是一个匹配输入开始的模式（`END` 匹配结束）。现在，按行块只是将第一个字段（尽管在这种情况下总是 1）的计数累加，然后在结束时打印出来。实际上，我们可以完全去掉
    `grep` 和 `sed`，因为 `awk` [可以完成所有这些](https://web.archive.org/web/20251210045942/https://backreference.org/2010/02/10/idiomatic-awk/)，但我们将把这留作读者的练习。'
- en: Analyzing data
  id: totrans-65
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 数据分析
- en: 'You can do math directly in your shell using `bc`, a calculator that can read
    from STDIN! For example, add the numbers on each line together by concatenating
    them together, delimited by `+`:'
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以直接在你的 shell 中使用 `bc` 进行数学运算，这是一个可以从 STDIN 读取的计算器！例如，通过连接每一行中的数字，并用 `+` 分隔来相加：
- en: '[PRE16]'
  id: totrans-67
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: 'Or produce more elaborate expressions:'
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 或者产生更复杂的表达式：
- en: '[PRE17]'
  id: totrans-69
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: 'You can get stats in a variety of ways. [`st`](https://github.com/nferraz/st)
    is pretty neat, but if you already have [R](https://www.r-project.org/):'
  id: totrans-70
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以通过各种方式获取统计数据。[`st`](https://github.com/nferraz/st) 非常不错，但如果你已经有了 [R](https://www.r-project.org/)：
- en: '[PRE18]'
  id: totrans-71
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: R is another (weird) programming language that’s great at data analysis and
    [plotting](https://ggplot2.tidyverse.org/). We won’t go into too much detail,
    but suffice to say that `summary` prints summary statistics for a vector, and
    we created a vector containing the input stream of numbers, so R gives us the
    statistics we wanted!
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: R 是另一种（奇怪）的编程语言，擅长数据分析以及 [绘图](https://ggplot2.tidyverse.org/)。我们不会过多深入细节，但可以说
    `summary` 会为向量打印摘要统计信息，我们创建了一个包含数字输入流的向量，因此 R 给出了我们想要的统计信息！
- en: 'If you just want some simple plotting, `gnuplot` is your friend:'
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你只想进行一些简单的绘图，`gnuplot` 是你的朋友：
- en: '[PRE19]'
  id: totrans-74
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: Data wrangling to make arguments
  id: totrans-75
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 数据整理以构建论点
- en: Sometimes you want to do data wrangling to find things to install or remove
    based on some longer list. The data wrangling we’ve talked about so far + `xargs`
    can be a powerful combo.
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 有时候，你可能想要进行数据整理以找到基于更长列表中要安装或删除的内容。我们之前讨论的数据整理加上 `xargs` 可以是一个强大的组合。
- en: 'For example, as seen in lecture, I can use the following command to uninstall
    old nightly builds of Rust from my system by extracting the old build names using
    data wrangling tools and then passing them via `xargs` to the uninstaller:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，正如在讲座中看到的，我可以通过以下命令从我的系统中卸载旧的 Rust 夜间构建版本，通过使用数据整理工具提取旧的构建名称，然后通过 `xargs`
    传递给卸载器：
- en: '[PRE20]'
  id: totrans-78
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: Wrangling binary data
  id: totrans-79
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 整理二进制数据
- en: So far, we have mostly talked about wrangling textual data, but pipes are just
    as useful for binary data. For example, we can use ffmpeg to capture an image
    from our camera, convert it to grayscale, compress it, send it to a remote machine
    over SSH, decompress it there, make a copy, and then display it.
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，我们主要讨论了文本数据的整理，但管道对于二进制数据同样有用。例如，我们可以使用 ffmpeg 从我们的相机捕获图像，将其转换为灰度，压缩，通过
    SSH 发送到远程机器，在那里解压缩，复制，然后显示。
- en: '[PRE21]'
  id: totrans-81
  prefs: []
  type: TYPE_PRE
  zh: '[PRE21]'
- en: Exercises
  id: totrans-82
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: Take this [short interactive regex tutorial](https://regexone.com/).
  id: totrans-83
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 参考这个 [简短的交互式正则表达式教程](https://regexone.com/)。
- en: 'Find the number of words (in `/usr/share/dict/words`) that contain at least
    three `a`s and don’t have a `''s` ending. What are the three most common last
    two letters of those words? `sed`’s `y` command, or the `tr` program, may help
    you with case insensitivity. How many of those two-letter combinations are there?
    And for a challenge: which combinations do not occur?'
  id: totrans-84
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 找出包含至少三个 `a` 且不以 `'s'` 结尾的单词（在 `/usr/share/dict/words` 中）。这些单词中最常见的最后两个字母是什么？`sed`
    的 `y` 命令或 `tr` 程序可能有助于处理大小写不敏感。有多少这样的双字母组合？而且作为一个挑战：哪些组合没有出现？
- en: To do in-place substitution it is quite tempting to do something like `sed s/REGEX/SUBSTITUTION/
    input.txt > input.txt`. However this is a bad idea, why? Is this particular to
    `sed`? Use `man sed` to find out how to accomplish this.
  id: totrans-85
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 要进行原地替换，很诱人做类似 `sed s/REGEX/SUBSTITUTION/ input.txt > input.txt` 的事情。然而，这是一个坏主意，为什么？这是特定于
    `sed` 吗？使用 `man sed` 来找出如何完成这个任务。
- en: 'Find your average, median, and max system boot time over the last ten boots.
    Use `journalctl` on Linux and `log show` on macOS, and look for log timestamps
    near the beginning and end of each boot. On Linux, they may look something like:'
  id: totrans-86
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 找出过去十次引导的平均、中位数和最大系统引导时间。在 Linux 上使用 `journalctl`，在 macOS 上使用 `log show`，查找每次引导开始和结束附近的日志时间戳。在
    Linux 上，它们可能看起来像这样：
- en: '[PRE22]'
  id: totrans-87
  prefs:
  - PREF_IND
  type: TYPE_PRE
  zh: '[PRE22]'
- en: and
  id: totrans-88
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 和
- en: '[PRE23]'
  id: totrans-89
  prefs:
  - PREF_IND
  type: TYPE_PRE
  zh: '[PRE23]'
- en: 'On macOS, [look for](https://eclecticlight.co/2018/03/21/macos-unified-log-3-finding-your-way/):'
  id: totrans-90
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 在 macOS 上，[查找](https://eclecticlight.co/2018/03/21/macos-unified-log-3-finding-your-way/)：
- en: '[PRE24]'
  id: totrans-91
  prefs:
  - PREF_IND
  type: TYPE_PRE
  zh: '[PRE24]'
- en: and
  id: totrans-92
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 和
- en: '[PRE25]'
  id: totrans-93
  prefs:
  - PREF_IND
  type: TYPE_PRE
  zh: '[PRE25]'
- en: Look for boot messages that are *not* shared between your past three reboots
    (see `journalctl`’s `-b` flag). Break this task down into multiple steps. First,
    find a way to get just the logs from the past three boots. There may be an applicable
    flag on the tool you use to extract the boot logs, or you can use `sed '0,/STRING/d'`
    to remove all lines previous to one that matches `STRING`. Next, remove any parts
    of the line that *always* varies (like the timestamp). Then, de-duplicate the
    input lines and keep a count of each one (`uniq` is your friend). And finally,
    eliminate any line whose count is 3 (since it *was* shared among all the boots).
  id: totrans-94
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 查找在过去三次重启中不共享的引导消息（参见 `journalctl` 的 `-b` 标志）。将这个任务分解成多个步骤。首先，找到一种方法来获取过去三次引导的日志。你使用的工具可能有适用的标志来提取引导日志，或者你可以使用
    `sed '0,/STRING/d'` 来删除所有在匹配 `STRING` 的行之前的行。接下来，删除任何始终变化的行部分（如时间戳）。然后，去重输入行并统计每个行数（`uniq`
    是你的朋友）。最后，消除任何计数为 3 的行（因为它是所有引导中共享的）。
- en: Find an online data set like [this one](https://commons.wikimedia.org/wiki/Data:Wikipedia_statistics/data.tab),
    [this one](https://ucr.fbi.gov/crime-in-the-u.s/2016/crime-in-the-u.s.-2016/topic-pages/tables/table-1),
    or maybe one [from here](https://www.springboard.com/blog/data-science/free-public-data-sets-data-science-project/).
    Fetch it using `curl` and extract out just two columns of numerical data. If you’re
    fetching HTML data, [`pup`](https://github.com/EricChiang/pup) might be helpful.
    For JSON data, try [`jq`](https://stedolan.github.io/jq/). Find the min and max
    of one column in a single command, and the difference of the sum of each column
    in another.
  id: totrans-95
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 找到一个在线数据集，例如[这个](https://commons.wikimedia.org/wiki/Data:Wikipedia_statistics/data.tab)，[这个](https://ucr.fbi.gov/crime-in-the-u.s/2016/crime-in-the-u.s.-2016/topic-pages/tables/table-1)，或者可能[从这里](https://www.springboard.com/blog/data-science/free-public-data-sets-data-science-project/)找到一个。使用`curl`获取它，并提取出仅包含两列数值数据。如果你正在获取HTML数据，[`pup`](https://github.com/EricChiang/pup)可能会有帮助。对于JSON数据，尝试使用[`jq`](https://stedolan.github.io/jq/)。使用单个命令找到一列的最小值和最大值，并在另一个命令中找到每列总和的差值。
