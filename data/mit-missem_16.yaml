- en: Remote Machines
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 远程机器
- en: 原文：[https://missing.csail.mit.edu/2019/remote-machines/](https://missing.csail.mit.edu/2019/remote-machines/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[https://missing.csail.mit.edu/2019/remote-machines/](https://missing.csail.mit.edu/2019/remote-machines/)'
- en: It has become more and more common for programmers to use remote servers in
    their everyday work. If you need to use remote servers in order to deploy backend
    software or you need a server with higher computational capabilities, you will
    end up using a Secure Shell (SSH). As with most tools covered, SSH is highly configurable
    so it is worth learning about it.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 对于程序员来说，在日常工作中使用远程服务器变得越来越普遍。如果你需要使用远程服务器来部署后端软件或者你需要一台具有更高计算能力的服务器，你最终会使用安全外壳（SSH）。与大多数覆盖的工具一样，SSH
    具有高度的可配置性，因此了解它是有价值的。
- en: Executing commands
  id: totrans-3
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 执行命令
- en: An often overlooked feature of `ssh` is the ability to run commands directly.
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: '`ssh` 的一个常被忽视的功能是能够直接运行命令。'
- en: '`ssh foobar@server ls` will execute ls in the home folder of foobar'
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`ssh foobar@server ls` 将在 foobar 的家目录中执行 ls 命令。'
- en: It works with pipes, so `ssh foobar@server ls | grep PATTERN` will grep locally
    the remote output of `ls` and `ls | ssh foobar@server grep PATTERN` will grep
    remotely the local output of `ls`.
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 它与管道一起工作，所以 `ssh foobar@server ls | grep PATTERN` 将在本地 grep `ls` 的远程输出，而 `ls
    | ssh foobar@server grep PATTERN` 将在远程 grep `ls` 的本地输出。
- en: SSH Keys
  id: totrans-7
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: SSH 密钥
- en: Key-based authentication exploits public-key cryptography to prove to the server
    that the client owns the secret private key without revealing the key. This way
    you do not need to reenter your password every time. Nevertheless the private
    key (e.g. `~/.ssh/id_rsa`) is effectively your password so treat it like so.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 基于密钥的认证利用公钥加密来向服务器证明客户端拥有秘密私钥，而不泄露密钥。这样你就不需要每次都重新输入密码。然而，私钥（例如 `~/.ssh/id_rsa`）实际上就是你的密码，所以要像对待密码一样对待它。
- en: Key generation. To generate a pair you can simply run `ssh-keygen -t rsa -b
    4096`. If you do not choose a passphrase anyone that gets hold of your private
    key will be able to access authorized servers so it is recommended to choose one
    and use `ssh-agent` to manage shell sessions.
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 密钥生成。要生成一对密钥，你可以简单地运行 `ssh-keygen -t rsa -b 4096`。如果你没有选择密码短语，那么任何获得你的私钥的人都可以访问授权服务器，因此建议选择一个并使用
    `ssh-agent` 来管理会话。
- en: If you have configured pushing to Github using SSH keys you have probably done
    the steps outlined [here](https://help.github.com/articles/connecting-to-github-with-ssh/)
    and have a valid pair already. To check if you have a passphrase and validate
    it you can run `ssh-keygen -y -f /path/to/key`.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你已经配置了使用 SSH 密钥推送至 Github，你可能已经完成了[这里](https://help.github.com/articles/connecting-to-github-with-ssh/)概述的步骤，并且已经有一对有效的密钥。要检查你是否有一个密码短语并验证它，你可以运行
    `ssh-keygen -y -f /path/to/key`。
- en: Key based authentication. `ssh` will look into `.ssh/authorized_keys` to determine
    which clients it should let in. To copy a public key over we can use the
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 基于密钥的认证。`ssh` 将检查 `.ssh/authorized_keys` 文件以确定哪些客户端可以进入。要复制公钥，我们可以使用 `ssh-copy-id`。
- en: '[PRE0]'
  id: totrans-12
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: A simpler solution can be achieved with `ssh-copy-id` where available.
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 如果可用，可以通过 `ssh-copy-id` 实现一个更简单的解决方案。
- en: '[PRE1]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: Copying files over ssh
  id: totrans-15
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 通过 ssh 复制文件
- en: There are many ways to copy files over ssh
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 有许多方法可以通过 ssh 复制文件。
- en: '`ssh+tee`, the simplest is to use `ssh` command execution and stdin input by
    doing `cat localfile | ssh remote_server tee serverfile`'
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`ssh+tee`，最简单的方法是使用 `ssh` 命令执行和标准输入，通过执行 `cat localfile | ssh remote_server
    tee serverfile`。'
- en: '`scp` when copying large amounts of files/directories, the secure copy `scp`
    command is more convenient since it can easily recurse over paths. The syntax
    is `scp path/to/local_file remote_host:path/to/remote_file`'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当复制大量文件/目录时，`scp` 命令比 `scp` 更方便，因为它可以轻松地递归地遍历路径。语法是 `scp path/to/local_file
    remote_host:path/to/remote_file`。
- en: '`rsync` improves upon `scp` by detecting identical files in local and remote
    and preventing copying them again. It also provides more fine grained control
    over symlinks, permissions and has extra features like the `--partial` flag that
    can resume from a previously interrupted copy. `rsync` has a similar syntax to
    `scp`.'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`rsync` 通过检测本地和远程中的相同文件并防止再次复制它们来改进 `scp`。它还提供了对符号链接、权限的更精细控制，并具有像 `--partial`
    标志这样的额外功能，可以从之前中断的复制中恢复。`rsync` 的语法与 `scp` 类似。'
- en: Backgrounding processes
  id: totrans-20
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 背景化进程
- en: By default when interrupting a ssh connection, child processes of the parent
    shell are killed along with it. There are a couple of alternatives
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 默认情况下，当中断 ssh 连接时，父 shell 的子进程也会随之终止。有几个替代方案。
- en: '`nohup` - the `nohup` tool effectively allows for a process to live when the
    terminal gets killed. Although this can sometimes be achieved with `&` and `disown`,
    nohup is a better default. More details can be found [here](https://unix.stackexchange.com/questions/3886/difference-between-nohup-disown-and).'
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`nohup` - `nohup` 工具有效地允许进程在终端被杀死时继续运行。尽管有时可以通过 `&` 和 `disown` 实现，但 `nohup`
    是更好的默认选择。更多详细信息可以在 [这里](https://unix.stackexchange.com/questions/3886/difference-between-nohup-disown-and)
    找到。'
- en: '`tmux`, `screen` - whereas `nohup` effectively backgrounds the process it is
    not convenient for interactive shell sessions. In that case using a terminal multiplexer
    like `screen` or `tmux` is a convenient choice since one can easily detach and
    reattach the associated shells.'
  id: totrans-23
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`tmux`、`screen` - 而 `nohup` 则有效地将进程置于后台，对于交互式 shell 会话来说并不方便。在这种情况下，使用终端多路复用器如
    `screen` 或 `tmux` 是一个方便的选择，因为可以轻松地分离和重新附加相关的 shell。'
- en: Lastly, if you disown a program and want to reattach it to the current terminal,
    you can look into [reptyr](https://github.com/nelhage/reptyr). `reptyr PID` will
    grab the process with id PID and attach it to your current terminal.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，如果你想要将一个程序从当前终端中分离出来，并重新附加到当前终端，你可以查看 [reptyr](https://github.com/nelhage/reptyr)。使用
    `reptyr PID` 可以获取进程 ID 为 PID 的进程并将其附加到你的当前终端。
- en: Port Forwarding
  id: totrans-25
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 端口转发
- en: 'In many scenarios you will run into software that works by listening to ports
    in the machine. When this happens in your local machine you can simply do `localhost:PORT`
    or `127.0.0.1:PORT`, but what do you do with a remote server that does not have
    its ports directly available through the network/internet?. This is called port
    forwarding and it comes in two flavors: Local Port Forwarding and Remote Port
    Forwarding (see the pictures for more details, credit of the pictures from [this
    SO post](https://unix.stackexchange.com/questions/115897/whats-ssh-port-forwarding-and-whats-the-difference-between-ssh-local-and-remot)).'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 在许多场景中，你将遇到通过机器上的端口进行监听的软件。当这种情况发生在你的本地机器上时，你可以简单地做 `localhost:PORT` 或 `127.0.0.1:PORT`，但对于没有通过网络/互联网直接提供端口的远程服务器，你该怎么办？这被称为端口转发，它有两种类型：本地端口转发和远程端口转发（见图片以获取更多详细信息，图片来自
    [这个 SO 帖子](https://unix.stackexchange.com/questions/115897/whats-ssh-port-forwarding-and-whats-the-difference-between-ssh-local-and-remot))。
- en: '**Local Port Forwarding** ![Local Port Forwarding](../Images/20a20abd4ec1d71ff8334825a7f89b63.png)'
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: '**本地端口转发** ![本地端口转发](../Images/20a20abd4ec1d71ff8334825a7f89b63.png)'
- en: '**Remote Port Forwarding** ![Remote Port Forwarding](../Images/30b5b9f8caf9503bab6d672ccb9bcf79.png)'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: '**远程端口转发** ![远程端口转发](../Images/30b5b9f8caf9503bab6d672ccb9bcf79.png)'
- en: The most common scenario is local port forwarding where a service in the remote
    machine listens in a port and you want to link a port in your local machine to
    forward to the remote port. For example if we execute `jupyter notebook` in the
    remote server that listens to the port `8888`. Thus to forward that to the local
    port `9999` we would do `ssh -L 9999:localhost:8888 foobar@remote_server` and
    then navigate to `localhost:9999` in our local machine.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 最常见的场景是本地端口转发，其中远程机器上的服务在一个端口上监听，而你想要将本地机器上的一个端口链接到远程端口。例如，如果我们远程服务器上执行 `jupyter
    notebook` 并监听端口 `8888`。因此，要将它转发到本地端口 `9999`，我们将执行 `ssh -L 9999:localhost:8888
    foobar@remote_server`，然后在本地机器上导航到 `localhost:9999`。
- en: Graphics Forwarding
  id: totrans-30
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 图形转发
- en: 'Sometimes forwarding ports is not enough since we want to run a GUI based program
    in the server. You can always resort to Remote Desktop Software that sends the
    entire Desktop Environment (ie. options like RealVNC, Teamviewer, &c). However
    for a single GUI tool, SSH provides a good alternative: Graphics Forwarding.'
  id: totrans-31
  prefs: []
  type: TYPE_NORMAL
  zh: 有时仅转发端口是不够的，因为我们想在服务器上运行基于 GUI 的程序。你总是可以求助于远程桌面软件，这些软件发送整个桌面环境（例如，RealVNC、Teamviewer
    等）。然而，对于单个 GUI 工具，SSH 提供了一个很好的替代方案：图形转发。
- en: Using the `-X` flag tells SSH to forward
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 `-X` 标志告诉 SSH 进行转发
- en: For trusted X11 forwarding the `-Y` flag can be used.
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 对于受信任的 X11 转发，可以使用 `-Y` 标志。
- en: Final note is that for this to work the `sshd_config` on the server must have
    the following options
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: 最后一点是，为了使此功能正常工作，服务器上的 `sshd_config` 必须具有以下选项
- en: '[PRE2]'
  id: totrans-35
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: Roaming
  id: totrans-36
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Roaming
- en: A common pain when connecting to a remote server are disconnections due to shutting
    down/sleeping your computer or changing a network. Moreover if one has a connection
    with significant lag using ssh can become quite frustrating. [Mosh](https://mosh.org/),
    the mobile shell, improves upon ssh, allowing roaming connections, intermittent
    connectivity and providing intelligent local echo.
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 连接到远程服务器时常见的痛苦是因关闭/睡眠您的计算机或更改网络而导致的断开连接。此外，如果有一个有显著延迟的连接，使用 ssh 可能会变得相当令人沮丧。[Mosh](https://mosh.org/)，移动壳，在
    ssh 的基础上进行了改进，允许漫游连接、间歇性连接并提供智能本地回显。
- en: Mosh is present in all common distributions and package managers. Mosh requires
    an ssh server to be working in the server. You do not need to be superuser to
    install mosh but it does require that ports 60000 through 60010 to be open in
    the server (they usually are since they are not in the privileged range).
  id: totrans-38
  prefs: []
  type: TYPE_NORMAL
  zh: Mosh 存在于所有常见的发行版和软件包管理器中。Mosh 需要服务器上的 SSH 服务器正在运行。您不需要超级用户权限来安装 mosh，但它确实需要服务器上打开端口
    60000 到 60010（它们通常都是打开的，因为它们不在特权范围内）。
- en: A downside of `mosh` is that is does not support roaming port/graphics forwarding
    so if you use those often `mosh` won’t be of much help.
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: '`mosh` 的一个缺点是它不支持漫游端口/图形转发，所以如果您经常使用这些功能，`mosh` 就不会很有帮助。'
- en: SSH Configuration
  id: totrans-40
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: SSH 配置
- en: Client
  id: totrans-41
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 客户端
- en: We have covered many many arguments that we can pass. A tempting alternative
    is to create shell aliases that look like `alias my_serer="ssh -X -i ~/.id_rsa
    -L 9999:localhost:8888 foobar@remote_server`, however there is a better alternative,
    using `~/.ssh/config`.
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经介绍了许多我们可以传递的参数。一个诱人的替代方案是创建类似于 `alias my_server="ssh -X -i ~/.id_rsa -L
    9999:localhost:8888 foobar@remote_server"` 的 shell 别名，然而有一个更好的替代方案，使用 `~/.ssh/config`。
- en: '[PRE3]'
  id: totrans-43
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: An additional advantage of using the `~/.ssh/config` file over aliases is that
    other programs like `scp`, `rsync`, `mosh`, &c are able to read it as well and
    convert the settings into the corresponding flags.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 `~/.ssh/config` 文件而不是别名的另一个优点是，其他程序如 `scp`、`rsync`、`mosh` 等也能够读取它并将设置转换为相应的标志。
- en: 'Note that the `~/.ssh/config` file can be considered a dotfile, and in general
    it is fine for it to be included with the rest of your dotfiles. However if you
    make it public, think about the information that you are potentially providing
    strangers on the internet: the addresses of your servers, the users you are using,
    the open ports, &c. This may facilitate some types of attacks so be thoughtful
    about sharing your SSH configuration.'
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，`~/.ssh/config` 文件可以被视为点文件，通常情况下，将其包含在您的其他点文件中是正常的。但是，如果您将其公开，请考虑您可能提供给互联网陌生人的信息：您服务器的地址、您使用的用户、开放的端口等。这可能有助于某些类型的攻击，因此在分享您的
    SSH 配置时要三思。
- en: 'Warning: Never include your RSA keys ( `~/.ssh/id_rsa*` ) in a public repository!'
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 警告：永远不要将您的 RSA 密钥 (`~/.ssh/id_rsa*`) 包含在公共存储库中！
- en: Server side
  id: totrans-47
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 服务器端
- en: Server side configuration is usually specified in `/etc/ssh/sshd_config`. Here
    you can make changes like disabling password authentication, changing ssh ports,
    enabling X11 forwarding, &c. You can specify config settings in a per user basis.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 服务器端配置通常在 `/etc/ssh/sshd_config` 中指定。在这里，您可以进行更改，例如禁用密码认证、更改 ssh 端口、启用 X11 转发等。您可以根据用户指定配置设置。
- en: Remote Filesystem
  id: totrans-49
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 远程文件系统
- en: Sometimes it is convenient to mount a remote folder. [sshfs](https://github.com/libfuse/sshfs)
    can mount a folder on a remote server locally, and then you can use a local editor.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 有时挂载远程文件夹很方便。[sshfs](https://github.com/libfuse/sshfs) 可以在本地挂载远程服务器上的文件夹，然后您可以使用本地编辑器。
- en: Exercises
  id: totrans-51
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 练习
- en: For SSH to work the host needs to be running an SSH server. Install an SSH server
    (such as OpenSSH) in a virtual machine so you can do the rest of the exercises.
    To figure out what is the ip of the machine run the command `ip addr` and look
    for the inet field (ignore the `127.0.0.1` entry, that corresponds to the loopback
    interface).
  id: totrans-52
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 要使 SSH 的工作，主机需要运行 SSH 服务器。在虚拟机中安装 SSH 服务器（如 OpenSSH），以便您可以完成其余的练习。要找出机器的 IP
    地址，运行命令 `ip addr` 并查找 inet 字段（忽略 `127.0.0.1` 条目，它对应于环回接口）。
- en: Go to `~/.ssh/` and check if you have a pair of SSH keys there. If not, generate
    them with `ssh-keygen -t rsa -b 4096`. It is recommended that you use a password
    and use `ssh-agent` , more info [here](https://www.ssh.com/ssh/agent).
  id: totrans-53
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 前往 `~/.ssh/` 并检查您是否在那里有一对 SSH 密钥。如果没有，使用 `ssh-keygen -t rsa -b 4096` 生成它们。建议您使用密码并使用
    `ssh-agent`，更多信息[这里](https://www.ssh.com/ssh/agent)。
- en: Use `ssh-copy-id` to copy the key to your virtual machine. Test that you can
    ssh without a password. Then, edit your `sshd_config` in the server to disable
    password authentication by editing the value of `PasswordAuthentication`. Disable
    root login by editing the value of `PermitRootLogin`.
  id: totrans-54
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用 `ssh-copy-id` 将密钥复制到你的虚拟机。测试你是否可以无密码 ssh。然后，编辑服务器上的 `sshd_config` 以通过编辑 `PasswordAuthentication`
    的值来禁用密码认证。通过编辑 `PermitRootLogin` 的值来禁用 root 登录。
- en: Edit the `sshd_config` in the server to change the ssh port and check that you
    can still ssh. If you ever have a public facing server, a non default port and
    key only login will throttle a significant amount of malicious attacks.
  id: totrans-55
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在服务器上编辑 `sshd_config` 以更改 ssh 端口，并检查你是否仍然可以 ssh。如果你有一个面向公众的服务器，使用非默认端口和密钥登录将显著减少恶意攻击。
- en: Install mosh in your server/VM, establish a connection and then disconnect the
    network adapter of the server/VM. Can mosh properly recover from it?
  id: totrans-56
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在你的服务器/虚拟机上安装 mosh，建立连接然后断开服务器/虚拟机的网络适配器。mosh能否正确恢复？
- en: 'Another use of local port forwarding is to tunnel certain host to the server.
    If your network filters some website like for example `reddit.com` you can tunnel
    it through the server as follows:'
  id: totrans-57
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 本地端口转发的另一个用途是将某些主机隧道到服务器。如果你的网络过滤某些网站，例如 `reddit.com`，你可以通过以下方式将其隧道通过服务器：
- en: Run `ssh remote_server -L 80:reddit.com:80`
  id: totrans-58
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 运行 `ssh remote_server -L 80:reddit.com:80`
- en: Set `reddit.com` and `www.reddit.com` to `127.0.0.1` in `/etc/hosts`
  id: totrans-59
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在 `/etc/hosts` 中将 `reddit.com` 和 `www.reddit.com` 设置为 `127.0.0.1`
- en: Check that you are accessing that website through the server
  id: totrans-60
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 检查你是否通过服务器访问该网站
- en: If it is not obvious use a website such as [ipinfo.io](https://ipinfo.io/) which
    will change depending on your host public ip.
  id: totrans-61
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果不明显，可以使用像 [ipinfo.io](https://ipinfo.io/) 这样的网站，它会根据你的主机公网IP进行变化。
- en: Background port forwarding can easily be achieved with a couple of extra flags.
    Look into what the `-N` and `-f` flags do in `ssh` and figure out what a command
    such as this `ssh -N -f -L 9999:localhost:8888 foobar@remote_server` does.
  id: totrans-62
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 背景端口转发可以通过添加几个额外的标志轻松实现。研究 `ssh` 中的 `-N` 和 `-f` 标志的作用，并找出像这样 `ssh -N -f -L 9999:localhost:8888
    foobar@remote_server` 的命令做什么。
