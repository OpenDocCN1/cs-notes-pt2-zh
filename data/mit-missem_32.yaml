- en: Course Overview + Introduction to the Shell
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 课程概述 + Shell 简介
- en: 原文：[https://missing.csail.mit.edu/2026/course-shell/](https://missing.csail.mit.edu/2026/course-shell/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://missing.csail.mit.edu/2026/course-shell/](https://missing.csail.mit.edu/2026/course-shell/)
- en: Who are we?
  id: totrans-2
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 我们是谁？
- en: This class is co-taught by [Anish](https://anish.io/), [Jon](https://thesquareplanet.com/),
    and [Jose](http://josejg.com/). We are all ex-MIT students who started this MIT
    IAP class back when we were students. You can reach us collectively at [missing-semester@mit.edu](mailto:missing-semester@mit.edu).
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 这门课程由[Anish](https://anish.io/)、[Jon](https://thesquareplanet.com/)和[Jose](http://josejg.com/)共同授课。我们都是前MIT学生，当时我们作为学生时就开始了这门MIT
    IAP课程。您可以通过[missing-semester@mit.edu](mailto:missing-semester@mit.edu)与我们联系。
- en: We are not paid to teach this class, and do not monetize the class in any way.
    We make all the [course materials](https://missing.csail.mit.edu/) and [recordings
    of the lectures](https://www.youtube.com/@MissingSemester) freely available online.
    If you want to support our work, the best way to do so is to simply spread the
    word about the class. If you’re a company, university, or other organization that
    runs this content past larger cohorts, please send us experience reports/testimonials
    by email so we get to hear about it :)
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 我们并不为此课程获得报酬，也不会以任何方式将课程货币化。我们将所有[课程材料](https://missing.csail.mit.edu/)和[讲座录音](https://www.youtube.com/@MissingSemester)免费提供给在线用户。如果您想支持我们的工作，最好的方式就是简单地将课程信息传播出去。如果您是一家公司、大学或其他组织，并且将此内容推广给更大的群体，请通过电子邮件发送经验报告/推荐信，这样我们就能了解到相关信息了
    :)
- en: Motivation
  id: totrans-5
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 动机
- en: As computer scientists, we know that computers are great at aiding in repetitive
    tasks. However, far too often, we forget that this applies just as much to our
    *use* of the computer as it does to the computations we want our programs to perform.
    We have a vast range of tools available at our fingertips that enable us to be
    more productive and solve more complex problems when working on any computer-related
    problem. Yet many of us utilize only a small fraction of those tools; we only
    know enough magical incantations by rote to get by, and blindly copy-paste commands
    from the internet when we get stuck.
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 作为计算机科学家，我们知道计算机在辅助重复性任务方面非常出色。然而，我们往往忘记了这一点同样适用于我们使用计算机的方式，就像它适用于我们希望程序执行的计算一样。我们手头上有各种各样的工具，这些工具使我们能够在处理任何与计算机相关的问题时更加高效并解决更复杂的问题。然而，我们中的许多人只利用了其中的一小部分工具；我们只是通过死记硬背知道足够的咒语来应付，当我们遇到困难时，就盲目地从互联网上复制粘贴命令。
- en: This class is an attempt to [address this](/about/).
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 这门课程试图[解决这个问题](/about/)。
- en: We want to teach you how to make the most of the tools you know, show you new
    tools to add to your toolbox, and hopefully instill in you some excitement for
    exploring (and perhaps building) more tools on your own. This is what we believe
    to be the missing semester from most Computer Science curricula.
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 我们希望教会您如何充分利用您已知的工具，向您展示可以添加到工具箱中的新工具，并希望激发您探索（也许还有自己构建）更多工具的热情。这是我们相信的大多数计算机科学课程中缺失的学期。
- en: Class structure
  id: totrans-9
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 课程结构
- en: The not-for-credit class consists of nine 1-hour lectures, each one centering
    on a [particular topic](/2026/). The lectures are largely independent, though
    as the semester goes on we will presume that you are familiar with the content
    from the earlier lectures. We have lecture notes online, but there may be content
    covered in class (e.g. in the form of demos) that may not be in the notes. As
    for past years, we will be recording lectures and posting the recordings [online](https://www.youtube.com/@MissingSemester).
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 这门不计学分的课程由九个1小时讲座组成，每个讲座都围绕一个[特定主题](/2026/)展开。讲座在很大程度上是独立的，但随着学期的进行，我们将假设您已经熟悉了早期讲座的内容。我们在线上有讲座笔记，但课堂上可能有一些内容（例如以演示的形式）没有包含在笔记中。至于往年的情况，我们将录制讲座并在线[发布](https://www.youtube.com/@MissingSemester)。
- en: We are trying to cover a lot of ground over the course of just a few 1-hour
    lectures, so the lectures are fairly dense. To allow you some time to get familiar
    with the content at your own pace, each lecture includes a set of exercises that
    guide you through the lecture’s key points. We will not be running dedicated office
    hours, but we encourage you to ask questions on the [OSSU Discord](https://ossu.dev/#community),
    in `#missing-semester-forum`, or email us at [missing-semester@mit.edu](mailto:missing-semester@mit.edu).
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: 我们试图在短短几个1小时的讲座中涵盖大量内容，因此讲座内容相当密集。为了让你有时间以自己的节奏熟悉内容，每个讲座都包含一系列练习，引导你了解讲座的关键点。我们不会开设专门的办公时间，但我们鼓励你在[OSSU
    Discord](https://ossu.dev/#community)的`#missing-semester-forum`频道提问，或者通过电子邮件发送给我们[missing-semester@mit.edu](mailto:missing-semester@mit.edu)。
- en: Due to the limited time we have, we won’t be able to cover all the tools in
    the same level of detail a full-scale class might. Where possible, we will try
    to point you towards resources for digging further into a tool or topic, but if
    something particularly strikes your fancy, don’t hesitate to reach out to us and
    ask for pointers!
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 由于我们有限的时间，我们无法像完整规模的课程那样详细地介绍所有工具。在可能的情况下，我们将尝试引导你了解进一步挖掘工具或主题的资源，但如果有什么特别吸引你的，请不要犹豫，向我们寻求指导！
- en: Finally, if you have feedback about the class, please send it to us by email
    at [missing-semester@mit.edu](mailto:missing-semester@mit.edu).
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: 最后，如果您对这门课程有任何反馈，请通过电子邮件发送给我们，邮箱地址是[missing-semester@mit.edu](mailto:missing-semester@mit.edu)。
- en: 'Topic 1: The Shell'
  id: totrans-14
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 主题1：Shell
- en: What is the shell?
  id: totrans-15
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 什么是shell？
- en: 'Computers these days have a variety of interfaces for giving them commands;
    fanciful graphical user interfaces, voice interfaces, AR/VR, and more recently:
    LLMs. These are great for 80% of use-cases, but they are often fundamentally restricted
    in what they allow you to do — you cannot press a button that isn’t there or give
    a voice command that hasn’t been programmed. To take full advantage of the tools
    your computer provides, we have to go old-school and drop down to a textual interface:
    The Shell.'
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 今天的计算机有各种各样的命令输入接口；花哨的图形用户界面、语音界面、AR/VR，以及最近：LLMs。这些对于80%的使用场景来说都很棒，但它们在允许你做什么方面通常有根本性的限制——你不能按一个不存在的按钮，也不能给出一个未编程的语音命令。为了充分利用计算机提供的工具，我们必须回到老式的方法，降级到文本界面：Shell。
- en: 'Nearly all platforms you can get your hands on have a shell in one form or
    another, and many of them have several shells for you to choose from. While they
    may vary in the details, at their core they are all roughly the same: they allow
    you to run programs, give them input, and inspect their output in a semi-structured
    way.'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 几乎所有你可以接触到的平台都以某种形式提供shell，其中许多平台提供了多个shell供你选择。虽然它们在细节上可能有所不同，但它们的本质大致相同：它们允许你运行程序，向它们提供输入，并以半结构化的方式检查它们的输出。
- en: 'To open a shell *prompt* (where you can type commands), you first need a *terminal*,
    which is the visual interface to a shell. Your device probably shipped with one
    installed, or you can install one fairly easily:'
  id: totrans-18
  prefs: []
  type: TYPE_NORMAL
  zh: 要打开shell *提示符*（在那里你可以输入命令），你首先需要一个 *终端*，它是shell的视觉界面。你的设备可能已经预装了一个，或者你可以相对容易地安装一个：
- en: '**Linux:** Press `Ctrl + Alt + T` (works on most distributions). Or search
    for “Terminal” in your applications menu.'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Linux:** 按`Ctrl + Alt + T`（在大多数发行版上有效）。或者在你的应用程序菜单中搜索“终端”。'
- en: '**Windows:** Press `Win + R`, type `cmd` or `powershell`, and press Enter.
    Alternatively, search “Terminal” or “Command Prompt” in the Start menu.'
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**Windows:** 按`Win + R`，输入`cmd`或`powershell`，然后按Enter。或者你可以在开始菜单中搜索“终端”或“命令提示符”。'
- en: '**macOS:** Press `Cmd + Space` to open Spotlight, type “Terminal”, and press
    Enter. Or find it in Applications → Utilities → Terminal.'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**macOS:** 按`Cmd + Space`打开Spotlight，输入“Terminal”，然后按Enter。或者你可以在应用程序→实用工具→Terminal中找到它。'
- en: On Linux and macOS, this will usually open the Bourne Again SHell, or “bash”
    for short. This is one of the most widely used shells, and its syntax is similar
    to what you will see in many other shells. On Windows, you’ll be greeted by the
    “batch” or “powershell” shells, depending on which command you ran. These are
    Windows-specific, and not what we’ll be focusing on in this class, although it
    has analogues for most of what we’ll be teaching. You’ll instead want the [Windows
    Subsystem for Linux](https://docs.microsoft.com/en-us/windows/wsl/) or a Linux
    virtual machine.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 在Linux和macOS上，这通常将打开Bourne Again SHell，或简称“bash”。这是最广泛使用的shell之一，其语法与你在许多其他shell中看到的大致相同。在Windows上，你将遇到“批处理”或“powershell”shell，具体取决于你运行了哪个命令。这些是Windows特有的，我们在这个课程中不会关注它们，尽管它们与我们将要教授的大部分内容都有类似之处。你将需要[Windows
    Subsystem for Linux](https://docs.microsoft.com/en-us/windows/wsl/)或Linux虚拟机。
- en: Other shells exist, often with many ergonomic improvements over bash (fish and
    zsh are among the most common). While these are very popular (all the instructors
    use one), they’re nowhere near as ubiquitous as bash, and lean on many of the
    same concepts, so we won’t be focusing on those in this lecture.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 其他shell也存在，通常在bash（fish和zsh是最常见的）上有很多用户体验改进。虽然这些非常受欢迎（所有讲师都使用一个），但它们远不如bash普遍，并且依赖于许多相同的概念，所以我们不会在这个讲座中关注它们。
- en: Why should you care about it?
  id: totrans-24
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 你为什么应该关心它？
- en: The shell is not just (usually) much faster than “clicking around”, it also
    comes with expressive power you can’t easily find in any one graphical program.
    As we’ll see, the shell gives you the ability to *combine* programs in creative
    ways to automate nearly any task.
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: shell不仅仅是（通常）比“点击”快得多，它还提供了你在任何单个图形程序中都难以找到的表达能力。正如我们将看到的，shell让你能够以创造性的方式*组合*程序，从而自动化几乎任何任务。
- en: Knowing your way around a shell is also very useful to navigate the world of
    open-source software (which often come with install instructions that require
    the shell), building continuous integration for your software projects (as described
    in the [Code Quality lecture](/2026/code-quality/)), and debugging errors when
    other programs fail.
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 熟悉shell的使用对于导航开源软件的世界非常有用（这些软件通常带有需要shell的安装说明），为你的软件项目构建持续集成（如[代码质量讲座](/2026/code-quality/)中所述），以及在其他程序失败时调试错误。
- en: Navigating in the shell
  id: totrans-27
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 在shell中导航
- en: 'When you launch your terminal, you will see a *prompt* that often looks a little
    like this:'
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 当你启动终端时，你会看到一个*提示符*，通常看起来有点像这样：
- en: '[PRE0]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'This is the main textual interface to the shell. It tells you that you are
    on the machine `missing` and that your “current working directory”, or where you
    currently are, is `~` (short for “home”). The `$` tells you that you are not the
    root user (more on that later). At this prompt you can type a *command*, which
    will then be interpreted by the shell. The most basic command is to execute a
    program:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 这是shell的主要文本界面。它告诉你你正在机器`missing`上，你的“当前工作目录”，或你目前所在的位置，是`~`（代表“家”）。`$`告诉你你不是root用户（稍后会有更多关于这个话题的讨论）。在这个提示符下，你可以输入一个*命令*，然后shell会解释这个命令。最基本的命令是执行一个程序：
- en: '[PRE1]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'Here, we executed the `date` program, which (perhaps unsurprisingly) prints
    the current date and time. The shell then asks us for another command to execute.
    We can also execute a command with *arguments*:'
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 在这里，我们执行了`date`程序，它（可能不出所料）打印了当前的日期和时间。然后shell会要求我们执行另一个命令。我们也可以用*参数*执行命令：
- en: '[PRE2]'
  id: totrans-33
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: In this case, we told the shell to execute the program `echo` with the argument
    `hello`. The `echo` program simply prints out its arguments. The shell parses
    the command by splitting it by whitespace, and then runs the program indicated
    by the first word, supplying each subsequent word as an argument that the program
    can access. If you want to provide an argument that contains spaces or other special
    characters (e.g., a directory named “My Photos”), you can either quote the argument
    with `'` or `"` (`"My Photos"`), or escape just the relevant characters with `\`
    (`My\ Photos`).
  id: totrans-34
  prefs: []
  type: TYPE_NORMAL
  zh: '在这种情况下，我们告诉shell执行程序`echo`，并带有参数`hello`。`echo`程序简单地打印出其参数。shell通过按空格分割命令来解析它，然后运行由第一个单词指示的程序，并将每个后续单词作为程序可以访问的参数提供。如果你想提供一个包含空格或其他特殊字符的参数（例如，名为“我的照片”的目录），你可以用`''`或`"`（`"我的照片"`）引用参数，或者用`\`（`My\
    Photos`）转义相关字符。 '
- en: Perhaps the most important command when you’re starting out is `man`, short
    for “manual”. The `man` program, among other things, lets you look up more information
    about any command on your system. For example, if you run `man date`, it’ll explain
    what `date` is, and all of the various arguments you can pass it to alter its
    behavior. You can also usually get a short version of the help by passing `--help`
    as an argument to most commands.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 当你刚开始时，最重要的命令可能是 `man`，简称“手册”。`man` 程序（以及其他功能）允许你查找有关系统上任何命令的更多信息。例如，如果你运行 `man
    date`，它会解释 `date` 是什么，以及你可以传递给它以改变其行为的各种参数。你通常也可以通过将 `--help` 作为参数传递给大多数命令来获取简短的帮助信息。
- en: Consider installing and using [`tldr`](https://tldr.sh/) in addition to `man`,
    as it shows you common usage examples right there in the terminal. LLMs are also
    usually very good at explaining how commands work and how you can call them to
    achieve what you want to accomplish.
  id: totrans-36
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 除了 `man` 之外，考虑安装并使用 [`tldr`](https://tldr.sh/)，因为它会在终端中直接显示常见的使用示例。大型语言模型（LLMs）通常也非常擅长解释命令的工作原理以及如何调用它们以实现你想要达成的目标。
- en: 'After `man`, the most important command to learn is `cd`, or “change directory”.
    This command is actually built into the shell, and isn’t a separate program (i.e.,
    `which cd` will say “no cd found”). You pass it a path, and that path becomes
    your current working directory. You’ll also see the working directory reflected
    in the shell prompt:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 在 `man` 之后，最重要的命令要学习的是 `cd`，或称为“更改目录”。这个命令实际上是内置于shell中的，不是一个单独的程序（即，`which
    cd` 会显示“未找到 cd”）。你传递给它一个路径，该路径将成为你的当前工作目录。你也会在shell提示符中看到工作目录的反映：
- en: '[PRE3]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: Note that the shell comes with auto-completion, so you can often complete paths
    faster by pressing `<TAB>`!
  id: totrans-39
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 注意，shell自带自动补全功能，所以你可以通过按 `<TAB>` 来更快地完成路径！
- en: A lot of commands operate on the current working directory if nothing else is
    specified. If you’re ever unsure where you are, you can run `pwd` or print the
    `$PWD` environment variable (with `echo $PWD`), both of which produce the current
    working directory.
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 许多命令在没有指定其他路径的情况下都会在当前工作目录下操作。如果你不确定自己在哪里，可以运行 `pwd` 或打印 `$PWD` 环境变量（使用 `echo
    $PWD`），这两个命令都会显示当前工作目录。
- en: 'The current working directory also comes in handy in that it allows us to use
    *relative* paths. All the paths we’ve seen so far have been *absolute* — they
    start with `/` and give the full set of directories needed to navigate to some
    location from the root of the file system (`/`). In practice, you’ll more commonly
    work with relative paths; so called because they are relative to the current working
    directory. In a relative path (anything *not* starting with `/`), the first path
    component is looked up in the current working directory, and subsequent components
    traverse as usual. For example:'
  id: totrans-41
  prefs: []
  type: TYPE_NORMAL
  zh: 当前工作目录非常有用，因为它允许我们使用 *相对* 路径。到目前为止，我们看到的路径都是 *绝对* 的——它们以 `/` 开头，并给出从文件系统根目录（`/`）导航到某个位置所需的所有目录。在实践中，你更可能使用相对路径；之所以称为相对路径，是因为它们相对于当前工作目录。在相对路径（不以
    `/` 开头的任何路径）中，第一个路径组件将在当前工作目录中查找，后续组件将按常规遍历。例如：
- en: '[PRE4]'
  id: totrans-42
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: 'There are also two “special” components that exist in every directory: `.`
    and `..`. `.` is “this directory”, and `..` is “the parent directory”. So:'
  id: totrans-43
  prefs: []
  type: TYPE_NORMAL
  zh: 每个目录中还存在两个“特殊”组件：`.` 和 `..`。`.` 表示“当前目录”，而 `..` 表示“父目录”。所以：
- en: '[PRE5]'
  id: totrans-44
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: You can usually use absolute and relative paths interchangeably for any command
    argument, just keep in mind what your current working directory is when using
    a relative one!
  id: totrans-45
  prefs: []
  type: TYPE_NORMAL
  zh: 你通常可以在任何命令参数中使用绝对和相对路径互换，只需在使用相对路径时记住你的当前工作目录即可！
- en: Consider installing and using [`zoxide`](https://github.com/ajeetdsouza/zoxide)
    to speed up your `cd`ing — `z` will remember the paths you frequently visit and
    let you access with less typing.
  id: totrans-46
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 考虑安装并使用 [`zoxide`](https://github.com/ajeetdsouza/zoxide) 来加速你的 `cd` 操作——`z`
    会记住你经常访问的路径，并允许你通过更少的输入来访问它们。
- en: What is available in the shell?
  id: totrans-47
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 在shell中有什么可用？
- en: 'But how does the shell know how to find programs like `date` or `echo`? If
    the shell is asked to execute a command, it consults an *environment variable*
    called `$PATH` that lists which directories the shell should search for programs
    when it is given a command:'
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 但shell是如何知道如何找到像 `date` 或 `echo` 这样的程序的？如果shell被要求执行一个命令，它会咨询一个名为 `$PATH` 的
    *环境变量*，该变量列出了shell在接收到命令时应搜索哪些目录以查找程序：
- en: '[PRE6]'
  id: totrans-49
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: When we run the `echo` command, the shell sees that it should execute the program
    `echo`, and then searches through the `:`-separated list of directories in `$PATH`
    for a file by that name. When it finds it, it runs it (assuming the file is *executable*;
    more on that later). We can find out which file is executed for a given program
    name using the `which` program. We can also bypass `$PATH` entirely by giving
    the *path* to the file we want to execute.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 当我们运行`echo`命令时，shell会看到它应该执行程序`echo`，然后会在`$PATH`中以冒号分隔的目录列表中搜索同名文件。当找到它时，就会运行它（假设文件是*可执行*的；关于这一点稍后还会详细说明）。我们可以使用`which`程序找出给定程序名对应的文件。我们也可以通过给出要执行的文件的*路径*来完全绕过`$PATH`。
- en: 'This also gives a clue for how we can determine *all* the programs we’re able
    to execute in the shell: by listing the contents of all the directories on `$PATH`.
    We can do this by passing a given directory path to the `ls` program, which lists
    files:'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: 这也为我们提供了如何确定在shell中可以执行的所有程序的线索：通过列出`$PATH`上所有目录的内容。我们可以通过将给定的目录路径传递给`ls`程序来实现这一点，该程序会列出文件：
- en: '[PRE7]'
  id: totrans-52
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: Consider installing and using [`eza`](https://eza.rocks/) for a more human-friendly
    `ls`.
  id: totrans-53
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 考虑安装并使用[`eza`](https://eza.rocks/)来获得一个更人性化的`ls`命令。
- en: 'This will, on most computers, print a *lot* of programs, but we’ll only focus
    on some of the most important ones here. First, some simple ones:'
  id: totrans-54
  prefs: []
  type: TYPE_NORMAL
  zh: 在大多数计算机上，这将打印出大量的程序，但在这里我们只关注其中一些最重要的。首先是一些简单的：
- en: '`cat file`, which prints the contents of `file`.'
  id: totrans-55
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`cat file`，它打印`file`的内容。'
- en: '`sort file`, which prints out the lines of `file` in sorted order.'
  id: totrans-56
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`sort file`，它以排序顺序打印`file`的行。'
- en: '`uniq file`, which eliminates consecutive duplicate lines from `file`.'
  id: totrans-57
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`uniq file`，它从`file`中删除连续重复的行。'
- en: '`head file` and `tail file`, which respectively print the first and last few
    lines of `file`.'
  id: totrans-58
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`head file`和`tail file`，分别打印`file`的第一行和最后一行。'
- en: Consider installing and using [`bat`](https://github.com/sharkdp/bat) over `cat`
    for syntax highlighting and scrolling.
  id: totrans-59
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 考虑安装并使用[`bat`](https://github.com/sharkdp/bat)代替`cat`来进行语法高亮和滚动。
- en: There’s also `grep pattern file`, which finds lines matching `pattern` in `file`.
    This one deserves slightly more attention as it’s both *very* useful and sports
    a wider array of features than one may expect. `pattern` is actually a *regular
    expression* which can express very complex patterns — we’ll [cover those](/2026/code-quality/#regular-expressions)
    in the code quality lecture. You can also specify a directory instead of a file
    (or leave it off for `.`) and pass `-r` to recursively search all the files in
    a directory.
  id: totrans-60
  prefs: []
  type: TYPE_NORMAL
  zh: 还有`grep pattern file`，它会在`file`中查找匹配`pattern`的行。这个命令非常实用，并且具有比预期更广泛的功能。`pattern`实际上是一个*正则表达式*，可以表达非常复杂的模式——我们将在代码质量讲座中[介绍这些内容](/2026/code-quality/#regular-expressions)。您也可以指定一个目录而不是文件（或省略它以使用`.`），并通过传递`-r`来递归搜索目录中的所有文件。
- en: Consider installing and using [`ripgrep`](https://github.com/BurntSushi/ripgrep)
    over `grep` for a faster and more human-friendly (but less portable) alternative.
    `ripgrep` will also recursively search the current working directory by default!
  id: totrans-61
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 考虑安装并使用[`ripgrep`](https://github.com/BurntSushi/ripgrep)代替`grep`，以获得更快且更人性化的（但不太便携）替代方案。`ripgrep`默认也会递归搜索当前工作目录！
- en: 'There are also some very useful tools with a slightly more complicated interface.
    First among those is `sed`, which is a programmatic file editor. It has its own
    programming language for making automated edits to files, but the most common
    use of it is:'
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 同时也有一些非常实用的工具，但界面稍微复杂一些。其中最重要的是`sed`，这是一个程序化的文件编辑器。它拥有自己的编程语言，用于对文件进行自动化编辑，但最常用的用法是：
- en: '[PRE8]'
  id: totrans-63
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: This replaces all instances of `pattern` with `replacement` in `file`. The `-i`
    indicates that we want the substitutions to happen inline (as opposed to leaving
    `file` unmodified and printing the substituted contents). The `s/` is the way
    to express in the sed programming language that we want to do a substitution.
    The `/` separates the pattern from the replacement. And the trailing `/g` indicates
    that we want to replace *all* occurrences on each line rather than just the first.
    As with `grep`, `pattern` here is a regular expression, which gives you significant
    expressive power. Regular expression substitutions also allow `replacement` to
    refer back to parts of the matched pattern; we’ll see an example of that in a
    second.
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: 在 `file` 中替换所有 `pattern` 实例为 `replacement`。`-i` 表示我们希望替换在行内发生（而不是留下未修改的 `file`
    并打印替换后的内容）。`s/` 是在 sed 编程语言中表示我们想要进行替换的方式。`/` 将模式与替换项分开。尾随的 `/g` 表示我们想要替换每行的所有出现，而不仅仅是第一个。与
    `grep` 一样，这里的 `pattern` 是一个正则表达式，它赋予你强大的表达能力。正则表达式替换还允许 `replacement` 引用匹配模式的各个部分；我们将在下一秒看到一个例子。
- en: 'Next, we have `find`, which lets you find files (recursively) that match certain
    conditions. For example:'
  id: totrans-65
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来是 `find`，它允许你查找符合某些条件的文件（递归地）。例如：
- en: '[PRE9]'
  id: totrans-66
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: Finds ZIP files in the download directory that are older than 30 days.
  id: totrans-67
  prefs: []
  type: TYPE_NORMAL
  zh: 在下载目录中查找超过 30 天的 ZIP 文件。
- en: '[PRE10]'
  id: totrans-68
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: Finds files larger than 100M in your home directory and lists them. Note that
    `-exec` takes a *command* terminated with a stand-alone `;` (which we need to
    escape much like a space) where `{}` is replaced with each matching file path
    by `find`.
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 在你的主目录中查找大于 100M 的文件并将它们列出。注意 `-exec` 接受一个以独立 `;` 结尾的 *命令*（我们像对待空格一样需要转义它），其中
    `{}` 由 `find` 替换为每个匹配的文件路径。
- en: '[PRE11]'
  id: totrans-70
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: Finds any `.py` files with TODO items in them.
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: 查找包含 TODO 项的任何 `.py` 文件。
- en: The syntax of `find` can be a little daunting, but hopefully this gives you
    a sense of how useful it can be!
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: '`find` 的语法可能有点令人畏惧，但希望这能让你感受到它有多有用！'
- en: Consider installing and using [`fd`](https://github.com/sharkdp/fd) instead
    of `find` for a more human-friendly (but less portable!) experience.
  id: totrans-73
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 考虑安装并使用 `fd`（[https://github.com/sharkdp/fd](https://github.com/sharkdp/fd)）来代替
    `find`，以获得更人性化的（但不太便携的）体验。
- en: 'Next on the docket is `awk`, which, like `sed`, has its own programming language.
    Where `sed` is built for editing files, `awk` is built for parsing them. By far
    the most common use of `awk` is for data files with a regular syntax (like CSV
    files) where you want to extract only certain parts of every record (i.e., line):'
  id: totrans-74
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来是 `awk`，它就像 `sed` 一样有自己的编程语言。`sed` 是为编辑文件而构建的，而 `awk` 是为解析文件而构建的。到目前为止，`awk`
    最常见的用途是处理具有常规语法的数据文件（如 CSV 文件），你只想提取每条记录的特定部分（即行）：
- en: '[PRE12]'
  id: totrans-75
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: Prints the second whitespace-separated column of every line of `file`. If you
    add `-F,`, it’ll print the second comma-separated column of every line. `awk`
    can do much more — filtering rows, computing aggregates, and more — see the exercises
    for a taste.
  id: totrans-76
  prefs: []
  type: TYPE_NORMAL
  zh: 打印 `file` 中每行的第二个空白分隔的列。如果你添加 `-F,`，它将打印每行的第二个逗号分隔的列。`awk` 可以做更多的事情——过滤行、计算聚合等——详见练习以了解其风味。
- en: 'Putting these tools together, we can do fancy things like:'
  id: totrans-77
  prefs: []
  type: TYPE_NORMAL
  zh: 将这些工具组合起来，我们可以做一些很酷的事情，比如：
- en: '[PRE13]'
  id: totrans-78
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: This grabs SSH logs from a remote server (we’ll talk more about `ssh` in the
    next lecture), searches for disconnect messages, extracts the username from each
    such message, and prints the top 10 usernames comma-separated. All in one command!
    We’ll leave dissecting each step as an exercise.
  id: totrans-79
  prefs: []
  type: TYPE_NORMAL
  zh: 这从远程服务器抓取 SSH 日志（我们将在下一讲中更多地讨论 `ssh`），搜索断开连接的消息，从每个此类消息中提取用户名，并以逗号分隔打印前 10 个用户名。所有这些都在一个命令中完成！我们将把分析每个步骤作为练习留给你们。
- en: The shell language (bash)
  id: totrans-80
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Shell 语言（bash）
- en: 'The previous example introduced a new concept: pipes (`|`). These let you string
    together the output of one program with the input of another. This works because
    most command-line programs will operate on their “standard input” (where your
    keystrokes normally go) if no `file` argument is given. `|` takes the “standard
    output” (what normally gets printed to your terminal) of the program before the
    `|` and makes it be the standard input of the program after the `|`. This allows
    you to *compose* shell programs, and it’s part of what makes the shell such a
    productive environment to work in!'
  id: totrans-81
  prefs: []
  type: TYPE_NORMAL
  zh: 之前的例子介绍了一个新概念：管道（`|`）。这些允许你将一个程序的输出与另一个程序输入连接起来。这是因为大多数命令行程序如果没有给出 `file` 参数，将会操作它们的“标准输入”（你的按键通常去的地方）。`|`
    会将程序在 `|` 之前的“标准输出”（通常打印到你的终端的内容）作为 `|` 之后程序的标准输入。这允许你 *组合* shell程序，这也是shell成为一个高效工作环境的一部分！
- en: 'In fact, most shells implement a full programming language (like bash), just
    like Python or Ruby. It has variables, conditionals, loops, and functions. When
    you run commands in your shell, you are really writing a small bit of code that
    your shell interprets. We won’t teach you all of bash today, but there are some
    bits you’ll find particularly useful:'
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 事实上，大多数shell都实现了一种完整的编程语言（如bash），就像Python或Ruby一样。它有变量、条件语句、循环和函数。当你你在shell中运行命令时，你实际上是在编写一小段代码，由shell进行解释。我们今天不会教你所有的bash，但有一些功能你会发现特别有用：
- en: 'First, redirects: `>file` lets you take the standard output of a program and
    write it to `file` instead of to your terminal. This makes it easier to analyze
    after the fact. `>>file` will append to `file` rather than overwrite it. There’s
    also `<file` which tells the shell to read from `file` instead of from your keyboard
    as the standard input to a program.'
  id: totrans-83
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，重定向：`>file` 允许你将程序的输出标准输出写入到 `file` 中，而不是你的终端。这使得事后分析更容易。`>>file` 将会追加到 `file`
    而不是覆盖它。还有 `<file`，它告诉shell从 `file` 读取，而不是从你的键盘读取作为程序的标准输入。
- en: This is a good time to mention the `tee` program. `tee` will print standard
    input to standard output (just like `cat`!), but will *also* write it to a file.
    So `verbose cmd | tee verbose.log | grep CRITICAL` will preserve the full verbose
    log to a file while keeping your terminal clean!
  id: totrans-84
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 这正是提到 `tee` 程序的好时机。`tee` 将标准输入打印到标准输出（就像 `cat` 一样！）但也会 *同时* 写入到文件中。所以 `verbose
    cmd | tee verbose.log | grep CRITICAL` 将会保留完整的详细日志到文件中，同时保持你的终端整洁！
- en: 'Next, conditionals: `if command1; then command2; command3; fi` will execute
    `command1`, and if it doesn’t result in an error, will run `command2` and `command3`.
    You can also have an `else` branch if you wish. The most common command to use
    as `command1` is the `test` command, often abbreviated simply as `[`, which lets
    you evaluate conditions like “does a file exist” (`test -f file` / `[ -f file
    ]`) or “does a string equal another” (`[ "$var" = "string" ]`). In bash, there’s
    also `[[ ]]`, which is a “safer” built-in version of `test` that has fewer odd
    behaviours around quoting.'
  id: totrans-85
  prefs: []
  type: TYPE_NORMAL
  zh: 接下来，条件语句：`if command1; then command2; command3; fi` 会执行 `command1`，如果它没有产生错误，将会运行
    `command2` 和 `command3`。你也可以根据需要有一个 `else` 分支。最常用的 `command1` 命令是 `test` 命令，通常简写为
    `[`，它允许你评估条件，如“文件是否存在” (`test -f file` / `[ -f file ]`) 或“字符串是否等于另一个” (`[ "$var"
    = "string" ]`)。在bash中，还有 `[[ ]]`，这是一个“更安全”的 `test` 内置版本，它在引号周围有更少奇怪的行为。
- en: 'Bash also has two forms of loops, `while` and `for`. `while command1; do command2;
    command3; done` functions just like the equivalent `if` command, except that it
    will re-execute the whole thing over and over for as long as `command1` does not
    error. `for varname in a b c d; do command; done` executes `command` four times,
    each time with `$varname` set to one of `a`, `b`, `c`, and `d`. Instead of listing
    the items explicitly, you’ll often use “command substitution”, such as:'
  id: totrans-86
  prefs: []
  type: TYPE_NORMAL
  zh: Bash还有两种循环形式，`while` 和 `for`。`while command1; do command2; command3; done` 的功能与等效的
    `if` 命令类似，只不过它会在 `command1` 不出错的情况下重复执行整个操作。`for varname in a b c d; do command;
    done` 会执行 `command` 四次，每次将 `$varname` 设置为 `a`、`b`、`c` 和 `d` 中的一个。你通常不会明确列出项目，而是会使用“命令替换”，例如：
- en: '[PRE14]'
  id: totrans-87
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: This executes the command `seq 1 10` (which prints the numbers from 1 to 10
    inclusive) and then replaces the whole `$()` with that command’s output, giving
    you a 10-iteration for loop. In older code you’ll sometimes see literal backticks
    (like ``for i in `seq 1 10`; do``) instead of `$()`, but you should strongly prefer
    the `$()` form as it can be nested.
  id: totrans-88
  prefs: []
  type: TYPE_NORMAL
  zh: 这将执行 `seq 1 10` 命令（打印从 1 到 10 的所有数字）并将整个 `$()` 替换为该命令的输出，从而提供一个 10 次迭代的 for
    循环。在旧代码中，你有时会看到实际的反引号（如 ``for i in `seq 1 10`; do``）而不是 `$()`，但你应该强烈偏好 `$()` 形式，因为它可以嵌套。
- en: 'While you *can* write long shell scripts directly in your prompt, you’ll usually
    want to write them into a `.sh` file instead. For example, here’s a script that
    will run a program in a loop until it fails, printing the output only of the failed
    run, while stressing your CPU in the background (useful to reproduce flaky tests
    for example):'
  id: totrans-89
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然 *你可以* 直接在你的提示符中编写长的 shell 脚本，但你通常会将它们写入一个 `.sh` 文件。例如，以下是一个脚本，它将循环运行程序直到它失败，只打印失败的运行输出，同时在后台压力测试
    CPU（例如，用于重现不可靠的测试）：
- en: '[PRE15]'
  id: totrans-90
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: This has a number of new things in it that I recommend you spend some time diving
    into, as they’re very useful in crafting useful shell invocations like background
    jobs (`&`) to run programs concurrently, trickier [shell redirections](https://www.gnu.org/software/bash/manual/html_node/Redirections.html),
    and [arithmetic expansion](https://www.gnu.org/software/bash/manual/html_node/Arithmetic-Expansion.html).
  id: totrans-91
  prefs: []
  type: TYPE_NORMAL
  zh: 这其中包含了一些新的内容，我建议你花些时间深入研究，因为它们在构建有用的 shell 调用方面非常有用，例如后台作业 (`&`) 以并发运行程序，更复杂的
    [shell 重定向](https://www.gnu.org/software/bash/manual/html_node/Redirections.html)，以及
    [算术扩展](https://www.gnu.org/software/bash/manual/html_node/Arithmetic-Expansion.html)。
- en: It’s worth spending a second on the first two lines of the program though. The
    first is the “shebang” – you’ll see this at the top of other files than shell
    scripts too. When a file that starts with the magic incantation `#!/path` is executed,
    the shell will start the program at `/path`, and pass it the contents of the file
    as input. In the case of a shell script, this means passing the contents of the
    shell script to `/bin/bash`, but you can also write Python scripts with a shebang
    line of `/usr/bin/python`!
  id: totrans-92
  prefs: []
  type: TYPE_NORMAL
  zh: 虽然值得花点时间关注程序的前两行。第一行是“shebang” – 你也会在其他文件的顶部看到它。当一个以魔法咒语 `#!/path` 开头的文件被执行时，shell
    将在 `/path` 启动程序，并将文件的内容作为输入传递给它。在 shell 脚本的情况下，这意味着将 shell 脚本的内容传递给 `/bin/bash`，但你也可以编写具有
    `/usr/bin/python` shebang 行的 Python 脚本！
- en: 'The second line is a way to make bash “stricter”, and mitigate a number of
    footguns when writing shell scripts. `set` can take a whole lot of arguments,
    but briefly: `-e` makes it so that if any command fails, the script exits early;
    `-u` makes it so that use of undefined variables crashes the script rather than
    just using an empty string; and `-o pipefail` makes it so that if programs in
    a `|` sequence fail, the shell script as a whole also exits early.'
  id: totrans-93
  prefs: []
  type: TYPE_NORMAL
  zh: 第二行是一种使 bash “更严格”的方法，并在编写 shell 脚本时减轻了许多陷阱。`set` 可以接受大量的参数，但简要来说：`-e` 使得如果任何命令失败，脚本会提前退出；`-u`
    使得使用未定义的变量会导致脚本崩溃，而不是简单地使用空字符串；`-o pipefail` 使得如果 `|` 序列中的程序失败，整个 shell 脚本也会提前退出。
- en: 'Shell programming is a deep topic, just as any programming language is, but
    be warned: bash has an unusual number of gotchas, to the point that there are
    [multiple](https://tldp.org/LDP/abs/html/gotchas.html) websites dedicated to [listing
    them](https://mywiki.wooledge.org/BashPitfalls). I highly recommend making heavy
    use of [shellcheck](https://www.shellcheck.net/) when writing them. LLMs are also
    great at writing and debugging shell scripts, as well as translating them to a
    “real” programming language (like Python) when they’ve grown too unwieldy for
    bash (100+ lines).'
  id: totrans-94
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: Shell 编程是一个深奥的主题，就像任何编程语言一样，但请注意：bash 有很多陷阱，以至于有 [多个](https://tldp.org/LDP/abs/html/gotchas.html)
    网站 [列出它们](https://mywiki.wooledge.org/BashPitfalls)。我强烈建议在编写它们时大量使用 [shellcheck](https://www.shellcheck.net/)。LLMs
    在编写和调试 shell 脚本以及将它们转换为“真实”编程语言（如 Python）方面也非常出色，当它们在 bash 中变得难以控制时（100+ 行）。
- en: Next steps
  id: totrans-95
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 下一步
- en: At this point you know your way around a shell enough to accomplish basic tasks.
    You should be able to navigate around to find files of interest and use the basic
    functionality of most programs. In the next lecture, we will talk about how to
    perform and automate more complex tasks using the shell and the many handy command-line
    programs out there.
  id: totrans-96
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，你已经掌握了足够多的shell知识来完成基本任务。你应该能够导航到找到感兴趣的文件，并使用大多数程序的基本功能。在下一讲中，我们将讨论如何使用shell和许多实用的命令行程序来执行和自动化更复杂的任务。
- en: Exercises
  id: totrans-97
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: All classes in this course are accompanied by a series of exercises. Some give
    you a specific task to do, while others are open-ended, like “try using X and
    Y programs”. We highly encourage you to try them out.
  id: totrans-98
  prefs: []
  type: TYPE_NORMAL
  zh: 本课程中的所有课程都附有一系列练习。有些练习会给你一个具体的任务去做，而有些则是开放式的，例如“尝试使用X和Y程序”。我们强烈鼓励你尝试它们。
- en: We have not written solutions for the exercises. If you are stuck on anything
    in particular, feel free to post in `#missing-semester-forum` on [Discord](https://ossu.dev/#community)
    or send us an email describing what you’ve tried so far, and we will try to help
    you out. These exercises will also likely work well as initial prompts in a conversation
    with an LLM where you can interactively dive into the topic. The real value in
    these exercises is the journey of discovering the answers, not the answer itself.
    We encourage you to follow tangents and ask “why” as you work through them, rather
    than just looking for the shortest path to the solution.
  id: totrans-99
  prefs: []
  type: TYPE_NORMAL
  zh: 我们没有为练习编写解决方案。如果你在某个特定的问题上遇到了困难，请随时在[Discord](https://ossu.dev/#community)上的`#missing-semester-forum`帖子中发布，或者发送一封电子邮件描述你迄今为止所尝试的内容，我们将尽力帮助你。这些练习也可能作为与LLM对话的初始提示非常有效，你可以在其中交互式地深入研究主题。这些练习的真正价值在于发现答案的过程，而不是答案本身。我们鼓励你在解决它们时跟随思路，并询问“为什么”，而不是仅仅寻找解决问题的最短路径。
- en: For this course, you need to be using a Unix shell like Bash or ZSH. If you
    are on Linux or macOS, you don’t have to do anything special. If you are on Windows,
    you need to make sure you are not running cmd.exe or PowerShell; you can use [Windows
    Subsystem for Linux](https://docs.microsoft.com/en-us/windows/wsl/) or a Linux
    virtual machine to use Unix-style command-line tools. To make sure you’re running
    an appropriate shell, you can try the command `echo $SHELL`. If it says something
    like `/bin/bash` or `/usr/bin/zsh`, that means you’re running the right program.
  id: totrans-100
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 对于这门课程，你需要使用像Bash或ZSH这样的Unix shell。如果你使用Linux或macOS，你不需要做任何特殊的事情。如果你使用Windows，你需要确保你不在运行cmd.exe或PowerShell；你可以使用[Windows
    Subsystem for Linux](https://docs.microsoft.com/en-us/windows/wsl/)或Linux虚拟机来使用Unix风格的命令行工具。为了确保你正在运行适当的shell，你可以尝试运行命令`echo
    $SHELL`。如果它显示类似`/bin/bash`或`/usr/bin/zsh`的信息，这意味着你正在运行正确的程序。
- en: 'What does the `-l` flag to `ls` do? Run `ls -l /` and examine the output. What
    do the first 10 characters of each line mean? (Hint: `man ls`)'
  id: totrans-101
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`ls`命令的`-l`标志有什么作用？运行`ls -l /`并检查输出。每一行的前10个字符代表什么？（提示：`man ls`）'
- en: In the command `find ~/Downloads -type f -name "*.zip" -mtime +30`, the `*.zip`
    is a “glob”. What is a glob? Create a test directory with some files and experiment
    with patterns like `ls *.txt`, `ls file?.txt`, and `ls {a,b,c}.txt`. See [Pattern
    Matching](https://www.gnu.org/software/bash/manual/html_node/Pattern-Matching.html)
    in the Bash manual.
  id: totrans-102
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在命令`find ~/Downloads -type f -name "*.zip" -mtime +30`中，`*.zip`是一个“通配符”。什么是通配符？创建一个包含一些文件的测试目录，并尝试使用`ls
    *.txt`、`ls file?.txt`和`ls {a,b,c}.txt`等模式进行实验。参见Bash手册中的[模式匹配](https://www.gnu.org/software/bash/manual/html_node/Pattern-Matching.html)。
- en: What’s the difference between `'single quotes'`, `"double quotes"`, and `$'ANSI
    quotes'`? Write a command that echoes a string containing a literal `$`, a `!`,
    and a newline character. See [Quoting](https://www.gnu.org/software/bash/manual/html_node/Quoting.html).
  id: totrans-103
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: “单引号”，`"双引号"`和`$'ANSI引号'`之间有什么区别？写一个命令，输出一个包含字面量`$`，`!`和换行符的字符串。参见[引号](https://www.gnu.org/software/bash/manual/html_node/Quoting.html)。
- en: 'The shell has three standard streams: stdin (0), stdout (1), and stderr (2).
    Run `ls /nonexistent /tmp` and redirect stdout to one file and stderr to another.
    How would you redirect both to the same file? See [Redirections](https://www.gnu.org/software/bash/manual/html_node/Redirections.html).'
  id: totrans-104
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: shell有三个标准流：stdin（0）、stdout（1）和stderr（2）。运行`ls /nonexistent /tmp`并将stdout重定向到一个文件，stderr重定向到另一个文件。你将如何将两者都重定向到同一个文件？参见[重定向](https://www.gnu.org/software/bash/manual/html_node/Redirections.html)。
- en: '`$?` holds the exit status of the last command (0 = success). `&&` runs the
    next command only if the previous succeeded; `||` runs it only if the previous
    failed. Write a one-liner that creates `/tmp/mydir` only if it doesn’t already
    exist. See [Exit Status](https://www.gnu.org/software/bash/manual/html_node/Exit-Status.html).'
  id: totrans-105
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`$?` 保存了最后一个命令的退出状态（0 = 成功）。`&&` 仅在之前的命令成功时运行下一个命令；`||` 仅在之前的命令失败时运行。编写一个单行命令，仅在目录不存在时创建
    `/tmp/mydir`。参见 [退出状态](https://www.gnu.org/software/bash/manual/html_node/Exit-Status.html)。'
- en: 'Why does `cd` have to be built into the shell itself rather than a standalone
    program? (Hint: think about what a child process can and cannot affect in its
    parent.)'
  id: totrans-106
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为什么 `cd` 必须集成到 shell 本身而不是一个独立程序中？（提示：考虑子进程可以和不能影响其父进程的内容。）
- en: Write a script that takes a filename as an argument (`$1`) and checks whether
    the file exists using `test -f` or `[ -f ... ]`. It should print different messages
    depending on whether the file exists. See [Bash Conditional Expressions](https://www.gnu.org/software/bash/manual/html_node/Bash-Conditional-Expressions.html).
  id: totrans-107
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 编写一个脚本，该脚本接受一个文件名作为参数（`$1`）并使用 `test -f` 或 `[ -f ... ]` 检查文件是否存在。根据文件是否存在打印不同的信息。参见
    [Bash 条件表达式](https://www.gnu.org/software/bash/manual/html_node/Bash-Conditional-Expressions.html)。
- en: 'Save the script from the previous exercise to a file (e.g., `check.sh`). Try
    running it with `./check.sh somefile`. What happens? Now run `chmod +x check.sh`
    and try again. Why is this step necessary? (Hint: look at `ls -l check.sh` before
    and after the `chmod`.)'
  id: totrans-108
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 将之前练习中的脚本保存到文件中（例如，`check.sh`）。尝试使用 `./check.sh somefile` 运行它。发生了什么？现在运行 `chmod
    +x check.sh` 再试一次。为什么这一步是必要的？（提示：在 `chmod` 之前和之后使用 `ls -l check.sh` 查看。）
- en: What happens if you add `-x` to the `set` flags in a script? Try it with a simple
    script and observe the output. See [The Set Builtin](https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html).
  id: totrans-109
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果你在脚本中的 `set` 标志中添加 `-x` 会发生什么？用一个简单的脚本试一试，并观察输出。参见 [Set 内置命令](https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html)。
- en: 'Write a command that copies a file to a backup with today’s date in the filename
    (e.g., `notes.txt` → `notes_2026-01-12.txt`). (Hint: `$(date +%Y-%m-%d)`). See
    [Command Substitution](https://www.gnu.org/software/bash/manual/html_node/Command-Substitution.html).'
  id: totrans-110
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 编写一个命令，将文件复制到带有今天日期的备份文件中（例如，`notes.txt` → `notes_2026-01-12.txt`）。（提示：`$(date
    +%Y-%m-%d)`）。参见 [命令替换](https://www.gnu.org/software/bash/manual/html_node/Command-Substitution.html)。
- en: 'Modify the flaky test script from the lecture to accept the test command as
    an argument instead of hardcoding `cargo test my_test`. (Hint: `$1` or `$@`).
    See [Special Parameters](https://www.gnu.org/software/bash/manual/html_node/Special-Parameters.html).'
  id: totrans-111
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 修改讲座中的易出错的测试脚本，使其接受测试命令作为参数而不是硬编码 `cargo test my_test`。（提示：`$1` 或 `$@`）。参见 [特殊参数](https://www.gnu.org/software/bash/manual/html_node/Special-Parameters.html)。
- en: 'Use pipes to find the 5 most common file extensions in your home directory.
    (Hint: combine `find`, `grep` or `sed` or `awk`, `sort`, `uniq -c`, and `head`.)'
  id: totrans-112
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用管道查找主目录中 5 个最常见的文件扩展名。（提示：结合 `find`、`grep` 或 `sed` 或 `awk`、`sort`、`uniq -c`
    和 `head`。）
- en: '`xargs` converts lines from stdin into command arguments. Use `find` and `xargs`
    together (not `find -exec`) to find all `.sh` files in a directory and count the
    lines in each with `wc -l`. Bonus: make it handle filenames with spaces. (Hint:
    `-print0` and `-0`). See `man xargs`.'
  id: totrans-113
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`xargs` 将标准输入的行转换为命令参数。将 `find` 和 `xargs` 结合使用（而不是 `find -exec`）来查找目录中的所有 `.sh`
    文件，并使用 `wc -l` 计算每个文件的行数。加分项：使其能够处理包含空格的文件名。（提示：`-print0` 和 `-0`）。参见 `man xargs`。'
- en: 'Use `curl` to fetch the HTML of the course website (`https://missing.csail.mit.edu/`)
    and pipe it to `grep` to count how many lectures are listed. (Hint: look for a
    pattern that appears once per lecture; use `curl -s` to silence the progress output.)'
  id: totrans-114
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用 `curl` 获取课程网站的 HTML（`https://missing.csail.mit.edu/`），并将其通过 `grep` 输出以计算列出的讲座数量。（提示：查找每个讲座出现一次的模式；使用
    `curl -s` 来静音进度输出。）
- en: '[`jq`](https://jqlang.github.io/jq/) is a powerful tool for processing JSON
    data. Fetch the sample data at `https://microsoftedge.github.io/Demos/json-dummy-data/64KB.json`
    with `curl` and use `jq` to extract just the names of people whose version is
    greater than 6\. (Hint: pipe to `jq .` first to see the structure; then try `jq
    ''.[] | select(...) | .name''`)'
  id: totrans-115
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '[`jq`](https://jqlang.github.io/jq/) 是处理 JSON 数据的强大工具。使用 `curl` 从 `https://microsoftedge.github.io/Demos/json-dummy-data/64KB.json`
    获取示例数据，并使用 `jq` 提取版本号大于 6 的人的名字。（提示：首先通过 `jq .` 管道查看结构；然后尝试 `jq ''.[] | select(...)
    | .name''`）'
- en: '`awk` can filter lines based on column values and manipulate output. For example,
    `awk ''$3 ~ /pattern/ {$4=""; print}''` prints only lines where the third column
    matches `pattern`, while omitting the fourth column. Write an `awk` command that
    prints only lines where the second column is greater than 100, and swaps the first
    and third columns. Test with: `printf ''a 50 x\nb 150 y\nc 200 z\n''`'
  id: totrans-116
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`awk` 可以根据列值过滤行并操作输出。例如，`awk ''$3 ~ /pattern/ {$4=""; print}''` 只打印第三列匹配 `pattern`
    的行，同时省略第四列。编写一个 `awk` 命令，只打印第二列大于 100 的行，并交换第一列和第三列。测试用例：`printf ''a 50 x\nb 150
    y\nc 200 z\n''`'
- en: 'Dissect the SSH log pipeline from the lecture: what does each step do? Then
    build something similar to find your most-used shell commands from `~/.bash_history`
    (or `~/.zsh_history`).'
  id: totrans-117
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 从讲座中剖析 SSH 日志管道：每一步做什么？然后构建类似的东西，从 `~/.bash_history`（或 `~/.zsh_history`）中找出你使用最多的
    shell 命令。
