- en: There are tons of plugins for extending vim.
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 有许多插件可以扩展 vim。
- en: First, get set up with a plugin manager like [vim-plug](https://github.com/junegunn/vim-plug),
    [Vundle](https://github.com/VundleVim/Vundle.vim), or [pathogen.vim](https://github.com/tpope/vim-pathogen).
  id: totrans-142
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，使用插件管理器如 [vim-plug](https://github.com/junegunn/vim-plug)，[Vundle](https://github.com/VundleVim/Vundle.vim)，或
    [pathogen.vim](https://github.com/tpope/vim-pathogen) 进行设置。
