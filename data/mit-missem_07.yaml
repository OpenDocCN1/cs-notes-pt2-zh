  id: totrans-167
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[Vim Golf](https://www.vimgolf.com/)：各种 Vim 挑战'
- en: Exercises
  id: totrans-168
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: Experiment with some editors. Try at least one command-line editor (e.g. Vim)
    and at least one GUI editor (e.g. Atom). Learn through tutorials like `vimtutor`
    (or the equivalents for other editors). To get a real feel for a new editor, commit
    to using it exclusively for a couple days while going about your work.
  id: totrans-169
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 尝试一些编辑器。至少尝试一个命令行编辑器（例如 Vim）和至少一个图形用户界面编辑器（例如 Atom）。通过像 `vimtutor`（或其他编辑器的等效教程）这样的教程来学习。为了真正感受一个新的编辑器，承诺在几天内只使用它来完成你的工作。
- en: Customize your editor. Look through tips and tricks online, and look through
    other people’s configurations (often, they are well-documented).
  id: totrans-170
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 个性化你的编辑器。在网上查找技巧和窍门，并查看其他人的配置（通常，它们都有很好的文档）。
- en: Experiment with plugins for your editor.
  id: totrans-171
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 尝试为你的编辑器添加插件。
- en: 'Commit to using a powerful editor for at least a couple weeks: you should start
    seeing the benefits by then. At some point, you should be able to get your editor
    to work as fast as you think.'
  id: totrans-172
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 至少连续几周坚持使用一个强大的编辑器：那时你应该开始看到它的好处。在某个时候，你应该能够让你的编辑器工作得和你思考一样快。
- en: Install a linter (e.g. pyflakes for python) link it to your editor and test
    it is working.
  id: totrans-173
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 安装一个代码检查器（例如 python 的 pyflakes），将其链接到你的编辑器，并测试它是否工作。
