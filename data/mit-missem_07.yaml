  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[vim-fugitive](https://github.com/tpope/vim-fugitive): git 集成'
- en: '[vim-surround](https://github.com/tpope/vim-surround): manipulating “surroundings”'
  id: totrans-146
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[vim-surround](https://github.com/tpope/vim-surround): 操作 "surroundings”'
- en: '[gundo.vim](https://github.com/sjl/gundo.vim): navigate undo tree'
  id: totrans-147
  prefs:
