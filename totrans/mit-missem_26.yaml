- en: Debugging and Profiling
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://missing.csail.mit.edu/2020/debugging-profiling/](https://missing.csail.mit.edu/2020/debugging-profiling/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'A golden rule in programming is that code does not do what you expect it to
    do, but what you tell it to do. Bridging that gap can sometimes be a quite difficult
    feat. In this lecture we are going to cover useful techniques for dealing with
    buggy and resource hungry code: debugging and profiling.'
  prefs: []
  type: TYPE_NORMAL
- en: Debugging
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Printf debugging and Logging
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: “The most effective debugging tool is still careful thought, coupled with judiciously
    placed print statements” — Brian Kernighan, *Unix for Beginners*.
  prefs: []
  type: TYPE_NORMAL
- en: A first approach to debug a program is to add print statements around where
    you have detected the problem, and keep iterating until you have extracted enough
    information to understand what is responsible for the issue.
  prefs: []
  type: TYPE_NORMAL
- en: 'A second approach is to use logging in your program, instead of ad hoc print
    statements. Logging is better than regular print statements for several reasons:'
  prefs: []
  type: TYPE_NORMAL
- en: You can log to files, sockets or even remote servers instead of standard output.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Logging supports severity levels (such as INFO, DEBUG, WARN, ERROR, &c), that
    allow you to filter the output accordingly.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: For new issues, there’s a fair chance that your logs will contain enough information
    to detect what is going wrong.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Here](/static/files/logger.py) is an example code that logs messages:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: One of my favorite tips for making logs more readable is to color code them.
    By now you probably have realized that your terminal uses colors to make things
    more readable. But how does it do it? Programs like `ls` or `grep` are using [ANSI
    escape codes](https://en.wikipedia.org/wiki/ANSI_escape_code), which are special
    sequences of characters to indicate your shell to change the color of the output.
    For example, executing `echo -e "\e[38;2;255;0;0mThis is red\e[0m"` prints the
    message `This is red` in red on your terminal, as long as it supports [true color](https://github.com/termstandard/colors#truecolor-support-in-output-devices).
    If your terminal doesn’t support this (e.g. macOS’s Terminal.app), you can use
    the more universally supported escape codes for 16 color choices, for example
    `echo -e "\e[31;1mThis is red\e[0m"`.
  prefs: []
  type: TYPE_NORMAL
- en: The following script shows how to print many RGB colors into your terminal (again,
    as long as it supports true color).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: Third party logs
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: As you start building larger software systems you will most probably run into
    dependencies that run as separate programs. Web servers, databases or message
    brokers are common examples of this kind of dependencies. When interacting with
    these systems it is often necessary to read their logs, since client side error
    messages might not suffice.
  prefs: []
  type: TYPE_NORMAL
- en: Luckily, most programs write their own logs somewhere in your system. In UNIX
    systems, it is commonplace for programs to write their logs under `/var/log`.
    For instance, the [NGINX](https://www.nginx.com/) webserver places its logs under
    `/var/log/nginx`. More recently, systems have started using a **system log**,
    which is increasingly where all of your log messages go. Most (but not all) Linux
    systems use `systemd`, a system daemon that controls many things in your system
    such as which services are enabled and running. `systemd` places the logs under
    `/var/log/journal` in a specialized format and you can use the [`journalctl`](https://www.man7.org/linux/man-pages/man1/journalctl.1.html)
    command to display the messages. Similarly, on macOS there is still `/var/log/system.log`
    but an increasing number of tools use the system log, that can be displayed with
    [`log show`](https://www.manpagez.com/man/1/log/). On most UNIX systems you can
    also use the [`dmesg`](https://www.man7.org/linux/man-pages/man1/dmesg.1.html)
    command to access the kernel log.
  prefs: []
  type: TYPE_NORMAL
- en: For logging under the system logs you can use the [`logger`](https://www.man7.org/linux/man-pages/man1/logger.1.html)
    shell program. Here’s an example of using `logger` and how to check that the entry
    made it to the system logs. Moreover, most programming languages have bindings
    logging to the system log.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: As we saw in the data wrangling lecture, logs can be quite verbose and they
    require some level of processing and filtering to get the information you want.
    If you find yourself heavily filtering through `journalctl` and `log show` you
    can consider using their flags, which can perform a first pass of filtering of
    their output. There are also some tools like [`lnav`](https://lnav.org/), that
    provide an improved presentation and navigation for log files.
  prefs: []
  type: TYPE_NORMAL
- en: Debuggers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'When printf debugging is not enough you should use a debugger. Debuggers are
    programs that let you interact with the execution of a program, allowing the following:'
  prefs: []
  type: TYPE_NORMAL
- en: Halt execution of the program when it reaches a certain line.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Step through the program one instruction at a time.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Inspect values of variables after the program crashed.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Conditionally halt the execution when a given condition is met.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: And many more advanced features
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Many programming languages come with some form of debugger. In Python this is
    the Python Debugger [`pdb`](https://docs.python.org/3/library/pdb.html).
  prefs: []
  type: TYPE_NORMAL
- en: 'Here is a brief description of some of the commands `pdb` supports:'
  prefs: []
  type: TYPE_NORMAL
- en: '**l**(ist) - Displays 11 lines around the current line or continue the previous
    listing.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**s**(tep) - Execute the current line, stop at the first possible occasion.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**n**(ext) - Continue execution until the next line in the current function
    is reached or it returns.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**b**(reak) - Set a breakpoint (depending on the argument provided).'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**p**(rint) - Evaluate the expression in the current context and print its
    value. There’s also **pp** to display using [`pprint`](https://docs.python.org/3/library/pprint.html)
    instead.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**r**(eturn) - Continue execution until the current function returns.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**q**(uit) - Quit the debugger.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Let’s go through an example of using `pdb` to fix the following buggy python
    code. (See the lecture video).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: Note that since Python is an interpreted language we can use the `pdb` shell
    to execute commands and to execute instructions. [`ipdb`](https://pypi.org/project/ipdb/)
    is an improved `pdb` that uses the [`IPython`](https://ipython.org) REPL enabling
    tab completion, syntax highlighting, better tracebacks, and better introspection
    while retaining the same interface as the `pdb` module.
  prefs: []
  type: TYPE_NORMAL
- en: 'For more low level programming you will probably want to look into [`gdb`](https://www.gnu.org/software/gdb/)
    (and its quality of life modification [`pwndbg`](https://github.com/pwndbg/pwndbg))
    and [`lldb`](https://lldb.llvm.org/). They are optimized for C-like language debugging
    but will let you probe pretty much any process and get its current machine state:
    registers, stack, program counter, &c.'
  prefs: []
  type: TYPE_NORMAL
- en: Specialized Tools
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Even if what you are trying to debug is a black box binary there are tools that
    can help you with that. Whenever programs need to perform actions that only the
    kernel can, they use [System Calls](https://en.wikipedia.org/wiki/System_call).
    There are commands that let you trace the syscalls your program makes. In Linux
    there’s [`strace`](https://www.man7.org/linux/man-pages/man1/strace.1.html) and
    macOS and BSD have [`dtrace`](https://dtrace.org/about/). `dtrace` can be tricky
    to use because it uses its own `D` language, but there is a wrapper called [`dtruss`](https://www.manpagez.com/man/1/dtruss/)
    that provides an interface more similar to `strace` (more details [here](https://8thlight.com/blog/colin-jones/2015/11/06/dtrace-even-better-than-strace-for-osx.html)).
  prefs: []
  type: TYPE_NORMAL
- en: Below are some examples of using `strace` or `dtruss` to show [`stat`](https://www.man7.org/linux/man-pages/man2/stat.2.html)
    syscall traces for an execution of `ls`. For a deeper dive into `strace`, [this
    article](https://blogs.oracle.com/linux/strace-the-sysadmins-microscope-v2) and
    [this zine](https://jvns.ca/strace-zine-unfolded.pdf) are good reads.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: Under some circumstances, you may need to look at the network packets to figure
    out the issue in your program. Tools like [`tcpdump`](https://www.man7.org/linux/man-pages/man1/tcpdump.1.html)
    and [Wireshark](https://www.wireshark.org/) are network packet analyzers that
    let you read the contents of network packets and filter them based on different
    criteria.
  prefs: []
  type: TYPE_NORMAL
- en: 'For web development, the Chrome/Firefox developer tools are quite handy. They
    feature a large number of tools, including:'
  prefs: []
  type: TYPE_NORMAL
- en: Source code - Inspect the HTML/CSS/JS source code of any website.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Live HTML, CSS, JS modification - Change the website content, styles and behavior
    to test (you can see for yourself that website screenshots are not valid proofs).
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Javascript shell - Execute commands in the JS REPL.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Network - Analyze the requests timeline.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Storage - Look into the Cookies and local application storage.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Static Analysis
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: For some issues you do not need to run any code. For example, just by carefully
    looking at a piece of code you could realize that your loop variable is shadowing
    an already existing variable or function name; or that a program reads a variable
    before defining it. Here is where [static analysis](https://en.wikipedia.org/wiki/Static_program_analysis)
    tools come into play. Static analysis programs take source code as input and analyze
    it using coding rules to reason about its correctness.
  prefs: []
  type: TYPE_NORMAL
- en: In the following Python snippet there are several mistakes. First, our loop
    variable `foo` shadows the previous definition of the function `foo`. We also
    wrote `baz` instead of `bar` in the last line, so the program will crash after
    completing the `sleep` call (which will take one minute).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: Static analysis tools can identify these kinds of issues. When we run [`pyflakes`](https://pypi.org/project/pyflakes)
    on the code we get the errors related to both bugs. [`mypy`](https://mypy-lang.org/)
    is another tool that can detect type checking issues. Here, `mypy` will warn us
    that `bar` is initially an `int` and is then casted to a `float`. Again, note
    that all these issues were detected without having to run the code.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: In the shell tools lecture we covered [`shellcheck`](https://www.shellcheck.net/),
    which is a similar tool for shell scripts.
  prefs: []
  type: TYPE_NORMAL
- en: Most editors and IDEs support displaying the output of these tools within the
    editor itself, highlighting the locations of warnings and errors. This is often
    called **code linting** and it can also be used to display other types of issues
    such as stylistic violations or insecure constructs.
  prefs: []
  type: TYPE_NORMAL
- en: In vim, the plugins [`ale`](https://vimawesome.com/plugin/ale) or [`syntastic`](https://vimawesome.com/plugin/syntastic)
    will let you do that. For Python, [`pylint`](https://github.com/PyCQA/pylint)
    and [`pep8`](https://pypi.org/project/pep8/) are examples of stylistic linters
    and [`bandit`](https://pypi.org/project/bandit/) is a tool designed to find common
    security issues. For other languages people have compiled comprehensive lists
    of useful static analysis tools, such as [Awesome Static Analysis](https://github.com/mre/awesome-static-analysis)
    (you may want to take a look at the *Writing* section) and for linters there is
    [Awesome Linters](https://github.com/caramelomartins/awesome-linters).
  prefs: []
  type: TYPE_NORMAL
- en: A complementary tool to stylistic linting are code formatters such as [`black`](https://github.com/psf/black)
    for Python, `gofmt` for Go, `rustfmt` for Rust or [`prettier`](https://prettier.io/)
    for JavaScript, HTML and CSS. These tools autoformat your code so that it’s consistent
    with common stylistic patterns for the given programming language. Although you
    might be unwilling to give stylistic control about your code, standardizing code
    format will help other people read your code and will make you better at reading
    other people’s (stylistically standardized) code.
  prefs: []
  type: TYPE_NORMAL
- en: Profiling
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Even if your code functionally behaves as you would expect, that might not be
    good enough if it takes all your CPU or memory in the process. Algorithms classes
    often teach big *O* notation but not how to find hot spots in your programs. Since
    [premature optimization is the root of all evil](https://wiki.c2.com/?PrematureOptimization),
    you should learn about profilers and monitoring tools. They will help you understand
    which parts of your program are taking most of the time and/or resources so you
    can focus on optimizing those parts.
  prefs: []
  type: TYPE_NORMAL
- en: Timing
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Similarly to the debugging case, in many scenarios it can be enough to just
    print the time it took your code between two points. Here is an example in Python
    using the [`time`](https://docs.python.org/3/library/time.html) module.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: However, wall clock time can be misleading since your computer might be running
    other processes at the same time or waiting for events to happen. It is common
    for tools to make a distinction between *Real*, *User* and *Sys* time. In general,
    *User* + *Sys* tells you how much time your process actually spent in the CPU
    (more detailed explanation [here](https://stackoverflow.com/questions/556405/what-do-real-user-and-sys-mean-in-the-output-of-time1)).
  prefs: []
  type: TYPE_NORMAL
- en: '*Real* - Wall clock elapsed time from start to finish of the program, including
    the time taken by other processes and time taken while blocked (e.g. waiting for
    I/O or network)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*User* - Amount of time spent in the CPU running user code'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '*Sys* - Amount of time spent in the CPU running kernel code'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: For example, try running a command that performs an HTTP request and prefixing
    it with [`time`](https://www.man7.org/linux/man-pages/man1/time.1.html). Under
    a slow connection you might get an output like the one below. Here it took over
    2 seconds for the request to complete but the process only took 15ms of CPU user
    time and 12ms of kernel CPU time.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: Profilers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: CPU
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Most of the time when people refer to *profilers* they actually mean *CPU profilers*,
    which are the most common. There are two main types of CPU profilers: *tracing*
    and *sampling* profilers. Tracing profilers keep a record of every function call
    your program makes whereas sampling profilers probe your program periodically
    (commonly every millisecond) and record the program’s stack. They use these records
    to present aggregate statistics of what your program spent the most time doing.
    [Here](https://jvns.ca/blog/2017/12/17/how-do-ruby---python-profilers-work-) is
    a good intro article if you want more detail on this topic.'
  prefs: []
  type: TYPE_NORMAL
- en: Most programming languages have some sort of command line profiler that you
    can use to analyze your code. They often integrate with full fledged IDEs but
    for this lecture we are going to focus on the command line tools themselves.
  prefs: []
  type: TYPE_NORMAL
- en: 'In Python we can use the `cProfile` module to profile time per function call.
    Here is a simple example that implements a rudimentary grep in Python:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: We can profile this code using the following command. Analyzing the output we
    can see that IO is taking most of the time and that compiling the regex takes
    a fair amount of time as well. Since the regex only needs to be compiled once,
    we can factor it out of the for.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: A caveat of Python’s `cProfile` profiler (and many profilers for that matter)
    is that they display time per function call. That can become unintuitive really
    fast, especially if you are using third party libraries in your code since internal
    function calls are also accounted for. A more intuitive way of displaying profiling
    information is to include the time taken per line of code, which is what *line
    profilers* do.
  prefs: []
  type: TYPE_NORMAL
- en: 'For instance, the following piece of Python code performs a request to the
    class website and parses the response to get all URLs in the page:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: 'If we used Python’s `cProfile` profiler we’d get over 2500 lines of output,
    and even with sorting it’d be hard to understand where the time is being spent.
    A quick run with [`line_profiler`](https://github.com/pyutils/line_profiler) shows
    the time taken per line:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: Memory
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: In languages like C or C++ memory leaks can cause your program to never release
    memory that it doesn’t need anymore. To help in the process of memory debugging
    you can use tools like [Valgrind](https://valgrind.org/) that will help you identify
    memory leaks.
  prefs: []
  type: TYPE_NORMAL
- en: In garbage collected languages like Python it is still useful to use a memory
    profiler because as long as you have pointers to objects in memory they won’t
    be garbage collected. Here’s an example program and its associated output when
    running it with [memory-profiler](https://pypi.org/project/memory-profiler/) (note
    the decorator like in `line-profiler`).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: Event Profiling
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'As it was the case for `strace` for debugging, you might want to ignore the
    specifics of the code that you are running and treat it like a black box when
    profiling. The [`perf`](https://www.man7.org/linux/man-pages/man1/perf.1.html)
    command abstracts CPU differences away and does not report time or memory, but
    instead it reports system events related to your programs. For example, `perf`
    can easily report poor cache locality, high amounts of page faults or livelocks.
    Here is an overview of the command:'
  prefs: []
  type: TYPE_NORMAL
- en: '`perf list` - List the events that can be traced with perf'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`perf stat COMMAND ARG1 ARG2` - Gets counts of different events related to
    a process or command'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`perf record COMMAND ARG1 ARG2` - Records the run of a command and saves the
    statistical data into a file called `perf.data`'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`perf report` - Formats and prints the data collected in `perf.data`'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Visualization
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Profiler output for real world programs will contain large amounts of information
    because of the inherent complexity of software projects. Humans are visual creatures
    and are quite terrible at reading large amounts of numbers and making sense of
    them. Thus there are many tools for displaying profiler’s output in an easier
    to parse way.
  prefs: []
  type: TYPE_NORMAL
- en: One common way to display CPU profiling information for sampling profilers is
    to use a [Flame Graph](https://www.brendangregg.com/flamegraphs.html), which will
    display a hierarchy of function calls across the Y axis and time taken proportional
    to the X axis. They are also interactive, letting you zoom into specific parts
    of the program and get their stack traces (try clicking in the image below).
  prefs: []
  type: TYPE_NORMAL
- en: '[![FlameGraph](../Images/88a3605124bd211984699cbd067c86bc.png)](https://www.brendangregg.com/FlameGraphs/cpu-bash-flamegraph.svg)'
  prefs: []
  type: TYPE_NORMAL
- en: Call graphs or control flow graphs display the relationships between subroutines
    within a program by including functions as nodes and functions calls between them
    as directed edges. When coupled with profiling information such as the number
    of calls and time taken, call graphs can be quite useful for interpreting the
    flow of a program. In Python you can use the [`pycallgraph`](https://pycallgraph.readthedocs.io/)
    library to generate them.
  prefs: []
  type: TYPE_NORMAL
- en: '![Call Graph](../Images/13c09783e66dad0fe854381cc0a88165.png)'
  prefs: []
  type: TYPE_IMG
- en: Resource Monitoring
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Sometimes, the first step towards analyzing the performance of your program
    is to understand what its actual resource consumption is. Programs often run slowly
    when they are resource constrained, e.g. without enough memory or on a slow network
    connection. There are a myriad of command line tools for probing and displaying
    different system resources like CPU usage, memory usage, network, disk usage and
    so on.
  prefs: []
  type: TYPE_NORMAL
- en: '**General Monitoring** - Probably the most popular is [`htop`](https://htop.dev/),
    which is an improved version of [`top`](https://www.man7.org/linux/man-pages/man1/top.1.html).
    `htop` presents various statistics for the currently running processes on the
    system. `htop` has a myriad of options and keybinds, some useful ones are: `<F6>`
    to sort processes, `t` to show tree hierarchy and `h` to toggle threads. See also
    [`glances`](https://nicolargo.github.io/glances/) for similar implementation with
    a great UI. For getting aggregate measures across all processes, [`dool`](https://github.com/scottchiefbaker/dool)
    is another nifty tool that computes real-time resource metrics for lots of different
    subsystems like I/O, networking, CPU utilization, context switches, &c.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**I/O operations** - [`iotop`](https://www.man7.org/linux/man-pages/man8/iotop.8.html)
    displays live I/O usage information and is handy to check if a process is doing
    heavy I/O disk operations'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Disk Usage** - [`df`](https://www.man7.org/linux/man-pages/man1/df.1.html)
    displays metrics per partitions and [`du`](https://man7.org/linux/man-pages/man1/du.1.html)
    displays **d**isk **u**sage per file for the current directory. In these tools
    the `-h` flag tells the program to print with **h**uman readable format. A more
    interactive version of `du` is [`ncdu`](https://dev.yorhel.nl/ncdu) which lets
    you navigate folders and delete files and folders as you navigate.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Memory Usage** - [`free`](https://www.man7.org/linux/man-pages/man1/free.1.html)
    displays the total amount of free and used memory in the system. Memory is also
    displayed in tools like `htop`.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Open Files** - [`lsof`](https://www.man7.org/linux/man-pages/man8/lsof.8.html)
    lists file information about files opened by processes. It can be quite useful
    for checking which process has opened a specific file.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Network Connections and Config** - [`ss`](https://www.man7.org/linux/man-pages/man8/ss.8.html)
    lets you monitor incoming and outgoing network packets statistics as well as interface
    statistics. A common use case of `ss` is figuring out what process is using a
    given port in a machine. For displaying routing, network devices and interfaces
    you can use [`ip`](https://man7.org/linux/man-pages/man8/ip.8.html). Note that
    `netstat` and `ifconfig` have been deprecated in favor of the former tools respectively.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Network Usage** - [`nethogs`](https://github.com/raboof/nethogs) and [`iftop`](https://pdw.ex-parrot.com/iftop/)
    are good interactive CLI tools for monitoring network usage.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: If you want to test these tools you can also artificially impose loads on the
    machine using the [`stress`](https://linux.die.net/man/1/stress) command.
  prefs: []
  type: TYPE_NORMAL
- en: Specialized tools
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: Sometimes, black box benchmarking is all you need to determine what software
    to use. Tools like [`hyperfine`](https://github.com/sharkdp/hyperfine) let you
    quickly benchmark command line programs. For instance, in the shell tools and
    scripting lecture we recommended `fd` over `find`. We can use `hyperfine` to compare
    them in tasks we run often. E.g. in the example below `fd` was 20x faster than
    `find` in my machine.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: As it was the case for debugging, browsers also come with a fantastic set of
    tools for profiling webpage loading, letting you figure out where time is being
    spent (loading, rendering, scripting, &c). More info for [Firefox](https://profiler.firefox.com/docs/)
    and [Chrome](https://developers.google.com/web/tools/chrome-devtools/rendering-tools).
  prefs: []
  type: TYPE_NORMAL
- en: Exercises
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Debugging
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Use `journalctl` on Linux or `log show` on macOS to get the super user accesses
    and commands in the last day. If there aren’t any you can execute some harmless
    commands such as `sudo ls` and check again.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Do [this](https://github.com/spiside/pdb-tutorial) hands on `pdb` tutorial to
    familiarize yourself with the commands. For a more in depth tutorial read [this](https://realpython.com/python-debugging-pdb).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Install [`shellcheck`](https://www.shellcheck.net/) and try checking the following
    script. What is wrong with the code? Fix it. Install a linter plugin in your editor
    so you can get your warnings automatically.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs:
  - PREF_IND
  type: TYPE_PRE
- en: (Advanced) Read about [reversible debugging](https://undo.io/resources/reverse-debugging-whitepaper/)
    and get a simple example working using [`rr`](https://rr-project.org/) or [`RevPDB`](https://morepypy.blogspot.com/2016/07/reverse-debugging-for-python.html).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Profiling
  prefs:
  - PREF_IND
  - PREF_H2
  type: TYPE_NORMAL
- en: '[Here](/static/files/sorts.py) are some sorting algorithm implementations.
    Use [`cProfile`](https://docs.python.org/3/library/profile.html) and [`line_profiler`](https://github.com/pyutils/line_profiler)
    to compare the runtime of insertion sort and quicksort. What is the bottleneck
    of each algorithm? Use then `memory_profiler` to check the memory consumption,
    why is insertion sort better? Check now the inplace version of quicksort. Challenge:
    Use `perf` to look at the cycle counts and cache hits and misses of each algorithm.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Here’s some (arguably convoluted) Python code for computing Fibonacci numbers
    using a function for each number.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs:
  - PREF_IND
  type: TYPE_PRE
- en: 'Put the code into a file and make it executable. Install prerequisites: [`pycallgraph`](https://lewiscowles1986.github.io/py-call-graph/)
    and [`graphviz`](https://graphviz.org/). (If you can run `dot`, you already have
    GraphViz.) Run the code as is with `pycallgraph graphviz -- ./fib.py` and check
    the `pycallgraph.png` file. How many times is `fib0` called?. We can do better
    than that by memoizing the functions. Uncomment the commented lines and regenerate
    the images. How many times are we calling each `fibN` function now?'
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: A common issue is that a port you want to listen on is already taken by another
    process. Let’s learn how to discover that process pid. First execute `python -m
    http.server 4444` to start a minimal web server listening on port `4444`. On a
    separate terminal run `lsof | grep LISTEN` to print all listening processes and
    ports. Find that process pid and terminate it by running `kill <PID>`.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Limiting a process’s resources can be another handy tool in your toolbox. Try
    running `stress -c 3` and visualize the CPU consumption with `htop`. Now, execute
    `taskset --cpu-list 0,2 stress -c 3` and visualize it. Is `stress` taking three
    CPUs? Why not? Read [`man taskset`](https://www.man7.org/linux/man-pages/man1/taskset.1.html).
    Challenge: achieve the same using [`cgroups`](https://www.man7.org/linux/man-pages/man7/cgroups.7.html).
    Try limiting the memory consumption of `stress -m`.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '(Advanced) The command `curl ipinfo.io` performs a HTTP request and fetches
    information about your public IP. Open [Wireshark](https://www.wireshark.org/)
    and try to sniff the request and reply packets that `curl` sent and received.
    (Hint: Use the `http` filter to just watch HTTP packets).'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '* * *'
