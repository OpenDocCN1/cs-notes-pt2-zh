- en: Data Wrangling
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 数据整理
- en: 原文：[https://missing.csail.mit.edu/2019/data-wrangling/](https://missing.csail.mit.edu/2019/data-wrangling/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[https://missing.csail.mit.edu/2019/data-wrangling/](https://missing.csail.mit.edu/2019/data-wrangling/)'
- en: Have you ever had a bunch of text and wanted to do something with it? Good.
    That’s what data wrangling is all about! Specifically, adapting data from one
    format to another, until you end up with exactly what you wanted.
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 你有没有过一大堆文本，想要对它做些什么？很好。这就是数据整理的全部内容！具体来说，是将数据从一种格式转换为另一种格式，直到你得到你想要的确切内容。
- en: 'We’ve already seen basic data wrangling: `journalctl | grep -i intel`.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 我们已经看到了基本的数据整理：`journalctl | grep -i intel`。
- en: find all system log entries that mention Intel (case insensitive)
  id: totrans-4
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 查找所有提及Intel的系统日志条目（不区分大小写）
- en: really, most of data wrangling is about knowing what tools you have, and how
    to combine them.
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 真的，大部分数据整理都是关于知道你有什么工具，以及如何将它们组合起来。
- en: 'Let’s start from the beginning: we need a data source, and something to do
    with it. Logs often make for a good use-case, because you often want to investigate
    things about them, and reading the whole thing isn’t feasible. Let’s figure out
    who’s trying to log into my server by looking at my server’s log:'
  id: totrans-6
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们从一开始：我们需要一个数据源，以及与之相关的事情。日志通常是一个很好的用例，因为你经常想要调查它们，而阅读整个日志是不切实际的。让我们通过查看我的服务器日志来找出谁试图登录我的服务器：
- en: '[PRE0]'
  id: totrans-7
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'That’s far too much stuff. Let’s limit it to ssh stuff:'
  id: totrans-8
  prefs: []
  type: TYPE_NORMAL
  zh: 这已经太多了。让我们限制为ssh相关的内容：
- en: '[PRE1]'
  id: totrans-9
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'Notice that we’re using a pipe to stream a *remote* file through `grep` on
    our local computer! `ssh` is magical. This is still way more stuff than we wanted
    though. And pretty hard to read. Let’s do better:'
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，我们正在使用管道将*远程*文件通过本地计算机上的`grep`进行流式传输！`ssh`是神奇的。但这仍然比我们想要的要多得多。而且很难读。让我们做得更好：
- en: '[PRE2]'
  id: totrans-11
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'There’s still a lot of noise here. There are *a lot* of ways to get rid of
    that, but let’s look at one of the most powerful tools in your toolkit: `sed`.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: 这里仍然有很多噪音。有很多方法可以去除这些噪音，但让我们看看你的工具箱中最强大的工具之一：`sed`。
- en: '`sed` is a “stream editor” that builds on top of the old `ed` editor. In it,
    you basically give short commands for how to modify the file, rather than manipulate
    its contents directly (although you can do that too). There are tons of commands,
    but one of the most common ones is `s`: substitution. For example, we can write:'
  id: totrans-13
  prefs: []
  type: TYPE_NORMAL
  zh: '`sed`是一个“流编辑器”，它建立在旧的`ed`编辑器之上。在其中，你基本上给出修改文件的简短命令，而不是直接操作其内容（尽管你也可以这样做）。有大量的命令，但其中最常见的一个是`s`：替换。例如，我们可以写：'
- en: '[PRE3]'
  id: totrans-14
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'What we just wrote was a simple *regular expression*; a powerful construct
    that lets you match text against patterns. The `s` command is written on the form:
    `s/REGEX/SUBSTITUTION/`, where `REGEX` is the regular expression you want to search
    for, and `SUBSTITUTION` is the text you want to substitute matching text with.'
  id: totrans-15
  prefs: []
  type: TYPE_NORMAL
  zh: 我们刚才写的是一个简单的*正则表达式*；这是一个强大的结构，允许你将文本与模式进行匹配。`s`命令的格式如下：`s/REGEX/SUBSTITUTION/`，其中`REGEX`是你想要搜索的正则表达式，而`SUBSTITUTION`是你想要替换匹配文本的文本。
- en: Regular expressions
  id: totrans-16
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 正则表达式
- en: 'Regular expressions are common and useful enough that it’s worthwhile to take
    some time to understand how they work. Let’s start by looking at the one we used
    above: `/.*Disconnected from /`. Regular expressions are usually (though not always)
    surrounded by `/`. Most ASCII characters just carry their normal meaning, but
    some characters have “special” matching behavior. Exactly which characters do
    what vary somewhat between different implementations of regular expressions, which
    is a source of great frustration. Very common patterns are:'
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 正则表达式足够常见且有用，值得花时间了解它们是如何工作的。让我们先看看我们上面使用的：`/.*Disconnected from /`。正则表达式通常（尽管不总是）被`/`包围。大多数ASCII字符只是携带它们正常的意义，但一些字符有“特殊”的匹配行为。确切地说，哪些字符做什么在不同的正则表达式实现之间有所不同，这是令人非常沮丧的一个原因。非常常见的模式包括：
- en: '`.` means “any single character” except newline'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`.` 表示“任何单个字符”，除了换行符'
- en: '`*` zero or more of the preceding match'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`*` 前一个匹配的零个或多个'
- en: '`+` one or more of the preceding match'
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`+` 前一个匹配的一个或多个'
- en: '`[abc]` any one character of `a`, `b`, and `c`'
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`[abc]` `a`、`b`和`c`中的任意一个字符'
- en: '`(RX1|RX2)` either something that matches `RX1` or `RX2`'
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`(RX1|RX2)` 要么匹配`RX1`，要么匹配`RX2`'
- en: '`^` the start of the line'
  id: totrans-23
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`^` 行的开始'
- en: '`$` the end of the line'
  id: totrans-24
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`$` 行的结束'
- en: '`sed`’s regular expressions are somewhat weird, and will require you to put
    a `\` before most of these to give them their special meaning. Or you can pass
    `-E`.'
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: '`sed`的正则表达式有些奇怪，你需要在这些字符之前加上`\`来赋予它们特殊的意义。或者你可以传递`-E`。'
- en: 'So, looking back at `/.*Disconnected from /`, we see that it matches any text
    that starts with any number of characters, followed by the literal string “Disconnected
    from “. Which is what we wanted. But beware, regular expressions are tricky. What
    if someone tried to log in with the username “Disconnected from”? We’d have:'
  id: totrans-26
  prefs: []
  type: TYPE_NORMAL
  zh: 因此，回顾一下 `/.*Disconnected from /`，我们看到它匹配任何以任意数量的字符开头的文本，后面跟着字面字符串“Disconnected
    from “。这正是我们想要的。但请注意，正则表达式是有点棘手的。如果有人尝试使用用户名“Disconnected from”登录呢？我们会得到：
- en: '[PRE4]'
  id: totrans-27
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: What would we end up with? Well, `*` and `+` are, by default, “greedy”. They
    will match as much text as they can. So, in the above, we’d end up with just
  id: totrans-28
  prefs: []
  type: TYPE_NORMAL
  zh: 我们最终会得到什么呢？`*` 和 `+` 默认是“贪婪”的。它们会匹配尽可能多的文本。所以，在上面的例子中，我们只会得到
- en: '[PRE5]'
  id: totrans-29
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: 'Which may not be what we wanted. In some regular expression implementations,
    you can just suffix `*` or `+` with a `?` to make them non-greedy, but sadly `sed`
    doesn’t support that. We *could* switch to perl’s command-line mode though, which
    *does* support that construct:'
  id: totrans-30
  prefs: []
  type: TYPE_NORMAL
  zh: 这可能不是我们想要的。在一些正则表达式实现中，你可以在 `*` 或 `+` 后面加上 `?` 来使它们非贪婪，但遗憾的是 `sed` 不支持这一点。不过，我们可以切换到
    perl 的命令行模式，它*确实*支持这种结构：
- en: '[PRE6]'
  id: totrans-31
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: We’ll stick to `sed` for the rest of this though, because it’s by far the more
    common tool for these kinds of jobs. `sed` can also do other handy things like
    print lines following a given match, do multiple substitutions per invocation,
    search for things, etc. But we won’t cover that too much here. `sed` is basically
    an entire topic in and of itself, but there are often better tools.
  id: totrans-32
  prefs: []
  type: TYPE_NORMAL
  zh: 尽管如此，我们仍将坚持使用 `sed`，因为它是这些类型工作中最常见的工具。`sed` 还能做其他一些方便的事情，比如打印匹配给定字符串之后的行，每次调用进行多次替换，搜索内容等。但在这里我们不会过多涉及这些。`sed`
    本身就是一个完整的主题，但通常有更好的工具可用。
- en: 'Okay, so we also have a suffix we’d like to get rid of. How might we do that?
    It’s a little tricky to match just the text that follows the username, especially
    if the username can have spaces and such! What we need to do is match the *whole*
    line:'
  id: totrans-33
  prefs: []
  type: TYPE_NORMAL
  zh: 好吧，所以我们还想去除一个后缀。我们该如何做到这一点呢？匹配用户名之后的文本有点棘手，尤其是如果用户名可以有空白字符等！我们需要匹配的是*整行*：
- en: '[PRE7]'
  id: totrans-34
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: Let’s look at what’s going on with a [regex debugger](https://regex101.com/r/qqbZqh/2).
    Okay, so the start is still as before. Then, we’re matching any of the “user”
    variants (there are two prefixes in the logs). Then we’re matching on any string
    of characters where the username is. Then we’re matching on any single word (`[^
    ]+`; any non-empty sequence of non-space characters). Then the word “port” followed
    by a sequence of digits. Then possibly the suffix ` [preauth]`, and then the end
    of the line.
  id: totrans-35
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们看看 [regex debugger](https://regex101.com/r/qqbZqh/2) 中发生了什么。好的，所以开始部分和之前一样。然后，我们匹配任何“用户”变体（日志中有两个前缀）。然后我们匹配用户名所在字符串的任意字符序列。然后我们匹配一个单词（`[^
    ]+`；任何非空的非空格字符序列）。然后是单词“port”后面跟着一串数字。然后可能是后缀 ` [preauth]`，然后是行尾。
- en: Notice that with this technique, as username of “Disconnected from” won’t confuse
    us any more. Can you see why?
  id: totrans-36
  prefs: []
  type: TYPE_NORMAL
  zh: 注意，使用这种技术后，用户名“Disconnected from”将不再会让我们困惑。你能看出为什么吗？
- en: 'There is one problem with this though, and that is that the entire log becomes
    empty. We want to *keep* the username after all. For this, we can use “capture
    groups”. Any text matched by a regex surrounded by parentheses is stored in a
    numbered capture group. These are available in the substitution (and in some engines,
    even in the pattern itself!) as `\1`, `\2`, `\3`, etc. So:'
  id: totrans-37
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，这里有一个问题，那就是整个日志会变成空。我们毕竟还是想*保留*用户名。为此，我们可以使用“捕获组”。任何由正则表达式匹配并被括号包围的文本都会存储在一个编号的捕获组中。这些捕获组在替换（以及在某些引擎中，甚至在模式本身！）中可用，如
    `\1`、`\2`、`\3` 等。所以：
- en: '[PRE8]'
  id: totrans-38
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: As you can probably imagine, you can come up with *really* complicated regular
    expressions. For example, here’s an article on how you might match an [e-mail
    address](https://www.regular-expressions.info/email.html). It’s [not easy](https://web.archive.org/web/20221223174323/http://emailregex.com/).
    And there’s [lots of discussion](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression/1917982).
    And people have [written tests](https://fightingforalostcause.net/content/misc/2006/compare-email-regex.php).
    And [test matrices](https://mathiasbynens.be/demo/url-regex). You can even write
    a regex for determining if a given number [is a prime number](https://www.noulakaz.net/2007/03/18/a-regular-expression-to-check-for-prime-numbers/).
  id: totrans-39
  prefs: []
  type: TYPE_NORMAL
  zh: 如你所能想象，你可以想出**非常**复杂的正则表达式。例如，这里有一篇文章介绍了如何匹配一个 [电子邮件地址](https://www.regular-expressions.info/email.html)。这并不容易（[链接](https://web.archive.org/web/20221223174323/http://emailregex.com/)）。而且有很多[讨论](https://stackoverflow.com/questions/201323/how-to-validate-an-email-address-using-a-regular-expression/1917982)。人们还[编写了测试](https://fightingforalostcause.net/content/misc/2006/compare-email-regex.php)。还有[测试矩阵](https://mathiasbynens.be/demo/url-regex)。你甚至可以编写一个正则表达式来检测一个给定的数字[是否为质数](https://www.noulakaz.net/2007/03/18/a-regular-expression-to-check-for-prime-numbers/)。
- en: Regular expressions are notoriously hard to get right, but they are also very
    handy to have in your toolbox!
  id: totrans-40
  prefs: []
  type: TYPE_NORMAL
  zh: 正则表达式通常很难正确使用，但它们在你的工具箱中也非常有用！
- en: Back to data wrangling
  id: totrans-41
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 回到数据处理
- en: Okay, so we now have
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 好吧，所以我们现在有
- en: '[PRE9]'
  id: totrans-43
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: We could do it just with `sed`, but why would we? For fun is why.
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以用 `sed` 来做，但为什么要这么做呢？为了好玩。
- en: '[PRE10]'
  id: totrans-45
  prefs: []
  type: TYPE_PRE
  zh: '[PRE10]'
- en: This shows off some of `sed`’s capabilities. `sed` can also inject text (with
    the `i` command), explicitly print lines (with the `p` command), select lines
    by index, and lots of other things. Check `man sed`!
  id: totrans-46
  prefs: []
  type: TYPE_NORMAL
  zh: 这展示了 `sed` 的一些功能。`sed` 还可以插入文本（使用 `i` 命令），显式打印行（使用 `p` 命令），通过索引选择行，以及许多其他功能。查看
    `man sed`！
- en: 'Anyway. What we have now gives us a list of all the usernames that have attempted
    to log in. But this is pretty unhelpful. Let’s look for common ones:'
  id: totrans-47
  prefs: []
  type: TYPE_NORMAL
  zh: 无论如何。我们现在得到的是一个所有尝试登录的用户名的列表。但这没什么帮助。让我们寻找常见的：
- en: '[PRE11]'
  id: totrans-48
  prefs: []
  type: TYPE_PRE
  zh: '[PRE11]'
- en: '`sort` will, well, sort its input. `uniq -c` will collapse consecutive lines
    that are the same into a single line, prefixed with a count of the number of occurrences.
    We probably want to sort that too and only keep the most common logins:'
  id: totrans-49
  prefs: []
  type: TYPE_NORMAL
  zh: '`sort` 命令会，嗯，对它的输入进行排序。`uniq -c` 会将连续的相同行合并成一行，并在前面加上出现次数的计数。我们可能还想对它们进行排序，并只保留最常见的登录：'
- en: '[PRE12]'
  id: totrans-50
  prefs: []
  type: TYPE_PRE
  zh: '[PRE12]'
- en: '`sort -n` will sort in numeric (instead of lexicographic) order. `-k1,1` means
    “sort by only the first whitespace-separated column”. The `,n` part says “sort
    until the `n`th field, where the default is the end of the line. In this *particular*
    example, sorting by the whole line wouldn’t matter, but we’re here to learn!'
  id: totrans-51
  prefs: []
  type: TYPE_NORMAL
  zh: '`sort -n` 会按数字（而不是字典）顺序排序。`-k1,1` 表示“只按第一列排序，列由空格分隔”。`-n` 部分表示“排序直到第 `n` 个字段，默认是行尾。在这个**特定**的例子中，按整个行排序并不重要，但我们在这里是为了学习！'
- en: If we wanted the *least* common ones, we could use `head` instead of `tail`.
    There’s also `sort -r`, which sorts in reverse order.
  id: totrans-52
  prefs: []
  type: TYPE_NORMAL
  zh: 如果我们想找**最少**见的，我们可以用 `head` 而不是 `tail`。还有 `sort -r`，它会按逆序排序。
- en: Okay, so that’s pretty cool, but we’d sort of like to only give the usernames,
    and maybe not one per line?
  id: totrans-53
  prefs: []
  type: TYPE_NORMAL
  zh: 好吧，这很酷，但我们可能只想提供用户名，也许不是每行一个？
- en: '[PRE13]'
  id: totrans-54
  prefs: []
  type: TYPE_PRE
  zh: '[PRE13]'
- en: 'Let’s start with `paste`: it lets you combine lines (`-s`) by a given single-character
    delimiter (`-d`). But what’s this `awk` business?'
  id: totrans-55
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们从 `paste` 命令开始：它允许你通过一个给定的单字符分隔符（`-d`）来组合行（`-s`）。但这个 `awk` 是什么意思呢？
- en: awk – another editor
  id: totrans-56
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: awk – 另一个编辑器
- en: '`awk` is a programming language that just happens to be really good at processing
    text streams. There is *a lot* to say about `awk` if you were to learn it properly,
    but as with many other things here, we’ll just go through the basics.'
  id: totrans-57
  prefs: []
  type: TYPE_NORMAL
  zh: '`awk` 是一种编程语言，它恰好擅长处理文本流。如果你要正确学习 `awk`，有很多东西可以说，但就像这里的其他许多事情一样，我们只会介绍基础知识。'
- en: First, what does `{print $2}` do? Well, `awk` programs take the form of an optional
    pattern plus a block saying what to do if the pattern matches a given line. The
    default pattern (which we used above) matches all lines. Inside the block, `$0`
    is set to the entire line’s contents, and `$1` through `$n` are set to the `n`th
    *field* of that line, when separated by the `awk` field separator (whitespace
    by default, change with `-F`). In this case, we’re saying that, for every line,
    print the contents of the second field, which happens to be the username!
  id: totrans-58
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，`{print $2}` 做了什么？嗯，`awk` 程序的形式是一个可选的模式加上一个块，该块说明了如果模式与给定的行匹配，应该做什么。默认模式（我们上面使用的）匹配所有行。在块内部，`$0`
    被设置为整行的内容，而 `$1` 到 `$n` 被设置为该行的第 `n` 个*字段*，当使用 `awk` 字段分隔符（默认为空白字符）分隔时。在这种情况下，我们说的是对于每一行，打印第二个字段的内容，碰巧这是用户名！
- en: 'Let’s see if we can do something fancier. Let’s compute the number of single-use
    usernames that start with `c` and end with `e`:'
  id: totrans-59
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们看看我们能否做一些更复杂的事情。让我们计算以 `c` 开头并以 `e` 结尾的单次使用用户名的数量：
- en: '[PRE14]'
  id: totrans-60
  prefs: []
  type: TYPE_PRE
  zh: '[PRE14]'
- en: There’s a lot to unpack here. First, notice that we now have a pattern (the
    stuff that goes before `{...}`). The pattern says that the first field of the
    line should be equal to 1 (that’s the count from `uniq -c`), and that the second
    field should match the given regular expression. And the block just says to print
    the username. We then count the number of lines in the output with `wc -l`.
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 这里有很多东西要解释。首先，注意我们现在有一个模式（`{...}` 之前的东西）。模式说明行的第一个字段应该等于 1（这是 `uniq -c` 的计数），第二个字段应该匹配给定的正则表达式。而块只是说打印用户名。然后我们使用
    `wc -l` 计算输出中的行数。
- en: However, `awk` is a programming language, remember?
  id: totrans-62
  prefs: []
  type: TYPE_NORMAL
  zh: 然而，`awk` 是一种编程语言，记得吗？
- en: '[PRE15]'
  id: totrans-63
  prefs: []
  type: TYPE_PRE
  zh: '[PRE15]'
- en: '`BEGIN` is a pattern that matches the start of the input (and `END` matches
    the end). Now, the per-line block just adds the count from the first field (although
    it’ll always be 1 in this case), and then we print it out at the end. In fact,
    we *could* get rid of `grep` and `sed` entirely, because `awk` [can do it all](https://web.archive.org/web/20251210045942/https://backreference.org/2010/02/10/idiomatic-awk/),
    but we’ll leave that as an exercise to the reader.'
  id: totrans-64
  prefs: []
  type: TYPE_NORMAL
  zh: '`BEGIN` 是一个匹配输入开始的模式（而 `END` 匹配结束）。现在，按行块只是将第一个字段（在这个例子中始终是 1）的计数添加进去，然后在结束时打印出来。实际上，我们可以完全去掉
    `grep` 和 `sed`，因为 `awk` [可以完成所有这些](https://web.archive.org/web/20251210045942/https://backreference.org/2010/02/10/idiomatic-awk/)，但我们将其留作读者的练习。'
- en: Analyzing data
  id: totrans-65
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 数据分析
- en: You can do math!
  id: totrans-66
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以做数学！
- en: '[PRE16]'
  id: totrans-67
  prefs: []
  type: TYPE_PRE
  zh: '[PRE16]'
- en: '[PRE17]'
  id: totrans-68
  prefs: []
  type: TYPE_PRE
  zh: '[PRE17]'
- en: 'You can get stats in a variety of ways. [`st`](https://github.com/nferraz/st)
    is pretty neat, but if you already have R:'
  id: totrans-69
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以通过各种方式获取统计数据。[`st`](https://github.com/nferraz/st) 非常不错，但如果你已经有了 R：
- en: '[PRE18]'
  id: totrans-70
  prefs: []
  type: TYPE_PRE
  zh: '[PRE18]'
- en: R is another (weird) programming language that’s great at data analysis and
    [plotting](https://ggplot2.tidyverse.org/). We won’t go into too much detail,
    but suffice to say that `summary` prints summary statistics about a matrix, and
    we computed a matrix from the input stream of numbers, so R gives us the statistics
    we wanted!
  id: totrans-71
  prefs: []
  type: TYPE_NORMAL
  zh: R 是另一种（奇怪）的编程语言，擅长数据分析以及[绘图](https://ggplot2.tidyverse.org/)。我们不会过多深入细节，但可以说
    `summary` 会打印出矩阵的摘要统计信息，而我们是从数字输入流中计算出一个矩阵，所以 R 给出了我们想要的统计信息！
- en: 'If you just want some simple plotting, `gnuplot` is your friend:'
  id: totrans-72
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你只想做一些简单的绘图，`gnuplot` 是你的朋友：
- en: '[PRE19]'
  id: totrans-73
  prefs: []
  type: TYPE_PRE
  zh: '[PRE19]'
- en: Data wrangling to make arguments
  id: totrans-74
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 数据整理以形成论点
- en: 'Sometimes you want to do data wrangling to find things to install or remove
    based on some longer list. The data wrangling we’ve talked about so far + `xargs`
    can be a powerful combo:'
  id: totrans-75
  prefs: []
  type: TYPE_NORMAL
  zh: 有时候你想进行数据整理，以根据更长的列表找到要安装或删除的内容。我们之前讨论的数据整理加上 `xargs` 可以是一个强大的组合：
- en: '[PRE20]'
  id: totrans-76
  prefs: []
  type: TYPE_PRE
  zh: '[PRE20]'
- en: Exercises
  id: totrans-77
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: If you are not familiar with Regular Expressions [here](https://regexone.com/)
    is a short interactive tutorial that covers most of the basics
  id: totrans-78
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果你不太熟悉正则表达式，[这里](https://regexone.com/)有一个简短的交互式教程，涵盖了大多数基础知识。
- en: How is `sed s/REGEX/SUBSTITUTION/g` different from the regular sed? What about
    `/I` or `/m`?
  id: totrans-79
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: '`sed s/REGEX/SUBSTITUTION/g` 与常规的 `sed` 有什么不同？关于 `/I` 或 `/m` 又如何？'
- en: To do in-place substitution it is quite tempting to do something like `sed s/REGEX/SUBSTITUTION/
    input.txt > input.txt`. However this is a bad idea, why? Is this particular to
    `sed`?
  id: totrans-80
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 要进行原地替换，可能会很诱人地做类似 `sed s/REGEX/SUBSTITUTION/ input.txt > input.txt` 的事情。然而，这是一个坏主意，为什么？这是
    `sed` 特有的吗？
- en: Implement a simple grep equivalent tool in a language you are familiar with
    using regex. If you want the output to be color highlighted like grep is, search
    for ANSI color escape sequences.
  id: totrans-81
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用你熟悉的语言通过正则表达式实现一个简单的 grep 等效工具。如果你想输出像 grep 那样带有颜色高亮，搜索 ANSI 颜色转义序列。
- en: Sometimes some operations like renaming files can be tricky with raw commands
    like `mv` . `rename` is a nifty tool to achieve this and has a sed-like syntax.
    Try creating a bunch of files with spaces in their names and use `rename` to replace
    them with underscores.
  id: totrans-82
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 有时候，像重命名文件这样的操作使用原始命令如`mv`可能会很棘手。`rename`是一个很棒的工具，可以完成这项任务，并且具有类似`sed`的语法。尝试创建一些名字中包含空格的文件，并使用`rename`将它们替换为下划线。
- en: Look for boot messages that are *not* shared between your past three reboots
    (see `journalctl`’s `-b` flag). You may want to just mash all the boot logs together
    in a single file, as that may make things easier.
  id: totrans-83
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 寻找在过去三次重启之间不共享的启动消息（参见`journalctl`的`-b`标志）。你可能只想将所有启动日志合并到一个文件中，这样可能会更容易。
- en: Produce some statistics of your system boot time over the last ten boots using
    the log timestamp of the messages
  id: totrans-84
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用消息的日志时间戳统计系统过去十次启动时间的统计数据
- en: '[PRE21]'
  id: totrans-85
  prefs:
  - PREF_IND
  type: TYPE_PRE
  zh: '[PRE21]'
- en: and
  id: totrans-86
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
  zh: 和
- en: '[PRE22]'
  id: totrans-87
  prefs:
  - PREF_IND
  type: TYPE_PRE
  zh: '[PRE22]'
- en: 'Find the number of words (in `/usr/share/dict/words`) that contain at least
    three `a`s and don’t have a `''s` ending. What are the three most common last
    two letters of those words? `sed`’s `y` command, or the `tr` program, may help
    you with case insensitivity. How many of those two-letter combinations are there?
    And for a challenge: which combinations do not occur?'
  id: totrans-88
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 找出包含至少三个`a`且不以`'s`结尾的单词（在`/usr/share/dict/words`中）。这些单词中最常见的最后两个字母是什么？`sed`的`y`命令或`tr`程序可能有助于处理不区分大小写的情况。有多少这样的双字母组合？挑战一下：哪些组合没有出现？
- en: Find an online data set like [this one](https://commons.wikimedia.org/wiki/Data:Wikipedia_statistics/data.tab)
    or [this one](https://ucr.fbi.gov/crime-in-the-u.s/2016/crime-in-the-u.s.-2016/topic-pages/tables/table-1).
    Maybe another one [from here](https://www.springboard.com/blog/data-science/free-public-data-sets-data-science-project/).
    Fetch it using `curl` and extract out just two columns of numerical data. If you’re
    fetching HTML data, [`pup`](https://github.com/EricChiang/pup) might be helpful.
    For JSON data, try [`jq`](https://stedolan.github.io/jq/). Find the min and max
    of one column in a single command, and the sum of the difference between the two
    columns in another.
  id: totrans-89
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 找一个在线数据集，比如[这个](https://commons.wikimedia.org/wiki/Data:Wikipedia_statistics/data.tab)或者[这个](https://ucr.fbi.gov/crime-in-the-u.s/2016/crime-in-the-u.s.-2016/topic-pages/tables/table-1)。也许还有[这里](https://www.springboard.com/blog/data-science/free-public-data-sets-data-science-project/)的另一个。使用`curl`获取它，并提取出仅包含两列数值数据。如果你在获取HTML数据，`pup`（https://github.com/EricChiang/pup）可能会有帮助。对于JSON数据，尝试使用`jq`（https://stedolan.github.io/jq/）。使用单个命令找到一列的最小值和最大值，以及两列之间差异的总和。
