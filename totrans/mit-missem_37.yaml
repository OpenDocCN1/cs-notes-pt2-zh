- en: Packaging and Shipping Code
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://missing.csail.mit.edu/2026/shipping-code/](https://missing.csail.mit.edu/2026/shipping-code/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Getting code to work as intended is hard; getting that same code to run on a
    machine different from your own is often harder.
  prefs: []
  type: TYPE_NORMAL
- en: 'Shipping code means taking the code you wrote and converting it into a usable
    form that someone else can run without your computer’s exact setup. Shipping code
    takes many forms and depends on the choices of programming language, system libraries,
    and operating system, among many other factors. It also depends on what you are
    building: a software library, a command line tool, and a web service all have
    different requirements and deployment steps. Regardless, there is a common pattern
    between all these scenarios: we need to define what the deliverable is — a.k.a.
    the *artifact* — and what assumptions it makes about the environment around it.'
  prefs: []
  type: TYPE_NORMAL
- en: 'In this lecture, we’ll cover:'
  prefs: []
  type: TYPE_NORMAL
- en: '[Dependencies & Environments](#dependencies--environments)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Artifacts & Packaging](#artifacts--packaging)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Releases & Versioning](#releases--versioning)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Reproducibility](#reproducibility)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[VMs & Containers](#vms--containers)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Configuration](#configuration)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Services & Orchestration](#services--orchestration)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[Publishing](#publishing)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: We’ll explain these concepts through examples from the Python ecosystem, as
    concrete examples are helpful for understanding. While the tools are different
    for other programming language ecosystems, the concepts will largely be the same.
  prefs: []
  type: TYPE_NORMAL
- en: Dependencies & Environments
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 'In modern software development, layers of abstraction are ubiquitous. Programs
    naturally offload logic to other libraries or services. However, this introduces
    a *dependency* relationship between your program and the libraries it requires
    to function. For instance, in Python, to fetch the content of a website we often
    do:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'Yet the `requests` library does not come bundled with the Python runtime, so
    if we try to run this code without having `requests` installed, Python will raise
    an error:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: 'To make this library available we need to first run `pip install requests`
    to install it. `pip` is the command line tool that the Python programming language
    provides for installing packages. Executing `pip install requests` produces the
    following sequence of actions:'
  prefs: []
  type: TYPE_NORMAL
- en: Search for requests in the Python Package Index ([PyPI](https://pypi.org/))
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Search for the appropriate artifact for the platform we are running under
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Resolve dependencies — the `requests` library itself depends on other packages,
    so the installer must find compatible versions of all transitive dependencies
    and install them beforehand
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Download the artifacts, then unpack and copy the files into the right places
    in our filesystem
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: Here we can see that `requests` has its own dependencies such as `certifi` or
    `charset-normalizer` and that they have to be installed before `requests` can
    be installed. Once installed, the Python runtime can find this library when importing
    it.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: Programming languages have different tools, conventions and practices for installing
    and publishing libraries. In some languages like Rust, the toolchain is unified
    — `cargo` handles building, testing, dependency management, and publishing. In
    others like Python, the unification happens at a specification level — rather
    than a single tool, there are standardized specifications that define how packaging
    works, allowing multiple competing tools for each task (`pip` vs [`uv`](https://docs.astral.sh/uv/),
    `setuptools` vs [`hatch`](https://hatch.pypa.io/) vs [`poetry`](https://python-poetry.org/)).
    And in some ecosystems like LaTeX, distributions like TeX Live or MacTeX come
    bundled with thousands of packages pre-installed.
  prefs: []
  type: TYPE_NORMAL
- en: Introducing dependencies also introduces dependency conflicts. Conflicts happen
    when programs require incompatible versions of the same dependency. For example,
    if `tensorflow==2.3.0` requires `numpy>=1.16.0,<1.19.0` and `pandas==1.2.0` requires
    `numpy>=1.16.5`, then any version satisfying `numpy>=1.16.5,<1.19.0` will be valid.
    But if another package in your project requires `numpy>=1.19`, you have a conflict
    with no valid version that satisfies all constraints.
  prefs: []
  type: TYPE_NORMAL
- en: 'This situation — where multiple packages require mutually incompatible versions
    of shared dependencies — is commonly referred to as *dependency hell*. One way
    to deal with conflicts is to isolate the dependencies of each program into their
    own *environment*. In Python we create a virtual environment by running:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: You can think of an environment as an entire standalone version of the language
    runtime with its own set of installed packages. This virtual environment or venv
    isolates the installed dependencies from the global Python installation. It is
    a good practice to have a virtual environment for each project, containing the
    dependencies it requires.
  prefs: []
  type: TYPE_NORMAL
- en: While many modern operating systems ship with installations of programming language
    runtimes like Python, it is unwise to modify these installations since the OS
    might rely on them for its own functionality. Prefer using separate environments
    instead.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: In some languages, the installation protocol is not defined by a tool but as
    a specification. In Python [PEP 517](https://peps.python.org/pep-0517/) defines
    the build system interface and [PEP 621](https://peps.python.org/pep-0621/) specifies
    how project metadata is stored in `pyproject.toml`. This has enabled developers
    to improve upon `pip` and produce more optimized tools like `uv`. To install `uv`
    it suffices to do `pip install uv`.
  prefs: []
  type: TYPE_NORMAL
- en: 'Using `uv` instead of `pip` follows the same interface but is significantly
    faster:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: We strongly recommend using `uv pip` instead of `pip` whenever possible as it
    dramatically reduces the installation time.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Beyond dependency isolation, environments also allow you to have different versions
    of your programming language runtime.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: This helps when you need to test your code across multiple Python versions or
    when a project requires a specific version.
  prefs: []
  type: TYPE_NORMAL
- en: In some programming languages, each project automatically gets its own environment
    for its dependencies rather than you creating it manually, but the principle is
    the same. Most languages these days also have a mechanism for managing multiple
    versions of the language on a single system, and then specifying which version
    to use for individual projects.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Artifacts & Packaging
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 'In software development we differentiate between source code and artifacts.
    Developers write and read source code, while artifacts are the packaged, distributable
    outputs produced from that source code — ready to be installed or deployed. An
    artifact can be as simple as a file of code that we run, and as complex as an
    entire Virtual Machine that contains all the necessary bits and bobs of an application.
    Consider this example where we have a Python file `greet.py` in our current directory:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: The import fails once we move to a different directory because Python only searches
    for modules in specific locations (the current directory, installed packages,
    and paths in `PYTHONPATH`). Packaging solves this by installing the code into
    a known location.
  prefs: []
  type: TYPE_NORMAL
- en: 'In Python, packaging a library involves producing an artifact that package
    installers like `pip` or `uv` can use to install the relevant files. Python artifacts
    are called *wheels* and contain all the necessary information to install a package:
    the code files, metadata about the package (name, version, dependencies), and
    instructions for where to place files in the environment. Building an artifact
    requires that we write a project file (also often known as manifest) detailing
    the specifics of the project, the required dependencies, the version of the package,
    and other information. In Python, we use `pyproject.toml` for this purpose.'
  prefs: []
  type: TYPE_NORMAL
- en: '`pyproject.toml` is the modern and recommended way. While earlier packaging
    methods like `requirements.txt` or `setup.py` are still supported, you should
    prefer `pyproject.toml` whenever possible.'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'Here’s a minimal `pyproject.toml` for a library that also provides a command-line
    tool:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: The `typer` library is a popular Python package for creating command-line interfaces
    with minimal boilerplate.
  prefs: []
  type: TYPE_NORMAL
- en: 'And the corresponding `greeting.py`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: 'With this file, we can now build the wheel:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: The `.whl` file is the wheel (a zip archive with a specific structure), and
    the `.tar.gz` is a source distribution for systems that need to build from source.
  prefs: []
  type: TYPE_NORMAL
- en: 'You can inspect the contents of a wheel to see what gets packaged:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: 'Now if we were to give this wheel to someone else, they could install it by
    running:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: This would install the library we built earlier into their environment, including
    the `greet` cli tool.
  prefs: []
  type: TYPE_NORMAL
- en: There are limitations to this approach. In particular if our library depends
    on platform-specific libraries, e.g. CUDA for GPU acceleration, then our artifact
    only works on systems with those specific libraries installed, and we may need
    to build separate wheels for different platforms (Linux, macOS, Windows) and architectures
    (x86, ARM).
  prefs: []
  type: TYPE_NORMAL
- en: When installing software, there’s an important distinction between installing
    from source and installing a prebuilt binary. Installing from source means downloading
    the original code and compiling it on your machine — this requires having a compiler
    and build tools installed, and can take significant time for large projects.
  prefs: []
  type: TYPE_NORMAL
- en: Installing a prebuilt binary means downloading an artifact that was already
    compiled by someone else — faster and simpler, but the binary must match your
    platform and architecture. For example, [ripgrep’s releases page](https://github.com/BurntSushi/ripgrep/releases)
    shows prebuilt binaries for Linux (x86_64, ARM), macOS (Intel, Apple Silicon),
    and Windows.
  prefs: []
  type: TYPE_NORMAL
- en: Releases & Versioning
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Code is built in a continuous process but is released on a discrete basis. In
    software development there is a clear distinction between development and production
    environments. Code needs to be proven to work in a dev environment before getting
    *shipped* to prod. The release process involves many steps, including testing,
    dependency management, versioning, configuration, deployment and publishing.
  prefs: []
  type: TYPE_NORMAL
- en: Software libraries are not static and evolve over time getting fixes and new
    features. We track this evolution by discrete version identifiers that correspond
    to the state of the library at a certain point in time. Changes in the behavior
    of a library can range from patches that fix noncritical functionality, new features
    that extend its functionality, to changes breaking backwards compatibility. Changelogs
    document what changes a version introduces — these are documents that software
    developers use to communicate the changes associated with a new release.
  prefs: []
  type: TYPE_NORMAL
- en: However, keeping track of the ongoing changes in each and every dependency is
    impractical, even more so when we consider the transitive dependencies — i.e.
    the dependencies of our dependencies.
  prefs: []
  type: TYPE_NORMAL
- en: You can visualize the entire dependency tree of your project with `uv tree`,
    which shows all packages and their transitive dependencies in a tree format.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'To simplify this problem there are conventions on how to version software,
    and one of the most prevalent is [Semantic Versioning](https://semver.org/) or
    SemVer. Under Semantic Versioning a version has an identifier of the form MAJOR.MINOR.PATCH
    where each one of the values takes an integer value. The short version is that
    upgrading:'
  prefs: []
  type: TYPE_NORMAL
- en: PATCH (e.g., 1.2.3 → 1.2.4) should only contain bug fixes and be fully backwards
    compatible
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: MINOR (e.g., 1.2.3 → 1.3.0) adds new functionality in a backwards-compatible
    way
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: MAJOR (e.g., 1.2.3 → 2.0.0) indicates breaking changes that may require code
    modifications
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'This is a simplification and we encourage reading the full SemVer specification
    to understand for instance why going from 0.1.3 to 0.2.0 might cause breaking
    changes or what 1.0.0-rc.1 means. Python packaging supports semantic versioning
    natively, so when we specify the versions of our dependencies we can use various
    specifiers:'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'In the `pyproject.toml` we have different ways of constraining the ranges of
    compatible versions of our dependencies:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: Version specifiers exist across many package managers (npm, cargo, etc.) with
    varying exact semantics. The `~=` operator is Python’s “compatible release” operator
    — `~=2.1.0` means “any version that is compatible with 2.1.0”, which translates
    to `>=2.1.0` and `<2.2.0`. This is roughly equivalent to the caret (`^`) operator
    in npm and cargo, which follows SemVer’s notion of compatibility.
  prefs: []
  type: TYPE_NORMAL
- en: Not all software uses semantic versioning. A common alternative is Calendar
    Versioning (CalVer), where versions are based on release dates rather than semantic
    meaning. For example, Ubuntu uses versions like `24.04` (April 2024) and `24.10`
    (October 2024). CalVer makes it easy to see how old a release is, though it doesn’t
    communicate anything about compatibility. Lastly, semantic versioning is not infallible,
    and sometimes maintainers inadvertently introduce breaking changes in minor or
    patch releases.
  prefs: []
  type: TYPE_NORMAL
- en: Reproducibility
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: In modern software development the code you write sits atop a significant number
    of layers of abstraction. This includes things like your programming language
    runtime, third party libraries, the operating system, or even the hardware itself.
    Any difference across any of these layers might change the behavior of your code
    or even prevent it from working as intended. Furthermore, even differences in
    the underlying hardware impact your ability to ship software.
  prefs: []
  type: TYPE_NORMAL
- en: Pinning a library refers to specifying an exact version rather than a range,
    e.g. `requests==2.32.3` instead of `requests>=2.0`.
  prefs: []
  type: TYPE_NORMAL
- en: Part of the job of a package manager is to consider all the constraints provided
    by the dependencies — and transitive dependencies — and then produce a valid list
    of versions that will satisfy all the constraints. The specific list of versions
    can then be saved to a file for reproducibility purposes; these files are referred
    to as *lock files*.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs: []
  type: TYPE_PRE
- en: One critical distinction when dealing with dependency versioning and reproducibility
    is the difference between libraries and applications/services. A library is intended
    to be imported and used by other code which might have its own dependencies, so
    specifying overly strict version constraints can cause conflicts with the user’s
    other dependencies. In contrast, applications or services are final consumers
    of the software and typically expose their functionality through a user interface
    or an API, not through a programming interface. For libraries, it is good practice
    to specify version ranges to maximize compatibility with the wider package ecosystem.
    For applications, pinning exact versions ensures reproducibility — everyone running
    the application uses the exact same dependencies.
  prefs: []
  type: TYPE_NORMAL
- en: For projects requiring maximum reproducibility, tools like [Nix](https://nixos.org/)
    and [Bazel](https://bazel.build/) provide *hermetic* builds — where every input
    including compilers, system libraries, and even the build environment itself is
    pinned and content-addressed. This guarantees bit-for-bit identical outputs regardless
    of when or where the build runs.
  prefs: []
  type: TYPE_NORMAL
- en: You can even use NixOS to manage your entire computer install so that you can
    trivially spin up new copies of your computer setup and manage their complete
    configuration through version-controlled configuration files.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: A neverending tension in software development is that new software versions
    introduce breakage either intentionally or unintentionally, while on the other
    hand, old software versions become compromised with security vulnerabilities over
    time. We can address this by using continuous integration pipelines (we’ll see
    more in the [Code Quality and CI](/2026/code-quality/) lecture) that test our
    application against new software versions and having automation in place for detecting
    when new versions of our dependencies are released, such as [Dependabot](https://github.com/dependabot).
  prefs: []
  type: TYPE_NORMAL
- en: Even with CI testing in place, issues still occur when upgrading software versions,
    often because of the inevitable mismatch between dev and prod environments. In
    those circumstances the best course of action is to have a *rollback* plan, where
    the version upgrade is reverted and a known good version is redeployed instead.
  prefs: []
  type: TYPE_NORMAL
- en: VMs & Containers
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: As you start relying on more complex dependencies, it is likely that the dependencies
    of your code will span beyond the boundaries of what the package manager can handle.
    One common reason is having to interface with specific system libraries or hardware
    drivers. For example, in scientific computing and AI, programs often need specialized
    libraries and drivers to utilize GPU hardware. Many system-level dependencies
    (GPU drivers, specific compiler versions, shared libraries like OpenSSL) still
    require system-wide installation.
  prefs: []
  type: TYPE_NORMAL
- en: Traditionally this wider dependency problem was solved with Virtual Machines
    (VMs). VMs abstract the entire computer and provide a completely isolated environment
    with its own dedicated operating system. A more modern approach is containers,
    which package an application along with its dependencies, libraries, and filesystem,
    but share the host’s operating system kernel rather than virtualizing an entire
    computer. Containers are lighter weight than VMs because they share the kernel,
    making them faster to start and more efficient to run.
  prefs: []
  type: TYPE_NORMAL
- en: The most popular container platform is [Docker](https://www.docker.com/). Docker
    introduced a standardized way to build, distribute, and run containers. Under
    the hood, Docker uses containerd as its container runtime — an industry standard
    that other tools like Kubernetes also use.
  prefs: []
  type: TYPE_NORMAL
- en: Running a container is straightforward. For example, to run a Python interpreter
    inside a container we use `docker run` (The `-it` flags make the container interactive
    with a terminal. When you exit, the container stops.).
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs: []
  type: TYPE_PRE
- en: 'In practice your program might depend on the entire filesystem. To overcome
    this, we can use container images that ship the entire filesystem of the application
    as the artifact. The container images are created programmatically. With docker
    we specify exactly the dependencies, system libraries, and configuration of the
    image using a Dockerfile syntax:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs: []
  type: TYPE_PRE
- en: 'An important distinction: a Docker **image** is the packaged artifact (like
    a template), while a **container** is a running instance of that image. You can
    run multiple containers from the same image. Images are built in layers, where
    each instruction (`FROM`, `RUN`, `COPY`, etc) in a Dockerfile creates a new layer.
    Docker caches these layers, so if you change a line in your Dockerfile, only that
    layer and subsequent layers need to be rebuilt.'
  prefs: []
  type: TYPE_NORMAL
- en: 'The previous Dockerfile has several issues: it uses the full Python image instead
    of a slim variant, runs separate `RUN` commands creating unnecessary layers, versions
    are not pinned, and it doesn’t clean up package manager caches, shipping unnecessary
    files. Other frequent mistakes include insecurely running containers as root and
    accidentally embedding secrets in layers.'
  prefs: []
  type: TYPE_NORMAL
- en: Here’s an improved version
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs: []
  type: TYPE_PRE
- en: In the previous example we see that instead of installing `uv` from source,
    we are copying the prebuilt binary from the `ghcr.io/astral-sh/uv:latest` image.
    This is known as the *builder* pattern. With this pattern we do not need to ship
    all the tools needed to compile our code, just the final binary that is needed
    to run the application (`uv` in this case).
  prefs: []
  type: TYPE_NORMAL
- en: Docker has important limitations to be aware of. First, container images are
    often platform-specific — an image built for `linux/amd64` won’t run natively
    on `linux/arm64` (Apple Silicon Macs) without emulation, which is slow. Second,
    Docker containers require a Linux kernel, so on macOS and Windows, Docker actually
    runs a lightweight Linux VM under the hood, adding overhead. Third, Docker’s isolation
    is weaker than VMs — containers share the host kernel, which is a security concern
    in multi-tenant environments.
  prefs: []
  type: TYPE_NORMAL
- en: These days, more projects are also making use of nix to manage even “system-wide”
    libraries and applications per project through [nix flakes](https://serokell.io/blog/practical-nix-flakes).
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Configuration
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Software is inherently configurable. In the [command line environment](/2026/command-line-environment/)
    lecture we saw programs receiving options via flags, environment variables or
    even configuration files a.k.a. dotfiles. This holds true even for more complex
    applications, and there are established patterns for managing configuration at
    scale. Software configuration should not be embedded in the code but be provided
    at runtime. A couple of common ones being environment variables and config files.
  prefs: []
  type: TYPE_NORMAL
- en: 'Here’s an example of an application that is configured via environment variables:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE18]'
  prefs: []
  type: TYPE_PRE
- en: 'An application could also be configured via a configuration file (e.g., a Python
    program that loads a config via `yaml.load`), `config.yaml`:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE19]'
  prefs: []
  type: TYPE_PRE
- en: A good right-hand rule for thinking about configuration is that the same codebase
    should be deployable to different environments (development, staging, production)
    with only configuration changes, never code changes.
  prefs: []
  type: TYPE_NORMAL
- en: Among the many configuration options there is often sensitive data such as API
    keys. Secrets need to be handled with care to avoid exposing them accidentally,
    and must not be included in version control.
  prefs: []
  type: TYPE_NORMAL
- en: Services & Orchestration
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Modern applications rarely exist in isolation. A typical web application might
    need a database for persistent storage, a cache for performance, a message queue
    for background tasks, and various other supporting services. Rather than bundling
    everything into a single monolithic application, modern architectures often decompose
    functionality into separate services that can be developed, deployed, and scaled
    independently.
  prefs: []
  type: TYPE_NORMAL
- en: As an example, if we determine our application might benefit from using a cache,
    instead of rolling our own we can leverage existing battle tested solutions like
    [Redis](https://redis.io/) or [Memcached](https://memcached.org/). We could embed
    Redis in our application dependencies by building it as part of the container,
    but that means harmonizing all the dependencies between Redis and our application
    which could be challenging or even unfeasible. Instead what we can do is deploy
    each application separately in its own container. This is commonly referred to
    as a microservice architecture where each component runs as an independent service
    that communicates over the network, typically via HTTP APIs.
  prefs: []
  type: TYPE_NORMAL
- en: '[Docker Compose](https://docs.docker.com/compose/) is a tool for defining and
    running multi-container applications. Rather than managing containers individually,
    you declare all services in a single YAML file and orchestrate them together.
    Now our full application encompasses more than one container:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE20]'
  prefs: []
  type: TYPE_PRE
- en: With `docker compose up`, both services start together, and the web application
    can connect to Redis using the hostname `cache` (Docker’s internal DNS resolves
    service names automatically). Docker Compose lets us declare how we want to deploy
    one or more services, and handles the orchestration of starting them together,
    setting up networking between them, and managing shared volumes for data persistence.
  prefs: []
  type: TYPE_NORMAL
- en: 'For production deployments, you often want your docker compose services to
    start automatically on boot and restart on failure. A common approach is to use
    systemd to manage the docker compose deployment:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE21]'
  prefs: []
  type: TYPE_PRE
- en: This systemd unit file ensures your application starts when the system boots
    (after Docker is ready), and provides standard controls like `systemctl start
    myapp`, `systemctl stop myapp`, and `systemctl status myapp`.
  prefs: []
  type: TYPE_NORMAL
- en: As deployment requirements grow more complex — needing scalability across multiple
    machines, fault tolerance when services crash, and high availability guarantees
    — organizations turn to sophisticated container orchestration platforms like Kubernetes
    (k8s), which can manage thousands of containers across clusters of machines. That
    said, Kubernetes has a steep learning curve and significant operational overhead,
    so it’s often overkill for smaller projects.
  prefs: []
  type: TYPE_NORMAL
- en: 'This multi-container setup is partly feasible because modern services communicate
    with each other via standardized APIs, with HTTP REST APIs. For example, whenever
    a program interacts with an LLM provider like OpenAI or Anthropic, under the hood
    it is sending an HTTP request to their servers and parsing the response:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE22]'
  prefs: []
  type: TYPE_PRE
- en: Publishing
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Once you have shown your code to work, you might be interested in distributing
    it for others to download and install. Distribution takes many forms and is intrinsically
    tied to the programming language and environments that you operate with.
  prefs: []
  type: TYPE_NORMAL
- en: The simplest form of distribution is uploading artifacts for people to download
    and install locally. This is still common and you can find it in places like [Ubuntu’s
    package archive](http://archive.ubuntu.com/ubuntu/pool/main/), which is essentially
    an HTTP directory listing of `.deb` files.
  prefs: []
  type: TYPE_NORMAL
- en: These days, GitHub has become the de facto platform for publishing source code
    and artifacts. While the source code is often publicly available, GitHub Releases
    allow maintainers to attach prebuilt binaries and other artifacts to tagged versions.
  prefs: []
  type: TYPE_NORMAL
- en: 'Package managers sometimes support installing directly from GitHub, either
    from source or from a pre-built wheel:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE23]'
  prefs: []
  type: TYPE_PRE
- en: In fact, some languages like Go use a decentralized distribution model — rather
    than a central package repository, Go modules are distributed directly from their
    source code repositories. Module paths like `github.com/gorilla/mux` indicate
    where the code lives, and `go get` fetches directly from there. However, most
    package managers like `pip`, `cargo`, or `brew` have central indexes of pre-packaged
    projects for ease of distribution and installation. If we run
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE24]'
  prefs: []
  type: TYPE_PRE
- en: 'we see where we are fetching the `requests` wheel from. Notice the `py3-none-any`
    in the filename — this means the wheel works with any Python 3 version, on any
    OS, on any architecture. For packages with compiled code, the wheel is platform-specific:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE25]'
  prefs: []
  type: TYPE_PRE
- en: Here `cp312-cp312-macosx_14_0_arm64` indicates this wheel is specifically for
    CPython 3.12 on macOS 14+ for ARM64 (Apple Silicon). If you’re on a different
    platform, `pip` will download a different wheel or build from source.
  prefs: []
  type: TYPE_NORMAL
- en: 'Conversely, for people to be able to find a package we’ve created, we need
    to publish it to one of these registries. In Python, the main registry is the
    [Python Package Index (PyPI)](https://pypi.org). Like with installing, there are
    multiple ways of publishing packages. The `uv publish` command provides a modern
    interface for uploading packages to PyPI:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE26]'
  prefs: []
  type: TYPE_PRE
- en: 'Here we are using [TestPyPI](https://test.pypi.org) — a separate package registry
    intended for testing your publishing workflow without polluting the real PyPI.
    Once uploaded, you can install from TestPyPI:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE27]'
  prefs: []
  type: TYPE_PRE
- en: A key consideration when publishing software is trust. How do users verify that
    the package they download actually comes from you and hasn’t been tampered with?
    Package registries use checksums to verify integrity, and some ecosystems support
    package signing to provide cryptographic proof of authorship.
  prefs: []
  type: TYPE_NORMAL
- en: 'Different languages have their own package registries: [crates.io](https://crates.io)
    for Rust, [npm](https://www.npmjs.com) for JavaScript, [RubyGems](https://rubygems.org)
    for Ruby, and [Docker Hub](https://hub.docker.com) for container images. Meanwhile,
    for private or internal packages, organizations often deploy their own package
    repositories (such as a private PyPI server or a private Docker registry) or use
    managed solutions from cloud providers.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Deploying a web service to the internet involves additional infrastructure:
    domain name registration, DNS configuration to point your domain to your server,
    and often a reverse proxy like nginx to handle HTTPS and route traffic. For simpler
    use cases like documentation or static sites, [GitHub Pages](https://pages.github.com/)
    provides free hosting directly from a repository.'
  prefs: []
  type: TYPE_NORMAL
- en: Exercises
