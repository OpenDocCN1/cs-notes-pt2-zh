  type: TYPE_NORMAL
- en: 'Save your environment with `printenv` to a file, create a venv, activate it,
    `printenv` to another file and `diff before.txt after.txt`. What changed in the
    environment? Why does the shell prefer the venv? (Hint: look at `$PATH` before
    and after activation.) Run `which deactivate` and reason about what the deactivate
    bash function is doing.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Create a Python package with a `pyproject.toml` and install it in a virtual
    environment. Create a lockfile and inspect it.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Install Docker and use it to build the Missing Semester class website locally
    using docker compose.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Write a Dockerfile for a simple Python application. Then write a `docker-compose.yml`
    that runs your application alongside a Redis cache.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Publish a Python package to TestPyPI (don’t publish to the real PyPI unless
    it’s worth sharing!). Then build a Docker image with said package and push it
    to `ghcr.io`.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Make a website using [GitHub Pages](https://docs.github.com/en/pages/quickstart).
    Extra (non-)credit: configure it with a custom domain.'
  prefs:
  - PREF_OL
