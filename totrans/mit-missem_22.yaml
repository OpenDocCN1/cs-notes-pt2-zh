    Vim 在新配置下的外观和行为略有不同。
- en: 'Install and configure a plugin: [ctrlp.vim](https://github.com/ctrlpvim/ctrlp.vim).'
  id: totrans-180
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 安装并配置插件：[ctrlp.vim](https://github.com/ctrlpvim/ctrlp.vim)。
- en: Create the plugins directory with `mkdir -p ~/.vim/pack/vendor/start`
  id: totrans-181
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 使用 `mkdir -p ~/.vim/pack/vendor/start` 创建插件目录
- en: 'Download the plugin: `cd ~/.vim/pack/vendor/start; git clone https://github.com/ctrlpvim/ctrlp.vim`'
  id: totrans-182
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 下载插件：`cd ~/.vim/pack/vendor/start; git clone https://github.com/ctrlpvim/ctrlp.vim`
- en: Read the [documentation](https://github.com/ctrlpvim/ctrlp.vim/blob/master/readme.md)
    for the plugin. Try using CtrlP to locate a file by navigating to a project directory,
    opening Vim, and using the Vim command-line to start `:CtrlP`.
  id: totrans-183
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 阅读插件的[文档](https://github.com/ctrlpvim/ctrlp.vim/blob/master/readme.md)。尝试使用
    CtrlP 通过导航到项目目录，打开 Vim，并使用 Vim 命令行启动 `:CtrlP` 来定位文件。
- en: Customize CtrlP by adding [configuration](https://github.com/ctrlpvim/ctrlp.vim/blob/master/readme.md#basic-options)
    to your `~/.vimrc` to open CtrlP by pressing Ctrl-P.
  id: totrans-184
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 通过添加[配置](https://github.com/ctrlpvim/ctrlp.vim/blob/master/readme.md#basic-options)到你的`~/.vimrc`中来自定义
    CtrlP，通过按 Ctrl-P 来打开 CtrlP。
- en: To practice using Vim, re-do the [Demo](#demo) from lecture on your own machine.
  id: totrans-185
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为了练习使用 Vim，在自己的机器上重新做讲座中的[演示](#demo)。
- en: Use Vim for *all* your text editing for the next month. Whenever something seems
    inefficient, or when you think “there must be a better way”, try Googling it,
    there probably is. If you get stuck, come to office hours or send us an email.
  id: totrans-186
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在接下来的一个月内使用 Vim 进行所有文本编辑。每当遇到效率低下或认为“一定有更好的方法”时，尝试在 Google 上搜索，可能真的有。如果你卡住了，请来办公室或给我们发电子邮件。
- en: Configure your other tools to use Vim bindings (see instructions above).
