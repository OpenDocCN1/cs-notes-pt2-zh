- en: Exercises
  id: totrans-170
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: On a repo try modifying an existing file. What happens when you do `git stash`?
    What do you see when running `git log --all --oneline`? Run `git stash pop` to
    undo what you did with `git stash`. In what scenario might this be useful?
  id: totrans-171
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在一个仓库中尝试修改一个现有文件。当你执行 `git stash` 时会发生什么？运行 `git log --all --oneline` 你会看到什么？通过运行
    `git stash pop` 来撤销你用 `git stash` 做的操作。在什么情况下这可能会很有用？
- en: One common mistake when learning git is to commit large files that should not
    be managed by git or adding sensitive information. Try adding a file to a repository,
    making some commits and then deleting that file from history (you may want to
    look at [this](https://help.github.com/articles/removing-sensitive-data-from-a-repository/)).
    Also if you do want git to manage large files for you, look into [Git-LFS](https://git-lfs.github.com/)
  id: totrans-172
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 学习 Git 时常见的错误之一是提交不应由 Git 管理的大文件或添加敏感信息。尝试将文件添加到仓库中，进行一些提交，然后从历史记录中删除该文件（你可能需要查看
    [这个](https://help.github.com/articles/removing-sensitive-data-from-a-repository/)）。另外，如果你希望
    Git 为你管理大文件，查看 [Git-LFS](https://git-lfs.github.com/)
- en: Git is really convenient for undoing changes but one has to be familiar even
    with the most unlikely changes
  id: totrans-173
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: Git 对于撤销更改非常方便，但一个人甚至需要熟悉最不可能发生的变化。
- en: If a file is mistakenly modified in some commit it can be reverted with `git
    revert`. However if a commit involves several changes `revert` might not be the
    best option. How can we use `git checkout` to recover a file version from a specific
    commit?
  id: totrans-174
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果某个提交中不小心修改了文件，可以使用 `git revert` 来撤销更改。然而，如果提交涉及多个更改，`revert` 可能不是最佳选择。我们如何使用
    `git checkout` 从特定提交中恢复文件版本？
- en: 'Create a branch, make a commit in said branch and then delete it. Can you still
    recover said commit? Try looking into `git reflog`. (Note: Recover dangling things
    quickly, git will periodically automatically clean up commits that nothing points
    to.)'
  id: totrans-175
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 创建一个分支，在该分支中提交并删除它。你还能恢复该提交吗？尝试查看 `git reflog`。（注意：快速恢复悬空对象，Git 会定期自动清理没有任何引用指向的提交。）
- en: If one is too trigger happy with `git reset --hard` instead of `git reset` changes
    can be easily lost. However since the changes were staged, we can recover them.
    (look into `git fsck --lost-found` and `.git/lost-found`)
  id: totrans-176
  prefs:
  - PREF_IND
  - PREF_OL
  type: TYPE_NORMAL
  zh: 如果一个人过于冲动地使用 `git reset --hard` 而不是 `git reset`，那么更改可能会轻易丢失。然而，由于更改已经被暂存，我们可以恢复它们。（查看
    `git fsck --lost-found` 和 `.git/lost-found`）
- en: In any git repo look under the folder `.git/hooks` you will find a bunch of
    scripts that end with `.sample`. If you rename them without the `.sample` they
    will run based on their name. For instance `pre-commit` will execute before doing
    a commit. Experiment with them
  id: totrans-177
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在任何 Git 仓库中，查看 `.git/hooks` 文件夹，你会找到一些以 `.sample` 结尾的脚本。如果你将它们重命名并去掉 `.sample`，它们将根据其名称运行。例如，`pre-commit`
    将在提交之前执行。尝试使用它们进行实验。
- en: Like many command line tools `git` provides a configuration file (or dotfile)
    called `~/.gitconfig` . Create and alias using `~/.gitconfig` so that when you
    run `git graph` you get the output of `git log --oneline --decorate --all --graph`
    (this is a good command to quickly visualize the commit graph)
  id: totrans-178
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 与许多命令行工具一样，`git` 提供了一个名为 `~/.gitconfig` 的配置文件（或点文件）。使用 `~/.gitconfig` 创建一个别名，这样当你运行
    `git graph` 时，你会得到 `git log --oneline --decorate --all --graph` 的输出（这是一个快速可视化提交图的不错命令）。
- en: Git also lets you define global ignore patterns under `~/.gitignore_global`,
    this is useful to prevent common errors like adding RSA keys. Create a `~/.gitignore_global`
    file and add the pattern `*rsa`, then test that it works in a repo.
  id: totrans-179
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: Git 还允许你在 `~/.gitignore_global` 下定义全局忽略模式，这有助于防止常见的错误，例如添加 RSA 密钥。创建一个 `~/.gitignore_global`
    文件，并添加模式 `*rsa`，然后测试它在仓库中是否有效。
- en: Once you start to get more familiar with `git`, you will find yourself running
    into common tasks, such as editing your `.gitignore`. [git extras](https://github.com/tj/git-extras/blob/master/Commands.md)
    provides a bunch of little utilities that integrate with `git`. For example `git
    ignore PATTERN` will add the specified pattern to the `.gitignore` file in your
    repo and `git ignore-io LANGUAGE` will fetch the common ignore patterns for that
    language from [gitignore.io](https://www.gitignore.io). Install `git extras` and
    try using some tools like `git alias` or `git ignore`.
  id: totrans-180
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一旦你开始更熟悉 `git`，你会发现自己在遇到常见任务，例如编辑你的 `.gitignore`。[git extras](https://github.com/tj/git-extras/blob/master/Commands.md)
    提供了一些小工具，它们可以与 `git` 集成。例如，`git ignore PATTERN` 将将指定的模式添加到你的仓库中的 `.gitignore`
    文件，而 `git ignore-io LANGUAGE` 将从 [gitignore.io](https://www.gitignore.io) 获取该语言的常见忽略模式。安装
    `git extras` 并尝试使用一些工具，如 `git alias` 或 `git ignore`。
- en: Git GUI programs can be a great resource sometimes. Try running [gitk](https://git-scm.com/docs/gitk)
    in a git repo an explore the different parts of the interface. Then run `gitk
    --all` what are the differences?
  id: totrans-181
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: Git 图形界面程序有时可以是一个很好的资源。尝试在一个 Git 仓库中运行 [gitk](https://git-scm.com/docs/gitk)，并探索界面的不同部分。然后运行
    `gitk --all`，看看有什么不同？
- en: Once you get used to command line applications GUI tools can feel cumbersome/bloated.
    A nice compromise between the two are ncurses based tools which can be navigated
    from the command line and still provide an interactive interface. Git has [tig](https://github.com/jonas/tig),
    try installing it and running it in a repo. You can find some usage examples [here](https://www.atlassian.com/blog/git/git-tig).
  id: totrans-182
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 一旦你习惯了命令行应用程序，GUI 工具可能会感觉笨重/臃肿。两者之间一个不错的折衷方案是基于 ncurses 的工具，这些工具可以从命令行导航，同时仍然提供交互式界面。Git
    有 [tig](https://github.com/jonas/tig)，尝试安装它并在一个仓库中运行它。你可以在[这里](https://www.atlassian.com/blog/git/git-tig)找到一些使用示例。
