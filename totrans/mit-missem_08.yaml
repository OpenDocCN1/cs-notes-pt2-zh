- en: Version Control
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 版本控制
- en: 原文：[https://missing.csail.mit.edu/2019/version-control/](https://missing.csail.mit.edu/2019/version-control/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: '[原文链接](https://missing.csail.mit.edu/2019/version-control/)'
- en: 'Whenever you are working on something that changes over time, it’s useful to
    be able to *track* those changes. This can be for a number of reasons: it gives
    you a record of what changed, how to undo it, who changed it, and possibly even
    why. Version control systems (VCS) give you that ability. They let you *commit*
    changes to a set of files, along with a message describing the change, as well
    as look at and undo changes you’ve made in the past.'
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: 无论你正在处理的是随时间变化的东西，能够跟踪这些变化都是有用的。这可能出于许多原因：它为你记录了发生了什么变化，如何撤销它，谁进行了更改，甚至可能还有为什么。版本控制系统（VCS）提供了这种能力。它们允许你将更改提交到一组文件中，包括描述更改的消息，以及查看和撤销你过去所做的更改。
- en: 'Most VCS support sharing the commit history between multiple users. This allows
    for convenient collaboration: you can see the changes I’ve made, and I can see
    the changes you’ve made. And since the VCS tracks *changes*, it can often (though
    not always) figure out how to combine our changes as long as they touch relatively
    disjoint things.'
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: 大多数 VCS 支持在多个用户之间共享提交历史。这允许方便的协作：你可以看到我所作的更改，我也可以看到你所作的更改。由于 VCS 跟踪更改，它通常（尽管不总是）能够找出如何结合我们的更改，只要它们相对不重叠。
- en: There [*a lot*](https://en.wikipedia.org/wiki/Comparison_of_version-control_software)
    of VCSes out there that differ a lot in what they support, how they function,
    and how you interact with them. Here, we’ll focus on [git](https://git-scm.com/),
    one of the more commonly used ones, but I recommend you also take a look at [Mercurial](https://www.mercurial-scm.org/).
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 有很多 VCS，它们在支持的内容、功能和交互方式上差异很大。[这里](https://en.wikipedia.org/wiki/Comparison_of_version-control_software)有很多，我们将重点介绍
    [git](https://git-scm.com/)，这是更常用的一种，但我建议你也要看看 [Mercurial](https://www.mercurial-scm.org/)。
- en: With that all said – to the cliffnotes!
  id: totrans-5
  prefs: []
  type: TYPE_NORMAL
  zh: 说了这么多——直接进入要点！
- en: Is git dark magic?
  id: totrans-6
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Git 是黑暗魔法吗？
- en: not quite.. you need to understand the data model. we’re going to skip over
    some of the details, but roughly speaking, the *core* “thing” in git is a commit.
  id: totrans-7
  prefs: []
  type: TYPE_NORMAL
  zh: 还不完全是这样……你需要理解数据模型。我们将跳过一些细节，但大致来说，git 的 *核心* “东西”是一个提交。
- en: 'every commit has a unique name, “revision hash” a long hash like `998622294a6c520db718867354bf98348ae3c7e2`
    often shortened to a short (unique-ish) prefix: `9986222`'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 每个提交都有一个唯一的名称，“修订哈希”一个像 `998622294a6c520db718867354bf98348ae3c7e2` 这样长的哈希值，通常缩短为一个短（独特）的前缀：`9986222`
- en: commit has author + commit message
  id: totrans-9
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 提交包含作者 + 提交信息
- en: also has the hash of any *ancestor commits* usually just the hash of the previous
    commit
  id: totrans-10
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 还包含任何 *祖先提交* 的哈希值，通常是上一个提交的哈希值
- en: commit also represents a *diff*, a representation of how you get from the commit’s
    ancestors to the commit (e.g., remove this line in this file, add these lines
    to this file, rename that file, etc.)
  id: totrans-11
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 提交也代表了一个 diff，即从提交的祖先到提交的表示（例如，删除此文件中的这一行，添加此文件中的这些行，重命名该文件等）。
- en: in reality, git stores the full before and after state
  id: totrans-12
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 事实上，Git 存储了完整的前后状态
- en: probably don’t want to store big files that change!
  id: totrans-13
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 可能不想存储经常更改的大文件！
- en: 'initially, the *repository* (roughly: the folder that git manages) has no content,
    and no commits. let’s set that up:'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: 初始时，*仓库*（大致上：git 管理的文件夹）没有内容，也没有提交。让我们设置一下：
- en: '[PRE0]'
  id: totrans-15
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: the output here actually gives us a good starting point. let’s dig in and make
    sure we understand it all.
  id: totrans-16
  prefs: []
  type: TYPE_NORMAL
  zh: 这里的输出实际上为我们提供了一个很好的起点。让我们深入挖掘，确保我们完全理解它。
- en: first, “On branch master”.
  id: totrans-17
  prefs: []
  type: TYPE_NORMAL
  zh: 首先，“位于分支 master”。
- en: don’t want to use hashes all the time.
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 不想总是使用哈希值。
- en: branches are names that point to hashes.
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 分支是指向哈希值的名称。
- en: master is traditionally the name for the “latest” commit. every time a new commit
    is made, the master name will be made to point to the new commit’s hash.
  id: totrans-20
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: master 是传统上指代“最新”提交的名称。每次创建新的提交时，master 名称都会指向新的提交哈希。
- en: special name `HEAD` refers to “current” name
  id: totrans-21
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 特殊名称 `HEAD` 指的是“当前”名称
- en: you can also make your own names with `git branch` (or `git tag`) we’ll get
    back to that
  id: totrans-22
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你也可以使用 `git branch`（或 `git tag`）创建自己的名称，我们稍后会回到这一点
- en: let’s skip over “No commits yet” because that’s all there is to it.
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 让我们跳过“还没有提交”，因为这没什么可说的。
- en: then, “nothing to commit”.
  id: totrans-24
  prefs: []
  type: TYPE_NORMAL
  zh: 然后，“没有提交内容”。
- en: every commit contains a diff with all the changes you made. but how is that
    diff constructed in the first place?
  id: totrans-25
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 每个提交都包含一个包含所有你所作更改的 diff。但这个 diff 是如何最初构建的呢？
- en: '*could* just always commit *all* changes you’ve made since the last commit'
  id: totrans-26
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '*可以*总是提交自上次提交以来所做的所有更改'
- en: sometimes you want to only commit some of them (e.g., not `TODO`s)
  id: totrans-27
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 有时你只想提交其中的一些（例如，不包括 `TODO`s）
- en: sometimes you want to break up a change into multiple commits to give a separate
    commit message for each one
  id: totrans-28
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 有时你希望将一个更改拆分成多个提交，为每个提交提供单独的提交信息
- en: git lets you *stage* changes to construct a commit
  id: totrans-29
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: git 允许你*暂存*更改以构建一个提交
- en: add changes to a file or files to the staged changes with `git add`
  id: totrans-30
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git add` 将文件或文件的更改添加到暂存更改中
- en: add only some changes in a file with `git add -p`
  id: totrans-31
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git add -p` 仅添加文件中的某些更改
- en: without argument `git add` operates on “all known files”
  id: totrans-32
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 没有参数时，`git add` 对“所有已知文件”操作
- en: remove a file and stage its removal with `git rm`
  id: totrans-33
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git rm` 删除文件并将其删除暂存
- en: empty the set of staged changes `git reset`
  id: totrans-34
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git reset` 清空暂存更改集
- en: note that this does *not* change any of your files! it *only* means that no
    changes will be included in a commit
  id: totrans-35
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 注意，这*不会*更改任何文件！它*只*意味着不会有更改被包含在提交中
- en: 'to remove only some staged changes: `git reset FILE` or `git reset -p`'
  id: totrans-36
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 要移除仅一些暂存更改：`git reset FILE` 或 `git reset -p`
- en: check staged changes with `git diff --staged`
  id: totrans-37
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git diff --staged` 检查暂存更改
- en: see remaining changes with `git diff`
  id: totrans-38
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git diff` 查看剩余的更改
- en: when you’re happy with the stage, make a commit with `git commit`
  id: totrans-39
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当你对暂存满意时，使用 `git commit` 创建提交
- en: 'if you just want to commit *all* changes: `git commit -a`'
  id: totrans-40
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果你只想提交*所有*更改：`git commit -a`
- en: '`git help add` has a bunch more helpful info'
  id: totrans-41
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git help add` 有更多有用的信息'
- en: while you’re playing with the above, try to run `git status` to see what git
    thinks you’re doing – it’s surprisingly helpful!
  id: totrans-42
  prefs: []
  type: TYPE_NORMAL
  zh: 当你在玩弄上述内容时，尝试运行 `git status` 来查看 git 认为你正在做什么——这出奇地有帮助！
- en: A commit you say…
  id: totrans-43
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 你说的一个提交...
- en: okay, we have a commit, now what?
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 好的，我们有一个提交，现在怎么办？
- en: 'we can look at recent changes: `git log` (or `git log --oneline`)'
  id: totrans-45
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以查看最近的变化：`git log`（或 `git log --oneline`）
- en: 'we can look at the full changes: `git log -p`'
  id: totrans-46
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以使用 `git log -p` 查看完整更改
- en: 'we can show a particular commit: `git show master`'
  id: totrans-47
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以使用 `git show master` 显示特定的提交
- en: or with `-p` for full diff/patch
  id: totrans-48
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 或者使用 `-p` 进行完整的 diff/patch
- en: we can go back to the state at a commit using `git checkout NAME`
  id: totrans-49
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以使用 `git checkout NAME` 回到提交的状态
- en: if `NAME` is a commit hash, git says we’re “detached”. this just means there’s
    no `NAME` that refers to this commit, so if we make commits, no-one will know
    about them.
  id: totrans-50
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果 `NAME` 是一个提交哈希，git 会说我们处于“分离”状态。这仅仅意味着没有 `NAME` 指向这个提交，所以如果我们进行提交，没有人会知道。
- en: we can revert a change with `git revert NAME`
  id: totrans-51
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以用 `git revert NAME` 撤销一个更改
- en: applies the diff in the commit at `NAME` in reverse.
  id: totrans-52
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 反向应用 `NAME` 提交中的更改
- en: we can compare an older version to this one using `git diff NAME..`
  id: totrans-53
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以使用 `git diff NAME..` 将较旧版本与此版本进行比较
- en: '`a..b` is a commit *range*. if either is left out, it means `HEAD`.'
  id: totrans-54
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`a..b` 是一个提交范围。如果任一为空，则表示 `HEAD`。'
- en: we can show all the commits between using `git log NAME..`
  id: totrans-55
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以使用 `git log NAME..` 显示使用之间的所有提交
- en: '`-p` works here too'
  id: totrans-56
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`-p` 在这里也适用'
- en: 'we can change `master` to point to a particular commit (effectively undoing
    everything since) with `git reset NAME`:'
  id: totrans-57
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 我们可以用 `git reset NAME` 将 `master` 指向特定的提交（实际上是从那时起撤销所有更改）：
- en: huh, why? wasn’t `reset` to change staged changes? reset has a “second” form
    (see `git help reset`) which sets `HEAD` to the commit pointed to by the given
    name.
  id: totrans-58
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 哎，为什么？`reset` 不是用来更改暂存更改的吗？`reset` 有一个“第二种”形式（见 `git help reset`），它将 `HEAD`
    设置为给定名称指向的提交。
- en: notice that this didn’t change any files – `git diff` now effectively shows
    `git diff NAME..`.
  id: totrans-59
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 注意，这并没有改变任何文件——`git diff` 现在实际上显示 `git diff NAME..`。
- en: What’s in a name?
  id: totrans-60
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 名称的意义是什么？
- en: clearly, names are important in git. and they’re the key to understanding *a
    lot* of what goes on in git. so far, we’ve talked about commit hashes, master,
    and `HEAD`. but there’s more!
  id: totrans-61
  prefs: []
  type: TYPE_NORMAL
  zh: 很明显，在 git 中名称很重要。它们是理解 git 中发生的大部分事情的关键。到目前为止，我们已经讨论了提交哈希、master 和 `HEAD`。但还有更多！
- en: you can make your own branches (like master) with `git branch b`
  id: totrans-62
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你可以用 `git branch b` 创建自己的分支（如 master）
- en: creates a new name, `b`, which points to the commit at `HEAD`
  id: totrans-63
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 创建一个新的名称，`b`，它指向 `HEAD` 处的提交
- en: you’re still “on” master though, so if you make a new commit, master will point
    to that new commit, `b` will not.
  id: totrans-64
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 尽管如此，你仍然“在”master 上，所以如果你创建一个新的提交，master 将指向那个新提交，`b` 不会。
- en: switch to a branch with `git checkout b`
  id: totrans-65
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git checkout b` 切换到分支
- en: any commits you make will now update the `b` name
  id: totrans-66
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你现在所做的任何提交都将更新 `b` 名称
- en: switch back to master with `git checkout master`
  id: totrans-67
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git checkout master` 切换回 master
- en: all your changes in `b` are hidden away
  id: totrans-68
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`b` 中的所有更改都被隐藏起来'
- en: a very handy way to be able to easily test out changes
  id: totrans-69
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 这是一个非常方便的方法，可以轻松测试更改
- en: tags are other names that never change, and that have their own message. often
    used to mark releases + changelogs.
  id: totrans-70
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 标签是永远不会改变的另一个名称，并且有自己的信息。常用于标记发布和变更日志。
- en: '`NAME^` means “the commit before `NAME`'
  id: totrans-71
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`NAME^` 表示“`NAME`之前的提交”'
- en: 'can apply recursively: `NAME^^^`'
  id: totrans-72
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 可以递归应用：`NAME^^^`
- en: you *most likely* mean `~` when you use `~`
  id: totrans-73
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当你使用`~`时，你很可能是指`~`
- en: '`~` is “temporal”, whereas `^` goes by ancestors'
  id: totrans-74
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`~`是“时间性的”，而`^`通过祖先'
- en: '`~~` is the same as `^^`'
  id: totrans-75
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`~~`与`^^`相同'
- en: with `~` you can also write `X~3` for “3 commits older than `X`
  id: totrans-76
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用`~`你还可以写`X~3`表示“比`X`早3个提交”
- en: you don’t want `^3`
  id: totrans-77
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你不想要`^3`
- en: '`git diff HEAD^`'
  id: totrans-78
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git diff HEAD^`'
- en: '`-` means “the previous name”'
  id: totrans-79
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`-`表示“前一个名称”'
- en: most commands operate on `HEAD` unless you give another argument
  id: totrans-80
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 除非你给出另一个参数，否则大多数命令都操作于`HEAD`。
- en: Clean up your mess
  id: totrans-81
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 清理你的混乱
- en: 'your commit history will *very* often end up as:'
  id: totrans-82
  prefs: []
  type: TYPE_NORMAL
  zh: 你的提交历史通常会变成：
- en: '`add feature x` – maybe even with a commit message about `x`!'
  id: totrans-83
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`add feature x` – 可能甚至有一个关于`x`的提交信息！'
- en: '`forgot to add file`'
  id: totrans-84
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`忘记添加文件`'
- en: '`fix bug`'
  id: totrans-85
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`fix bug`'
- en: '`typo`'
  id: totrans-86
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`typo`'
- en: '`typo2`'
  id: totrans-87
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`typo2`'
- en: '`actually fix`'
  id: totrans-88
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`实际上修复`'
- en: '`actually actually fix`'
  id: totrans-89
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`实际上实际上修复`'
- en: '`tests pass`'
  id: totrans-90
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`tests pass`'
- en: '`fix example code`'
  id: totrans-91
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`fix example code`'
- en: '`typo`'
  id: totrans-92
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`typo`'
- en: '`x`'
  id: totrans-93
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`x`'
- en: '`x`'
  id: totrans-94
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`x`'
- en: '`x`'
  id: totrans-95
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`x`'
- en: '`x`'
  id: totrans-96
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`x`'
- en: 'that’s *fine* as far as git is concerned, but is not very helpful to your future
    self, or to other people who are curious about what has changed. git lets you
    clean up these things:'
  id: totrans-97
  prefs: []
  type: TYPE_NORMAL
  zh: 对于git来说，这是*可以接受的*，但对未来的你或其他好奇变化内容的人并不太有帮助。git允许你清理这些事情：
- en: '`git commit --amend`: fold staged changes into previous commit'
  id: totrans-98
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git commit --amend`: 将暂存更改合并到上一个提交'
- en: note that this *changes* the previous commit, giving it a new hash!
  id: totrans-99
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 注意，这*会改变*之前的提交，给它一个新的哈希值！
- en: '`git rebase -i HEAD~13` is *magical*. for each commit from past 13, choose
    what to do:'
  id: totrans-100
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git rebase -i HEAD~13`是*神奇的*。对于过去13次提交中的每一次，选择要执行的操作：'
- en: default is `pick`; do nothing
  id: totrans-101
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 默认是`pick`；不执行任何操作
- en: '`r`: change commit message'
  id: totrans-102
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`r`: 修改提交信息'
- en: '`e`: change commit (add or remove files)'
  id: totrans-103
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`e`: 更改提交（添加或删除文件）'
- en: '`s`: combine commit with previous and edit commit message'
  id: totrans-104
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`s`: 将提交与上一个提交合并并编辑提交信息'
- en: '`f`: “fixup” – combine commit with previous; discard commit msg'
  id: totrans-105
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`f`: “修复” – 将提交与上一个提交合并；丢弃提交信息'
- en: at the end, `HEAD` is made to point to what is now the last commit
  id: totrans-106
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 最后，`HEAD`被设置为指向现在的最后一个提交
- en: often referred to as *squashing* commits
  id: totrans-107
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 通常被称为*压缩*提交
- en: 'what it really does: rewind `HEAD` to rebase start point, then re-apply the
    commits in order as directed.'
  id: totrans-108
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 它真正做的事情：将`HEAD`回滚到变基的起点，然后按照指示的顺序重新应用提交。
- en: '`git reset --hard NAME`: reset the state of all files to that of `NAME` (or
    `HEAD` if no name is given). handy for undoing changes.'
  id: totrans-109
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git reset --hard NAME`: 将所有文件的状态重置为`NAME`（如果没有给出名称，则为`HEAD`）。这对于撤销更改很有用。'
- en: Playing with others
  id: totrans-110
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 与他人一起玩耍
- en: a common use-case for version control is to allow multiple people to make changes
    to a set of files without stepping on each other’s toes. or rather, to make sure
    that *if* they step on each other’s toes, they won’t just silently overwrite each
    other’s changes.
  id: totrans-111
  prefs: []
  type: TYPE_NORMAL
  zh: 版本控制的一个常见用例是允许多个人对一组文件进行更改，而不会相互干扰。或者更确切地说，确保*如果*他们相互干扰，他们不会默默地覆盖彼此的更改。
- en: 'git is a *distributed* VCS: everyone has a local copy of the entire repository
    (well, of everything others have chosen to publish). some VCSes are *centralized*
    (e.g., subversion): a server has all the commits, clients only have the files
    they have “checked out”. basically, they only have the *current* files, and need
    to ask the server if they want anything else.'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: git是一个*分布式*版本控制系统：每个人都有一个整个仓库的本地副本（好吧，是其他人选择发布的所有内容）。一些VCS是*集中式*的（例如，subversion）：服务器拥有所有提交，客户端只有他们“检出”的文件。基本上，他们只有*当前*的文件，并且需要向服务器请求其他内容。
- en: every copy of a git repository can be listed as a “remote”. you can copy an
    existing git repository using `git clone ADDRESS` (instead of `git init`). this
    creates a remote called *origin* that points to `ADDRESS`. you can fetch names
    and the commits they point to from a remote with `git fetch REMOTE`. all names
    at a remote are available to you as `REMOTE/NAME`, and you can use them just like
    local names.
  id: totrans-113
  prefs: []
  type: TYPE_NORMAL
  zh: 每个git仓库的副本都可以列为“远程”。你可以使用`git clone ADDRESS`（而不是`git init`）复制现有的git仓库。这创建了一个名为*origin*的远程，它指向`ADDRESS`。你可以使用`git
    fetch REMOTE`从远程获取名称和它们指向的提交。远程的所有名称都对你可用，作为`REMOTE/NAME`，你可以像使用本地名称一样使用它们。
- en: 'if you have write access to a remote, you can change names at the remote to
    point to commits you’ve made using `git push`. for example, let’s make the master
    name (branch) at the remote `origin` point to the commit that our master branch
    currently points to:'
  id: totrans-114
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你具有对远程仓库的写权限，你可以通过使用 `git push` 来更改远程仓库中的名称，使其指向你已提交的提交。例如，让我们将远程仓库 `origin`
    中的 `master` 名称（分支）指向当前 `master` 分支指向的提交：
- en: '`git push origin master:master`'
  id: totrans-115
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git push origin master:master`'
- en: for convenience, you can set `origin/master` as the default target for when
    you `git push` from the current branch with `-u`
  id: totrans-116
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 为了方便起见，你可以将 `origin/master` 设置为当你从当前分支使用 `-u` 推送时的默认目标
- en: 'consider: what does this do? `git push origin master:HEAD^`'
  id: totrans-117
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 考虑：这会做什么？`git push origin master:HEAD^`
- en: often you’ll use GitHub, GitLab, BitBucket, or something else as your remote.
    there’s nothing “special” about that as far as git is concerned. it’s all just
    names and commits. if someone makes a change to master and updates `github/master`
    to point to their commit (we’ll get back to that in a second), then when you `git
    fetch github`, you’ll be able to see their changes with `git log github/master`.
  id: totrans-118
  prefs: []
  type: TYPE_NORMAL
  zh: 通常，你会使用 GitHub、GitLab、BitBucket 或其他类似的服务作为你的远程仓库。就 git 而言，这并没有什么“特殊”之处。它只是名称和提交。如果有人更改了
    `master` 分支并更新 `github/master` 以指向他们的提交（我们稍后会回到这一点），那么当你执行 `git fetch github`
    时，你将能够使用 `git log github/master` 看到他们的更改。
- en: Working with others
  id: totrans-119
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 与他人协作
- en: 'so far, branches seem pretty useless: you can create them, do work on them,
    but then what? eventually, you’ll just make master point to them anyway, right?'
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 到目前为止，分支似乎没什么用：你可以创建它们，在上面做工作，但然后呢？最终，你还是会将 `master` 指向它们，对吧？
- en: what if you had to fix something while working on a big feature?
  id: totrans-121
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果你在开发一个大型功能时需要修复某些问题怎么办？
- en: what if someone else made a change to master in the meantime?
  id: totrans-122
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果在此期间有人对 `master` 分支进行了更改怎么办？
- en: 'inevitably, you will have to *merge* changes in one branch with changes in
    another, whether those changes are made by you or someone else. git lets you do
    this with, unsurprisingly, `git merge NAME`. `merge` will:'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 不可避免地，你将不得不将一个分支的更改与另一个分支的更改合并，无论这些更改是由你还是其他人做出的。git 允许你使用 `git merge NAME`
    来做这件事，不出所料。`merge` 将：
- en: look for the latest point where `HEAD` and `NAME` shared a commit ancestor (i.e.,
    where they diverged)
  id: totrans-124
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 寻找 `HEAD` 和 `NAME` 共享的提交祖先的最新点（即它们分叉的地方）
- en: (try to) apply all those changes to the current `HEAD`
  id: totrans-125
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: （尝试）将所有这些更改应用到当前的 `HEAD`
- en: produce a commit that contains all those changes, and lists both `HEAD` and
    `NAME` as its ancestors
  id: totrans-126
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 生成一个包含所有这些更改的提交，并将 `HEAD` 和 `NAME` 列为其祖先
- en: set `HEAD` to that commit’s hash
  id: totrans-127
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 将 `HEAD` 设置为该提交的哈希值
- en: once your big feature has been finished, you can merge its branch into master,
    and git will ensure that you don’t lose any changes from either branch!
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 一旦你的大型功能完成，你可以将其分支合并到 `master` 中，git 将确保你不会丢失任何分支上的更改！
- en: 'if you’ve used git in the past, you may recognize `merge` by a different name:
    `pull`. when you do `git pull REMOTE BRANCH`, that is:'
  id: totrans-129
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你以前使用过 git，你可能通过不同的名称认识 `merge`：`pull`。当你执行 `git pull REMOTE BRANCH` 时，这意味着：
- en: '`git fetch REMOTE`'
  id: totrans-130
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git fetch REMOTE`'
- en: '`git merge REMOTE/BRANCH`'
  id: totrans-131
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git merge REMOTE/BRANCH`'
- en: where, like `push`, `REMOTE` and `BRANCH` are often omitted and use the “tracking”
    remote branch (remember `-u`?)
  id: totrans-132
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 其中，就像 `push` 一样，`REMOTE` 和 `BRANCH` 通常省略并使用“跟踪”远程分支（记得 `-u` 吗？）
- en: this usually works *great*. as long as the changes to the branches being merged
    are disjoint. if they are not, you get a *merge conflict*. sounds scary…
  id: totrans-133
  prefs: []
  type: TYPE_NORMAL
  zh: 这通常工作得非常好。只要合并的分支之间的更改是互斥的。如果不是，你就会遇到一个 *合并冲突*。听起来很可怕...
- en: a merge conflict is just git telling you that it doesn’t know what the final
    diff should look like
  id: totrans-134
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 合并冲突只是 git 告诉你它不知道最终的差异应该是什么样子
- en: git pauses and asks you to finish staging the “merge commit”
  id: totrans-135
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: git 暂停并要求你完成“合并提交”的暂存
- en: open the conflicted file in your editor and look for lots of angle brackets
    (`<<<<<<<`). the stuff above `=======` is the change made in the `HEAD` since
    the shared ancestor commit. the stuff below is the change made in the `NAME` since
    the shared commit.
  id: totrans-136
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在你的编辑器中打开冲突的文件，并寻找许多角度符号 (`<<<<<<<`)。`=======` 之上的内容是自共享祖先提交以来在 `HEAD` 中所做的更改。以下是自共享提交以来在
    `NAME` 中所做的更改。
- en: '`git mergetool` is pretty handy – opens a diff editor'
  id: totrans-137
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git mergetool` 非常方便——打开一个差异编辑器'
- en: once you’ve *resolved* the conflict by figuring out what the file should now
    look like, stage those changes with `git add`.
  id: totrans-138
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 一旦你通过确定文件现在应该是什么样子来 *解决* 冲突，使用 `git add` 将这些更改暂存。
- en: when all the conflicts are resolved, finish with `git commit`
  id: totrans-139
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 当所有冲突都解决后，使用 `git commit` 完成
- en: you can give up with `git merge --abort`
  id: totrans-140
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你可以使用 `git merge --abort` 放弃合并
- en: you’ve just resolved your first git merge conflict! \o/ now you can publish
    your finished changes with `git push`
  id: totrans-141
  prefs: []
  type: TYPE_NORMAL
  zh: 你刚刚解决了你的第一个 git 合并冲突！\o/ 现在你可以使用 `git push` 发布你的最终更改
- en: When worlds collide
  id: totrans-142
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 当世界相撞时
- en: when you `push`, git checks that no-one else’s work is lost if you update the
    remote name you’re pushing too. it does this by checking that the current commit
    of the remote name is an ancestor of the commit you are pushing. if it is, git
    can safely just update the name; this is called *fast-forwarding*. if it is not,
    git will refuse to update the remote name, and tell you there have been changes.
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 当你 `push` 时，git 会检查如果你更新了你要推送的远程名称，是否没有人丢失了工作。它是通过检查远程名称的当前提交是否是你推送的提交的祖先来做到这一点的。如果是，git
    可以安全地只更新名称；这被称为 *快速前进*。如果不是，git 将拒绝更新远程名称，并告诉你有更改。
- en: if your push is rejected, what do you do?
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 如果你的推送被拒绝，你会怎么做？
- en: merge remote changes with `git pull` (i.e., `fetch` + `merge`)
  id: totrans-145
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `git pull` 合并远程更改（即，`fetch` + `merge`）
- en: 'force the push with `--force`: this will lose other people’s changes!'
  id: totrans-146
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 使用 `--force` 强制推送：这将丢失其他人的更改！
- en: there’s also `--force-with-lease`, which will only force the change if the remote
    name hasn’t changed since the last time you fetched from that remote. much safer!
  id: totrans-147
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 还有 `--force-with-lease`，这只有在远程名称自上次从该远程获取以来没有更改时才会强制更改。更安全！
- en: if you’ve rebased local commits that you’ve previously pushed (“history rewriting”;
    probably don’t do this), you’ll have to force push. think about why!
  id: totrans-148
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果你已经将之前推送的本地提交进行了变基（“历史重写”；可能不要这样做），你将不得不强制推送。想想为什么！
- en: try to re-apply your changes “on top of” the changes made remotely
  id: totrans-149
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 尝试将你的更改“叠加”在远程更改之上
- en: this is a `rebase`!
  id: totrans-150
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 这是一个 `rebase`！
- en: rewind all local commits since shared ancestor
  id: totrans-151
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 回滚自共享祖先以来的所有本地提交
- en: fast-forward `HEAD` to commit at remote name
  id: totrans-152
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 将 `HEAD` 快速前进到远程名称的提交
- en: apply local commits in-order
  id: totrans-153
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 按顺序应用本地提交
- en: may have conflicts you have to manually resolve
  id: totrans-154
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 可能会有你必须手动解决的冲突
- en: '`git rebase --continue` or `--abort`'
  id: totrans-155
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git rebase --continue` 或 `--abort`'
- en: lots more [here](https://git-scm.com/book/en/v2/Git-Branching-Rebasing)
  id: totrans-156
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 更多内容[这里](https://git-scm.com/book/en/v2/Git-Branching-Rebasing)
- en: '`git pull --rebase` will start this process for you'
  id: totrans-157
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`git pull --rebase` 会为你启动这个过程'
- en: 'whether you should merge or rebase is a hot topic! some good reads:'
  id: totrans-158
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 你是否应该合并还是变基是一个热门话题！一些好的阅读材料：
- en: '[this](https://www.atlassian.com/git/tutorials/merging-vs-rebasing)'
  id: totrans-159
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[this](https://www.atlassian.com/git/tutorials/merging-vs-rebasing)'
- en: '[this](https://web.archive.org/web/20210106220723/https://derekgourlay.com/blog/git-when-to-merge-vs-when-to-rebase/)'
  id: totrans-160
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
