- en: Web and Browsers
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://missing.csail.mit.edu/2019/web/](https://missing.csail.mit.edu/2019/web/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Apart from the terminal, the web browser is a tool you will find yourself spending
    significant amounts of time into. Thus it is worth learning how to use it efficiently
    and
  prefs: []
  type: TYPE_NORMAL
- en: Shortcuts
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Clicking around in your browser is often not the fastest option, getting familiar
    with common shortcuts can really pay off in the long run.
  prefs: []
  type: TYPE_NORMAL
- en: '`Middle Button Click` in a link opens it in a new tab'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`Ctrl+T` Opens a new tab'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`Ctrl+Shift+T` Reopens a recently closed tab'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`Ctrl+L` selects the contents of the search bar'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`Ctrl+F` to search within a webpage. If you do this often, you may benefit
    from an extension that supports regular expressions in searches.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Search operators
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Web search engines like Google or DuckDuckGo provide search operators to enable
    more elaborate web searches:'
  prefs: []
  type: TYPE_NORMAL
- en: '`"bar foo"` enforces an exact match of bar foo'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`foo site:bar.com` searches for foo within bar.com'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`foo -bar` excludes the terms containing bar from the search'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`foobar filetype:pdf` Searches for files of that extension'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`(foo|bar)` searches for matches that have foo OR bar'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: More through lists are available for popular engines like [Google](https://ahrefs.com/blog/google-advanced-search-operators/)
    and [DuckDuckGo](https://duck.co/help/results/syntax)
  prefs: []
  type: TYPE_NORMAL
- en: Searchbar
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The searchbar is a powerful tool too. Most browsers can infer search engines
    from websites and will store them. By editing the keyword argument
  prefs: []
  type: TYPE_NORMAL
- en: In Google Chrome they are in [chrome://settings/searchEngines](chrome://settings/searchEngines)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: In Firefox they are in [about:preferences#search](about:preferences#search)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: For example you can make so that `y SOME SEARCH TERMS` to directly search in
    youtube.
  prefs: []
  type: TYPE_NORMAL
- en: Moreover, if you own a domain you can setup subdomain forwards using your registrar.
    For instance I have mapped `https://ht.josejg.com` to this course website. That
    way I can just type `ht.` and the searchbar will autocomplete. Another good feature
    of this setup is that unlike bookmarks they will work in every browser.
  prefs: []
  type: TYPE_NORMAL
- en: Privacy extensions
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Nowadays surfing the web can get quite annoying due to ads and invasive due
    to trackers. Moreover a good adblocker not only blocks most ad content but it
    will also block sketchy and malicious websites since they will be included in
    the common blacklists. They will also reduce page load times sometimes by reducing
    the amount of requests performed. A couple of recommendations are:'
  prefs: []
  type: TYPE_NORMAL
- en: '**uBlock origin** ([Chrome](https://chrome.google.com/webstore/detail/ublock-origin/cjpalhdlnbpafiamejdnhcphjbkeiagm),
    [Firefox](https://addons.mozilla.org/en-US/firefox/addon/ublock-origin/)): block
    ads and trackers based on predefined rules. You should also consider taking a
    look at the enabled blacklists in settings since you can enable more based on
    your region or browsing habits. You can even install filters from [around the
    web](https://github.com/gorhill/uBlock/wiki/Filter-lists-from-around-the-web)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**[Privacy Badger](https://privacybadger.org/)**: detects and blocks trackers
    automatically. For example when you go from website to website ad companies track
    which sites you visit and build a profile of you'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**[HTTPS everywhere](https://www.eff.org/https-everywhere)** is a wonderful
    extension that redirects to HTTPS version of a website automatically, if available.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: You can find about more addons of this kind [here](https://www.privacytools.io/privacy-browser-addons/)
  prefs: []
  type: TYPE_NORMAL
- en: Style customization
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Web browsers are just another piece of software running in *your machine* and
    thus you usually have the last say about what they should display or how they
    should behave. An example of this are custom styles. Browsers determine how to
    render the style of a webpage using Cascading Style Sheets often abbreviated as
    CSS.
  prefs: []
  type: TYPE_NORMAL
- en: You can access the source code of a website by inspecting it and changing its
    contents and styles temporarily (this is also a reason why you should never trust
    webpage screenshots).
  prefs: []
  type: TYPE_NORMAL
- en: If you want to permanently tell your browser to override the style settings
    for a webpage you will need to use an extension. Our recommendation is **[Stylus](https://github.com/openstyles/stylus)**
    ([Firefox](https://addons.mozilla.org/en-US/firefox/addon/styl-us/), [Chrome](https://chrome.google.com/webstore/detail/stylus/clngdbkpkpeebahjckkjfobafhncgmne?hl=en)).
  prefs: []
  type: TYPE_NORMAL
- en: For example, we can write the following style for the class website
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: Moreover, Stylus can find styles written by other users and published in [userstyles.org](https://userstyles.org/).
    Most common websites have one or several dark theme stylesheets for instance.
    FYI, you should not use Stylish since it was shown to leak user data, more [here](https://arstechnica.com/information-technology/2018/07/stylish-extension-with-2m-downloads-banished-for-tracking-every-site-visit/)
  prefs: []
  type: TYPE_NORMAL
- en: Functionality Customization
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: In the same way that you can modify the style, you can also modify the behaviour
    of a website by writing custom javascript and them sourcing it using a web browser
    extension such as [Tampermonkey](https://tampermonkey.net/)
  prefs: []
  type: TYPE_NORMAL
- en: For example the following script enables vim-like navigation using the J and
    K keys.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: There are also script repositories such as [OpenUserJS](https://openuserjs.org/)
    and [Greasy Fork](https://greasyfork.org/en). However, be warned, installing user
    scripts from others can be very dangerous since they can pretty much do anything
    such as steal your credit card numbers. Never install a script unless you read
    the whole thing yourself, understand what it does, and are absolutely sure that
    you know it isn’t doing anything suspicious. Never install a script that contains
    minified or obfuscated code that you can’t read!
  prefs: []
  type: TYPE_NORMAL
- en: Web APIs
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'It has become more and more common for webservices to offer an application
    interface aka web API so you can interact with the services making web requests.
    A more in depth introduction to the topic can be found [here](https://developer.mozilla.org/en-US/docs/Learn/JavaScript/Client-side_web_APIs/Introduction).
    There are [many public APIs](https://github.com/toddmotto/public-apis). Web APIs
    can be useful for very many reasons:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Retrieval**. Web APIs can quite easily provide you information such as maps,
    weather or what your public ip address. For instance `curl ipinfo.io` will return
    a JSON object with some details about your public ip, region, location, &c. With
    proper parsing these tools can be integrated even with command line tools. The
    following bash functions talks to Googles autocompletion API and returns the first
    ten matches.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: '**Interaction**. Web API endpoints can also be used to trigger actions. These
    usually require some sort of authentication token that you can obtain through
    the service. For example performing the following `curl -X POST -H ''Content-type:
    application/json'' --data ''{"text":"Hello, World!"}'' "https://hooks.slack.com/services/$SLACK_TOKEN"`
    will send a `Hello, World!` message in a channel.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Piping**. Since some services with web APIs are rather popular, common web
    API “gluing” has already been implemented and is provided with server included.
    This is the case for services like [If This Then That](https://ifttt.com/) and
    [Zapier](https://zapier.com/)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Web Automation
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Sometimes web APIs are not enough. If only reading is needed you can use a html
    parser like `pup` or use a library, for example python has BeautifulSoup. However
    if interactivity or javascript execution is required those solutions fall short.
    WebDriver
  prefs: []
  type: TYPE_NORMAL
- en: For example, the following script will save the specified url using the wayback
    machine simulating the interaction of typing the website.
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: Exercises
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Edit a keyword search engine that you use often in your web browser
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Install the mentioned extensions. Look into how uBlock Origin/Privacy Badger
    can be disabled for a website. What differences do you see? Try doing it in a
    website with plenty of ads like YouTube.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Install Stylus and write a custom style for the class website using the CSS
    provided. Here are some common programming characters `= == === >= => ++ /= ~=`.
    What happens to them when changing the font to Fira Code? If you want to know
    more search for programming font ligatures.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Find a web api to get the weather in your city/area.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Use a WebDriver software like [Selenium](https://www.selenium.dev/documentation/)
    to automate some repetitive manual task that you perform often with your browser.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
