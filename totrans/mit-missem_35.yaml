- en: Debugging and Profiling
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: 原文：[https://missing.csail.mit.edu/2026/debugging-profiling/](https://missing.csail.mit.edu/2026/debugging-profiling/)
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'A golden rule in programming is that code does not do what you expect it to
    do, but what you tell it to do. Bridging that gap can sometimes be a quite difficult
    feat. In this lecture we are going to cover useful techniques for dealing with
    buggy and resource hungry code: debugging and profiling.'
  prefs: []
  type: TYPE_NORMAL
- en: Debugging
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Printf Debugging and Logging
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: “The most effective debugging tool is still careful thought, coupled with judiciously
    placed print statements” — Brian Kernighan, *Unix for Beginners*.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: A first approach to debug a program is to add print statements around where
    you have detected the problem, and keep iterating until you have extracted enough
    information to understand what is responsible for the issue.
  prefs: []
  type: TYPE_NORMAL
- en: 'A second approach is to use logging in your program, instead of ad hoc print
    statements. Logging is essentially “printing with more care”, and is usually done
    through a logging framework that includes built-in support for things like:'
  prefs: []
  type: TYPE_NORMAL
- en: the ability to direct the logs (or subsets of the logs) to other output locations;
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: setting severity levels (such as INFO, DEBUG, WARN, ERROR, etc.) and allow you
    to filter the output according to those; and
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: support for structured logging of data related to the log entries, which can
    then be extracted more easily after the fact.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Logging statements you’ll also usually proactively put in while programming
    so that the data you need to debug may already be there! And indeed, once you’ve
    found and fixed a problem using print statements, it’s often worthwhile to convert
    those prints into proper log statements before removing them. This way, if similar
    bugs occur in the future, you’ll already have the diagnostic information you need
    without modifying the code.
  prefs: []
  type: TYPE_NORMAL
- en: '**Third-party logs**: Many programs support the `-v` or `--verbose` flag to
    print more information when they run. This can be useful for discovering why a
    given command fails. Some even allow repeating the flag for more details. When
    debugging issues with services (databases, web servers, etc.), check their logs—often
    in `/var/log/` on Linux. Use `journalctl -u <service>` to view logs for systemd
    services. For third-party libraries, check if they support debug logging via environment
    variables or configuration.'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Debuggers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Print debugging works well when you know what to print and can easily modify
    and re-run your code. Debuggers become valuable when you’re not sure what information
    you need, when the bug only manifests in hard-to-reproduce conditions, or when
    modifying and restarting the program is expensive (long startup times, complex
    state to recreate, etc.).
  prefs: []
  type: TYPE_NORMAL
- en: 'Debuggers are programs that let you interact with the execution of a program
    as it happens, allowing you to:'
  prefs: []
  type: TYPE_NORMAL
- en: Halt execution when it reaches a certain line.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Step through one instruction at a time.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Inspect values of variables after a crash.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Conditionally halt execution when a given condition is met.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: And many more advanced features.
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Most programming languages support (or come with) some form of debugger. The
    most versatile are **general-purpose debuggers** like [`gdb`](https://www.gnu.org/software/gdb/)
    (GNU Debugger) and [`lldb`](https://lldb.llvm.org/) (LLVM Debugger), which can
    debug any native binary. Many languages also have **language-specific debuggers**
    that integrate more tightly with the runtime (like Python’s pdb or Java’s jdb).
  prefs: []
  type: TYPE_NORMAL
- en: '`gdb` is the de-facto standard debugger for C, C++, Rust, and other compiled
    languages. It lets you probe pretty much any process and get its current machine
    state: registers, stack, program counter, and more.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Some useful GDB commands:'
  prefs: []
  type: TYPE_NORMAL
- en: '`run` - Start the program'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`b {function}` or `b {file}:{line}` - Set a breakpoint'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`c` - Continue execution'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`step` / `next` / `finish` - Step in / step over / step out'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`p {variable}` - Print value of variable'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`bt` - Show backtrace (call stack)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`watch {expression}` - Break when the value changes'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Consider using GDB’s TUI mode (`gdb -tui` or press `Ctrl-x a` inside GDB) for
    a split-screen view showing source code alongside the command prompt.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Record-Replay Debugging
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'Some of the most frustrating bugs are *Heisenbugs*: bugs that seem to disappear
    or change behavior when you try to observe them. Race conditions, timing-dependent
    bugs, and issues that only appear under certain system conditions fall into this
    category. Traditional debugging is often useless here because running the program
    again produces different behavior (e.g., print statements may slow down the code
    sufficiently that the race no longer happens).'
  prefs: []
  type: TYPE_NORMAL
- en: '**Record-replay debugging** solves this by recording a program’s execution
    and allowing you to replay it deterministically as many times as you need. Even
    better, you can *reverse* through the execution to find exactly where things went
    wrong.'
  prefs: []
  type: TYPE_NORMAL
- en: '[rr](https://rr-project.org/) is a powerful tool for Linux that records program
    execution and allows deterministic replay with full debugging capabilities. It
    works with GDB, so you already know the interface.'
  prefs: []
  type: TYPE_NORMAL
- en: 'Basic usage:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE0]'
  prefs: []
  type: TYPE_PRE
- en: 'The magic happens during replay. Because the execution is deterministic, you
    can use **reverse debugging** commands:'
  prefs: []
  type: TYPE_NORMAL
- en: '`reverse-continue` (`rc`) - Run backwards until hitting a breakpoint'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`reverse-step` (`rs`) - Step backwards one line'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`reverse-next` (`rn`) - Step backwards, skipping function calls'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '`reverse-finish` - Run backwards until entering the current function'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'This is incredibly powerful for debugging. Say you have a crash—instead of
    guessing where the bug is and setting breakpoints, you can:'
  prefs: []
  type: TYPE_NORMAL
- en: Run to the crash
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Inspect the corrupted state
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Set a watchpoint on the corrupted variable
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '`reverse-continue` to find exactly where it was corrupted'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '**When to use rr:**'
  prefs: []
  type: TYPE_NORMAL
- en: Flaky tests that fail intermittently
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Race conditions and threading bugs
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Crashes that are hard to reproduce
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Any bug where you wish you could “go back in time”
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: 'Note: rr only works on Linux and requires hardware performance counters. It
    doesn’t work in VMs that don’t expose these counters, such as on most AWS EC2
    instances, and it doesn’t support GPU access. For macOS, check out [Warpspeed](https://warpspeed.dev/).'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '**rr and concurrency**: Because rr records execution deterministically, it
    serializes thread scheduling. This means some race conditions may not manifest
    under rr if they depend on specific timing. rr is still useful for debugging races—once
    you capture a failing run, you can replay it reliably—but you may need multiple
    recording attempts to catch an intermittent bug. For bugs that don’t involve concurrency,
    rr shines brightest: you can always reproduce the exact execution and use reverse
    debugging to hunt down corruption.'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: System Call Tracing
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Sometimes you need to understand how your program interacts with the operating
    system. Programs make [system calls](https://en.wikipedia.org/wiki/System_call)
    to request services from the kernel—opening files, allocating memory, creating
    processes, and more. Tracing these calls can reveal why a program is hanging,
    what files it’s trying to access, or where it’s spending time waiting.
  prefs: []
  type: TYPE_NORMAL
- en: strace (Linux) and dtruss (macOS)
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[`strace`](https://www.man7.org/linux/man-pages/man1/strace.1.html) lets you
    observe every system call a program makes:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE1]'
  prefs: []
  type: TYPE_PRE
- en: 'On macOS and BSD, use [`dtruss`](https://www.manpagez.com/man/1/dtruss/) (which
    wraps `dtrace`) for similar functionality:'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: For deeper dives into `strace`, check out Julia Evans’ excellent [strace zine](https://jvns.ca/strace-zine-unfolded.pdf).
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: bpftrace and eBPF
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[eBPF](https://ebpf.io/) (extended Berkeley Packet Filter) is a powerful Linux
    technology that allows running sandboxed programs in the kernel. [`bpftrace`](https://github.com/iovisor/bpftrace)
    provides a high-level syntax for writing eBPF programs. These are arbitrary programs
    running in the kernel, and thus have huge expressive power (though also a somewhat
    clumsy awk-like syntax). The most common use-case for them is to investigate what
    system calls are being invoked, including aggregations (like counts or latency
    statistics) or introspecting (or even filtering on) system call arguments.'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE2]'
  prefs: []
  type: TYPE_PRE
- en: However, you can also write eBPF programs directly in C using a toolchain like
    [`bcc`](https://github.com/iovisor/bcc), which also ships with [many handy tools](https://www.brendangregg.com/blog/2015-09-22/bcc-linux-4.3-tracing.html)
    like `biosnoop` for printing latency distributions for disk operations or `opensnoop`
    for printing all open files.
  prefs: []
  type: TYPE_NORMAL
- en: 'Where `strace` is useful because it’s easy to “just get up and running”, `bpftrace`
    is what you should reach for when you need lower overhead, want to trace through
    kernel functions, need to do any kind of aggregation, etc. Note that `bpftrace`
    has to run as `root` though, and that it generally monitors the entire kernel,
    not just a particular process. To target a specific program, you can filter by
    command name or PID:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE3]'
  prefs: []
  type: TYPE_PRE
- en: The `-c` flag runs the specified command and sets `cpid` to its PID, which is
    useful for tracing a program from the moment it starts. When the traced command
    exits, bpftrace prints the aggregated results.
  prefs: []
  type: TYPE_NORMAL
- en: Network Debugging
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'For network issues, [`tcpdump`](https://www.man7.org/linux/man-pages/man1/tcpdump.1.html)
    and [Wireshark](https://www.wireshark.org/) let you capture and analyze network
    packets:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE4]'
  prefs: []
  type: TYPE_PRE
- en: For HTTPS traffic, the encryption makes tcpdump less useful. Tools like [mitmproxy](https://mitmproxy.org/)
    can act as an intercepting proxy to inspect encrypted traffic. Browser developer
    tools (Network tab) are often the easiest way to debug HTTPS requests from web
    applications—they show decrypted request/response data, headers, and timing.
  prefs: []
  type: TYPE_NORMAL
- en: Memory Debugging
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Memory bugs—buffer overflows, use-after-free, memory leaks—are among the most
    dangerous and difficult to debug. They often don’t crash immediately but corrupt
    memory in ways that cause problems much later.
  prefs: []
  type: TYPE_NORMAL
- en: Sanitizers
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: 'One approach to finding memory bugs is to use **sanitizers**, which are compiler
    features that instrument your code to detect errors at runtime. For example, the
    widely used **AddressSanitizer (ASan)** detects:'
  prefs: []
  type: TYPE_NORMAL
- en: Buffer overflows (stack, heap, and global)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Use-after-free
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Use-after-return
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Memory leaks
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[PRE5]'
  prefs: []
  type: TYPE_PRE
- en: 'There are a variety of useful sanitizers:'
  prefs: []
  type: TYPE_NORMAL
- en: '**ThreadSanitizer (TSan)**: Detects data races in multithreaded code (`-fsanitize=thread`)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**MemorySanitizer (MSan)**: Detects reads of uninitialized memory (`-fsanitize=memory`)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**UndefinedBehaviorSanitizer (UBSan)**: Detects undefined behavior like integer
    overflow (`-fsanitize=undefined`)'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Sanitizers require recompilation but are fast enough to use in CI pipelines
    and during regular development.
  prefs: []
  type: TYPE_NORMAL
- en: 'Valgrind: When You Can’t Recompile'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[Valgrind](https://valgrind.org/) instead runs your program in something akin
    to a virtual machine to detect memory errors. It’s slower than sanitizers but
    doesn’t require recompilation:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE6]'
  prefs: []
  type: TYPE_PRE
- en: 'Use Valgrind when:'
  prefs: []
  type: TYPE_NORMAL
- en: You don’t have source code
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: You can’t recompile (third-party libraries)
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: You need specific tools not available as sanitizers
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Valgrind is actually a really powerful controlled execution environment, and
    we’ll see more of it later when we get to profiling!
  prefs: []
  type: TYPE_NORMAL
- en: AI for Debugging
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Large language models have become surprisingly useful debugging assistants.
    They excel at certain debugging tasks that complement traditional tools.
  prefs: []
  type: TYPE_NORMAL
- en: '**Where LLMs shine:**'
  prefs: []
  type: TYPE_NORMAL
- en: '**Explaining cryptic error messages**: Compiler errors, especially from C++
    templates or Rust’s borrow checker, can be notoriously cryptic. LLMs can translate
    them into plain English and suggest fixes.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Traversing language and abstraction boundaries**: If you’re debugging a problem
    that spans multiple languages (say, a bug in a C library that manifests through
    a Python binding), LLMs can help navigate the different layers. They’re particularly
    good at understanding FFI boundaries, build system issues, and cross-language
    debugging (e.g., my program errors, but I believe it is because of a bug in one
    of my dependencies).'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Correlating symptoms with root causes**: “My program works fine but uses
    10x more memory than expected” is the kind of vague symptom that LLMs can help
    investigate, suggesting likely causes and what to look for.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Analyzing crash dumps and stack traces**: Paste a stack trace and ask what
    might have caused it.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Note on debug symbols**: For meaningful stack traces and debugging, ensure
    your binaries (and any linked libraries) are compiled with debug symbols (`-g`
    flag). Debug information is typically stored in DWARF format. Additionally, compiling
    with frame pointers (`-fno-omit-frame-pointer`) makes stack traces more reliable,
    especially for profiling tools. Without these, stack traces may show only memory
    addresses or be incomplete. This matters more for natively compiled programs (C++,
    Rust) than Python or Java.'
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: '**Limitations to keep in mind:**'
  prefs: []
  type: TYPE_NORMAL
- en: LLMs can hallucinate plausible-sounding but wrong explanations
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: They may suggest fixes that mask the bug rather than fix it
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Always verify suggestions with actual debugging tools
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: They work best as a complement to, not replacement for, understanding your code
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: This is distinct from the [general AI coding capabilities](/2026/development-environment/#ai-powered-development)
    covered in the Development Environment lecture. Here we’re specifically talking
    about using LLMs as a debugging aid.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Profiling
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Even if your code functionally behaves as you would expect, that might not be
    good enough if it takes all your CPU or memory in the process. Algorithms classes
    often teach big *O* notation but not how to find hot spots in your programs. Since
    [premature optimization is the root of all evil](https://wiki.c2.com/?PrematureOptimization),
    you should learn about profilers and monitoring tools. They will help you understand
    which parts of your program are taking most of the time and/or resources so you
    can focus on optimizing those parts.
  prefs: []
  type: TYPE_NORMAL
- en: Timing
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: The simplest way to measure performance is to time things. In many scenarios
    it can be enough to just print the time it took your code between two points.
  prefs: []
  type: TYPE_NORMAL
- en: 'However, wall clock time can be misleading since your computer might be running
    other processes at the same time or waiting for events to happen. The `time` command
    distinguishes between *Real*, *User*, and *Sys* time:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Real** - Wall clock time from start to finish, including time spent waiting'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**User** - Time spent in the CPU running user code'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Sys** - Time spent in the CPU running kernel code'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '[PRE7]'
  prefs: []
  type: TYPE_PRE
- en: Here the request took nearly 300 milliseconds (real time) but only 107ms of
    CPU time (user + sys). The rest was waiting for the network.
  prefs: []
  type: TYPE_NORMAL
- en: Resource Monitoring
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Sometimes the first step towards analyzing the performance of your program is
    to understand what its actual resource consumption is. Programs often run slowly
    when they are resource constrained.
  prefs: []
  type: TYPE_NORMAL
- en: '**General Monitoring**: [`htop`](https://htop.dev/) is an improved version
    of `top` that presents various statistics for currently running processes. Useful
    keybinds: `<F6>` to sort processes, `t` to show tree hierarchy, `h` to toggle
    threads. There’s also [`btop`](https://github.com/aristocratos/btop) which monitors
    *way* more things.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**I/O Operations**: [`iotop`](https://www.man7.org/linux/man-pages/man8/iotop.8.html)
    displays live I/O usage information.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Memory Usage**: [`free`](https://www.man7.org/linux/man-pages/man1/free.1.html)
    displays total free and used memory.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Open Files**: [`lsof`](https://www.man7.org/linux/man-pages/man8/lsof.8.html)
    lists file information about files opened by processes. Useful for checking which
    process has opened a specific file.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Network Connections**: [`ss`](https://www.man7.org/linux/man-pages/man8/ss.8.html)
    lets you monitor network connections. A common use case is figuring out what process
    is using a given port: `ss -tlnp | grep :8080`.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Network Usage**: [`nethogs`](https://github.com/raboof/nethogs) and [`iftop`](https://pdw.ex-parrot.com/iftop/)
    are good interactive CLI tools for monitoring network usage per process.'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Visualizing Performance Data
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Humans spot patterns in graphs much faster than in tables of numbers. When analyzing
    performance, plotting your data often reveals trends, spikes, and anomalies that
    would be invisible in raw numbers.
  prefs: []
  type: TYPE_NORMAL
- en: '**Making data plottable**: When adding print or log statements for debugging,
    consider formatting the output so it can be easily graphed later. A simple timestamp
    and value in CSV format (`1705012345,42.5`) is much easier to plot than a prose
    sentence. JSON-structured logs can also be parsed and plotted with minimal effort.
    In other words, log your data [in a tidy way](https://vita.had.co.nz/papers/tidy-data.pdf).'
  prefs: []
  type: TYPE_NORMAL
- en: '**Quick plotting with gnuplot**: For simple command-line plotting, [`gnuplot`](http://www.gnuplot.info/)
    can generate graphs directly from data files:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE8]'
  prefs: []
  type: TYPE_PRE
- en: '**Iterative exploration with matplotlib and ggplot2**: For deeper analysis,
    Python’s [`matplotlib`](https://matplotlib.org/) and R’s [`ggplot2`](https://ggplot2.tidyverse.org/)
    enable iterative exploration. Unlike one-off plotting, these tools let you quickly
    slice and transform data to investigate hypotheses. ggplot2’s facet plots are
    particularly powerful—you can split a single dataset across multiple subplots
    by category (e.g., faceting request latency by endpoint or time-of-day) to tease
    out patterns that would otherwise be hidden.'
  prefs: []
  type: TYPE_NORMAL
- en: '**Example use cases:**'
  prefs: []
  type: TYPE_NORMAL
- en: Plotting request latency over time reveals periodic slowdowns (garbage collection,
    cron jobs, traffic patterns) that raw percentiles obscure
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Visualizing insert times for a growing data structure can expose algorithmic
    complexity issues—a plot of vector insertions will show characteristic spikes
    when the backing array doubles in size
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Faceting metrics by different dimensions (request type, user cohort, server)
    often reveals that a “system-wide” problem is actually isolated to one category
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: CPU Profilers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'Most of the time when people refer to *profilers* they mean *CPU profilers*.
    There are two main types:'
  prefs: []
  type: TYPE_NORMAL
- en: '**Tracing profilers** keep a record of every function call your program makes'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: '**Sampling profilers** probe your program periodically (commonly every millisecond)
    and record the program’s stack'
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
- en: Sampling profilers have lower overhead and are generally preferred for production
    use.
  prefs: []
  type: TYPE_NORMAL
- en: 'perf: the sampling profiler'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[`perf`](https://www.man7.org/linux/man-pages/man1/perf.1.html) is the standard
    Linux profiler. It can profile any program without recompilation:'
  prefs: []
  type: TYPE_NORMAL
- en: '`perf stat` gives you a quick overview of where time is spent:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE9]'
  prefs: []
  type: TYPE_PRE
- en: Profiler output for real world programs will contain large amounts of information.
    Humans are visual creatures and are quite terrible at reading large amounts of
    numbers. [Flame graphs](https://www.brendangregg.com/flamegraphs.html) are a visualization
    that makes profiling data much easier to understand.
  prefs: []
  type: TYPE_NORMAL
- en: A flame graph displays a hierarchy of function calls across the Y axis and time
    taken proportional to the X axis. They’re interactive—you can click to zoom into
    specific parts of the program.
  prefs: []
  type: TYPE_NORMAL
- en: '[![FlameGraph](../Images/88a3605124bd211984699cbd067c86bc.png)](https://www.brendangregg.com/FlameGraphs/cpu-bash-flamegraph.svg)'
  prefs: []
  type: TYPE_NORMAL
- en: 'To generate a flame graph from `perf` data:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE10]'
  prefs: []
  type: TYPE_PRE
- en: Consider using [Speedscope](https://www.speedscope.app/) for an interactive
    web-based flame graph viewer, or [Perfetto](https://perfetto.dev/) for comprehensive
    system-level analysis.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: 'Valgrind’s Callgrind: the tracing profiler'
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[`callgrind`](https://valgrind.org/docs/manual/cl-manual.html) is a profiling
    tool that records the call history and instruction counts of your program. Unlike
    sampling profilers, it provides exact call counts and can show the relationship
    between callers and callees:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE11]'
  prefs: []
  type: TYPE_PRE
- en: Callgrind is slower than sampling profilers but provides precise call counts
    and can optionally simulate cache behavior (with `--cache-sim=yes`) if you need
    that information.
  prefs: []
  type: TYPE_NORMAL
- en: If you’re using a particular language, there may be more specialized profilers.
    For example, Python has [`cProfile`](https://docs.python.org/3/library/profile.html)
    and [`py-spy`](https://github.com/benfred/py-spy), Go has [`go tool pprof`](https://pkg.go.dev/cmd/pprof),
    and Rust has [`cargo-flamegraph`](https://github.com/flamegraph-rs/flamegraph)
    (which actually works for any compiled program!).
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Memory Profilers
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Memory profilers help you understand how your program uses memory over time
    and find memory leaks.
  prefs: []
  type: TYPE_NORMAL
- en: Valgrind’s Massif
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
- en: '[`massif`](https://valgrind.org/docs/manual/ms-manual.html) profiles heap memory
    usage:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE12]'
  prefs: []
  type: TYPE_PRE
- en: This shows you heap usage over time, helping identify memory leaks and excessive
    allocation.
  prefs: []
  type: TYPE_NORMAL
- en: For Python, [`memory-profiler`](https://pypi.org/project/memory-profiler/) provides
    line-by-line memory usage information.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Benchmarking
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: 'When you need to compare the performance of different implementations or tools,
    [`hyperfine`](https://github.com/sharkdp/hyperfine) is excellent for benchmarking
    command-line programs:'
  prefs: []
  type: TYPE_NORMAL
- en: '[PRE13]'
  prefs: []
  type: TYPE_PRE
- en: For web development, browser developer tools include excellent profilers. See
    the [Firefox Profiler](https://profiler.firefox.com/docs/) and [Chrome DevTools](https://developers.google.com/web/tools/chrome-devtools/rendering-tools)
    documentation.
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
- en: Exercises
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
- en: Debugging
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: '**Debug a sorting algorithm**: The following pseudocode implements merge sort
    but contains a bug. Implement it in a language of your choice, then use a debugger
    (gdb, lldb, pdb, or your IDE’s debugger) to find and fix the bug.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE14]'
  prefs:
  - PREF_IND
  type: TYPE_PRE
- en: 'Test vector: `merge_sort([3, 1, 4, 1, 5, 9, 2, 6])` should return `[1, 1, 2,
    3, 4, 5, 6, 9]`. Use breakpoints and step through the merge function to find where
    the incorrect element is being selected.'
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: 'Install [`rr`](https://rr-project.org/) and use reverse debugging to find a
    corruption bug. Save this program as `corruption.c`:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE15]'
  prefs:
  - PREF_IND
  type: TYPE_PRE
- en: Compile with `gcc -g corruption.c -o corruption` and run it. Student 1’s ID
    gets corrupted, but the corruption happens in a function that only touches student
    0\. Use `rr record ./corruption` and `rr replay` to find the culprit. Set a watchpoint
    on `students[1].id` and use `reverse-continue` after the corruption to find exactly
    which line of code overwrote it.
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: 'Debug a memory error with AddressSanitizer. Save this as `uaf.c`:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE16]'
  prefs:
  - PREF_IND
  type: TYPE_PRE
- en: 'First compile and run without sanitizers: `gcc uaf.c -o uaf && ./uaf`. It may
    appear to work. Now compile with AddressSanitizer: `gcc -fsanitize=address -g
    uaf.c -o uaf && ./uaf`. Read the error report. What bug does ASan find? Fix the
    issue it identifies.'
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: Use `strace` (Linux) or `dtruss` (macOS) to trace the system calls made by a
    command like `ls -l`. What system calls is it making? Try tracing a more complex
    program and see what files it opens.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Use an LLM to help debug a cryptic error message. Try copying a compiler error
    (especially from C++ templates or Rust) and asking for an explanation and fix.
    Try putting some of the output from `strace` or the address sanitizer into it.
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: Profiling
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
- en: Use `perf stat` to get basic performance statistics for a program of your choice.
    What do the different counters mean?
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Profile with `perf record`. Save this as `slow.c`:'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '[PRE17]'
  prefs:
  - PREF_IND
  type: TYPE_PRE
- en: 'Compile with debug symbols: `gcc -g -O2 slow.c -o slow -lm`. Run `perf record
    -g ./slow`, then `perf report` to see where time is spent. Try generating a flame
    graph using the flamegraph scripts.'
  prefs:
  - PREF_IND
  type: TYPE_NORMAL
- en: Use `hyperfine` to benchmark two different implementations of the same task
    (e.g., `find` vs `fd`, `grep` vs `ripgrep`, or two versions of your own code).
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'Use `htop` to monitor your system while running a resource-intensive program.
    Try using `taskset` to limit which CPUs a process can use: `taskset --cpu-list
    0,2 stress -c 3`. Why doesn’t `stress` use three CPUs?'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: 'A common issue is that a port you want to listen on is already taken by another
    process. Learn how to discover that process: First execute `python -m http.server
    4444` to start a minimal web server on port 4444\. On a separate terminal run
    `ss -tlnp | grep 4444` to find the process. Terminate it with `kill <PID>`.'
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
- en: '* * *'
  prefs: []
  type: TYPE_NORMAL
