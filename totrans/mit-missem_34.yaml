- en: Development Environment and Tools
  id: totrans-0
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 开发环境和工具
- en: 原文：[https://missing.csail.mit.edu/2026/development-environment/](https://missing.csail.mit.edu/2026/development-environment/)
  id: totrans-1
  prefs:
  - PREF_BQ
  type: TYPE_NORMAL
  zh: 原文：[https://missing.csail.mit.edu/2026/development-environment/](https://missing.csail.mit.edu/2026/development-environment/)
- en: A *development environment* is a set of tools for developing software. At the
    heart of a development environment is text editing functionality, along with accompanying
    features such as syntax highlighting, type checking, code formatting, and autocomplete.
    *Integrated development environments* (IDEs) such as [VS Code](https://code.visualstudio.com/)
    bring together all of this functionality into a single application. Terminal-based
    development workflows combine tools such as [tmux](https://github.com/tmux/tmux)
    (a terminal multiplexer), [Vim](https://www.vim.org/) (a text editor), [Zsh](https://www.zsh.org/)
    (a shell), and language-specific command-line tools, such as [Ruff](https://docs.astral.sh/ruff/)
    (a Python linter and code formatter) and [Mypy](https://mypy-lang.org/) (a Python
    type checker).
  id: totrans-2
  prefs: []
  type: TYPE_NORMAL
  zh: '**开发环境**是一套用于开发软件的工具。开发环境的核心是文本编辑功能，以及伴随的功能，如语法高亮、类型检查、代码格式化和自动完成。*集成开发环境*（IDE）如[VS
    Code](https://code.visualstudio.com/)将所有这些功能集成到一个单一的应用程序中。基于终端的开发工作流程结合了诸如[tmux](https://github.com/tmux/tmux)（一个终端多路复用器）、[Vim](https://www.vim.org/)（一个文本编辑器）、[Zsh](https://www.zsh.org/)（一个shell）以及特定语言的命令行工具，如[Ruff](https://docs.astral.sh/ruff/)（一个Python代码检查器和代码格式化工具）和[Mypy](https://mypy-lang.org/)（一个Python类型检查器）。'
- en: IDEs and terminal-based workflows each have their strengths and weaknesses.
    For example, graphical IDEs can be easier to learn, and today’s IDEs generally
    have better out-of-the-box AI integrations like AI autocomplete; on the other
    hand, terminal-based workflows are lightweight, and they may be your only option
    in environments where you don’t have a GUI or can’t install software. We recommend
    you develop basic familiarity with both and develop mastery of at least one. If
    you don’t already have a preferred IDE, we recommend starting with [VS Code](https://code.visualstudio.com/).
  id: totrans-3
  prefs: []
  type: TYPE_NORMAL
  zh: IDE和基于终端的工作流程各有其优势和劣势。例如，图形IDE可能更容易学习，并且今天的IDE通常具有更好的开箱即用的AI集成，如AI自动完成；另一方面，基于终端的工作流程轻量级，在您没有GUI或无法安装软件的环境中，它们可能是您的唯一选择。我们建议您对两者都建立基本熟悉度，并至少精通其中一个。如果您还没有首选的IDE，我们建议从[VS
    Code](https://code.visualstudio.com/)开始。
- en: 'In this lecture, we’ll cover:'
  id: totrans-4
  prefs: []
  type: TYPE_NORMAL
  zh: 在本讲座中，我们将涵盖：
- en: '[Text editing and Vim](#text-editing-and-vim)'
  id: totrans-5
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[文本编辑和Vim](#text-editing-and-vim)'
- en: '[Code intelligence and language servers](#code-intelligence-and-language-servers)'
  id: totrans-6
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[代码智能和语言服务器](#code-intelligence-and-language-servers)'
- en: '[AI-powered development](#ai-powered-development)'
  id: totrans-7
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[AI驱动的开发](#ai-powered-development)'
- en: '[Extensions and other IDE functionality](#extensions-and-other-ide-functionality)'
  id: totrans-8
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[扩展和其他IDE功能](#extensions-and-other-ide-functionality)'
- en: Text editing and Vim
  id: totrans-9
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 文本编辑和Vim
- en: When programming, you spend most of your time navigating through code, reading
    snippets of code, and making edits to code, rather than writing long streams or
    reading files top-to-bottom. [Vim](https://www.vim.org/) is a text editor that
    is optimized for this distribution of tasks.
  id: totrans-10
  prefs: []
  type: TYPE_NORMAL
  zh: 在编程时，你大部分时间都在通过代码导航、阅读代码片段和编辑代码，而不是编写长串的代码或从头到尾阅读文件。[Vim](https://www.vim.org/)是一个针对这种任务分布优化的文本编辑器。
- en: '**The philosophy of Vim.** Vim has a beautiful idea as its foundation: its
    interface is itself a programming language, designed for navigating and editing
    text. Keystrokes (with mnemonic names) are commands, and these commands are composable.
    Vim avoids the use of the mouse, because it’s too slow; Vim even avoids use of
    the arrow keys because it requires too much movement. The result: an editor that
    feels like a brain-computer interface and matches the speed at which you think.'
  id: totrans-11
  prefs: []
  type: TYPE_NORMAL
  zh: '**Vim的哲学**。Vim以其美丽的基础理念为基石：其界面本身就是一种编程语言，旨在导航和编辑文本。按键（带有助记名称）是命令，这些命令是可组合的。Vim避免使用鼠标，因为它太慢；Vim甚至避免使用箭头键，因为它需要太多的移动。结果是：一个感觉像大脑-计算机接口的编辑器，并且与你的思考速度相匹配。'
- en: '**Vim support in other software.** You don’t have to use [Vim](https://www.vim.org/)
    itself to benefit from the ideas at its core. Many programs that involve any kind
    of text editing support “Vim mode”, either as built-in functionality or as a plugin.
    For example, VS Code has the [VSCodeVim](https://marketplace.visualstudio.com/items?itemName=vscodevim.vim)
    plugin, Zsh has [built-in support](https://zsh.sourceforge.io/Guide/zshguide04.html)
    for Vim emulation, and even Claude Code has [built-in support](https://code.claude.com/docs/en/interactive-mode#vim-editor-mode)
    for Vim editor mode. Chances are that any tool you use that involves text editing
    supports Vim mode in one way or another.'
  id: totrans-12
  prefs: []
  type: TYPE_NORMAL
  zh: '**Vim 在其他软件中的支持**。你不必使用 [Vim](https://www.vim.org/) 本身来受益于其核心思想。许多涉及任何类型文本编辑的程序都支持“Vim
    模式”，无论是作为内置功能还是作为插件。例如，VS Code 有 [VSCodeVim](https://marketplace.visualstudio.com/items?itemName=vscodevim.vim)
    插件，Zsh 有 [内置支持](https://zsh.sourceforge.io/Guide/zshguide04.html) 用于 Vim 模拟，甚至
    Claude Code 也 [内置支持](https://code.claude.com/docs/en/interactive-mode#vim-editor-mode)
    Vim 编辑器模式。很可能你使用的任何涉及文本编辑的工具都以某种方式支持 Vim 模式。'
- en: Modal editing
  id: totrans-13
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 模式编辑
- en: 'Vim is a *modal editor*: it has different operating modes for different classes
    of tasks.'
  id: totrans-14
  prefs: []
  type: TYPE_NORMAL
  zh: Vim 是一个 *模式编辑器*：它针对不同类别的任务有不同的操作模式。
- en: '**Normal**: for moving around a file and making edits'
  id: totrans-15
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**正常**：用于在文件中移动和编辑'
- en: '**Insert**: for inserting text'
  id: totrans-16
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**插入**：用于插入文本'
- en: '**Replace**: for replacing text'
  id: totrans-17
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**替换**：用于替换文本'
- en: '**Visual** (plain, line, or block): for selecting blocks of text'
  id: totrans-18
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**视觉**（平面、行或块）：用于选择文本块'
- en: '**Command-line**: for running a command'
  id: totrans-19
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**命令行**：用于运行命令'
- en: Keystrokes have different meanings in different operating modes. For example,
    the letter `x` in Insert mode will just insert a literal character “x”, but in
    Normal mode, it will delete the character under the cursor, and in Visual mode,
    it will delete the selection.
  id: totrans-20
  prefs: []
  type: TYPE_NORMAL
  zh: 在不同的操作模式下，按键有不同的含义。例如，在插入模式下，字母 `x` 仅插入字符“x”，但在正常模式下，它将删除光标下的字符，在视觉模式下，它将删除选定的文本。
- en: In its default configuration, Vim shows the current mode in the bottom left.
    The initial/default mode is Normal mode. You’ll generally spend most of your time
    between Normal mode and Insert mode.
  id: totrans-21
  prefs: []
  type: TYPE_NORMAL
  zh: 在默认配置下，Vim 在左下角显示当前模式。初始/默认模式是正常模式。你通常会花费大部分时间在正常模式和插入模式之间。
- en: You change modes by pressing `<ESC>` (the escape key) to switch from any mode
    back to Normal mode. From Normal mode, enter Insert mode with `i`, Replace mode
    with `R`, Visual mode with `v`, Visual Line mode with `V`, Visual Block mode with
    `<C-v>` (Ctrl-V, sometimes also written `^V`), and Command-line mode with `:`.
  id: totrans-22
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以通过按 `<ESC>`（退格键）从任何模式切换回正常模式来更改模式。从正常模式，使用 `i` 进入插入模式，使用 `R` 进入替换模式，使用 `v`
    进入视觉模式，使用 `V` 进入视觉行模式，使用 `<C-v>`（Ctrl-V，有时也写作 `^V`）进入视觉块模式，使用 `:` 进入命令行模式。
- en: 'You use the `<ESC>` key a lot when using Vim: consider remapping Caps Lock
    to Escape ([macOS instructions](https://vim.fandom.com/wiki/Map_caps_lock_to_escape_in_macOS))
    or create an [alternative mapping](https://vim.fandom.com/wiki/Avoid_the_escape_key#Mappings)
    for `<ESC>` with a simple key sequence.'
  id: totrans-23
  prefs: []
  type: TYPE_NORMAL
  zh: 使用 Vim 时，你会经常使用 `<ESC>` 键：考虑将 Caps Lock 映射到 Escape ([macOS 指令](https://vim.fandom.com/wiki/Map_caps_lock_to_escape_in_macOS))
    或创建一个 [替代映射](https://vim.fandom.com/wiki/Avoid_the_escape_key#Mappings) 以简单的键序列来映射
    `<ESC>`。
- en: 'Basics: inserting text'
  id: totrans-24
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 基础：插入文本
- en: From Normal mode, press `i` to enter Insert mode. Now, Vim behaves like any
    other text editor, until you press `<ESC>` to return to Normal mode. This, along
    with the basics explained above, are all you need to start editing files using
    Vim (though not particularly efficiently, if you’re spending all your time editing
    from Insert mode).
  id: totrans-25
  prefs: []
  type: TYPE_NORMAL
  zh: 从正常模式，按 `i` 键进入插入模式。现在，Vim 的行为就像任何其他文本编辑器一样，直到你按 `<ESC>` 键返回正常模式。这，加上上面解释的基础知识，就是你开始使用
    Vim 编辑文件所需的所有内容（尽管如果你一直从插入模式进行编辑，效率可能不是特别高）。
- en: Vim’s interface is a programming language
  id: totrans-26
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: Vim 的界面是一种编程语言
- en: Vim’s interface is a programming language. Keystrokes (with mnemonic names)
    are commands, and these commands *compose*. This enables efficient movement and
    edits, especially once the commands become muscle memory, just like typing becomes
    super efficient once you’ve learned your keyboard layout.
  id: totrans-27
  prefs: []
  type: TYPE_NORMAL
  zh: Vim 的界面是一种编程语言。按键（带有助记名）是命令，这些命令 *组合*。这使得移动和编辑变得高效，尤其是当命令成为肌肉记忆后，就像一旦你学会了键盘布局，打字就会变得超级高效一样。
- en: Movement
  id: totrans-28
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 移动
- en: You should spend most of your time in Normal mode, using movement commands to
    navigate the file. Movements in Vim are also called “nouns”, because they refer
    to chunks of text.
  id: totrans-29
  prefs: []
  type: TYPE_NORMAL
  zh: 你应该大部分时间都在正常模式下，使用移动命令在文件中导航。Vim 中的移动也被称为“名词”，因为它们指的是文本块。
- en: 'Basic movement: `hjkl` (left, down, up, right)'
  id: totrans-30
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 基本移动：`hjkl`（左，下，上，右）
- en: 'Words: `w` (next word), `b` (beginning of word), `e` (end of word)'
  id: totrans-31
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 单词：`w`（下一个单词），`b`（单词开头），`e`（单词结尾）
- en: 'Lines: `0` (beginning of line), `^` (first non-blank character), `$` (end of
    line)'
  id: totrans-32
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 行：`0`（行首），`^`（第一个非空白字符），`$`（行尾）
- en: 'Screen: `H` (top of screen), `M` (middle of screen), `L` (bottom of screen)'
  id: totrans-33
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 屏幕模式：`H`（屏幕顶部），`M`（屏幕中间），`L`（屏幕底部）
- en: 'Scroll: `Ctrl-u` (up), `Ctrl-d` (down)'
  id: totrans-34
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 滚动：`Ctrl-u`（向上），`Ctrl-d`（向下）
- en: 'File: `gg` (beginning of file), `G` (end of file)'
  id: totrans-35
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 文件：`gg`（文件开头），`G`（文件末尾）
- en: 'Line numbers: `:{number}<CR>` or `{number}G` (line {number})'
  id: totrans-36
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 行号：`:{数字}<CR>` 或 `{数字}G`（行{数字}）
- en: '`<CR>` refers to the carriage return / enter key'
  id: totrans-37
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`<CR>`指的是回车/换行键'
- en: 'Misc: `%` (matching item, like parenthesis or brace)'
  id: totrans-38
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 杂项：`%`（匹配项，如括号或花括号）
- en: 'Find: `f{character}`, `t{character}`, `F{character}`, `T{character}`'
  id: totrans-39
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 查找：`f{字符}`，`t{字符}`，`F{字符}`，`T{字符}`
- en: find/to forward/backward {character} on the current line
  id: totrans-40
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 在当前行上查找/向前/向后查找{字符}
- en: '`,` / `;` for navigating matches'
  id: totrans-41
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`,` / `;` 用于导航匹配项'
- en: 'Search: `/{regex}`, `n` / `N` for navigating matches'
  id: totrans-42
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 搜索：`/{正则表达式}`，`n` / `N` 用于导航匹配项
- en: Selection
  id: totrans-43
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 选择
- en: 'Visual modes:'
  id: totrans-44
  prefs: []
  type: TYPE_NORMAL
  zh: 视觉模式：
- en: 'Visual: `v`'
  id: totrans-45
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 视觉：`v`
- en: 'Visual Line: `V`'
  id: totrans-46
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 视觉行模式：`V`
- en: 'Visual Block: `Ctrl-v`'
  id: totrans-47
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 视觉块：`Ctrl-v`
- en: Can use movement keys to make selection.
  id: totrans-48
  prefs: []
  type: TYPE_NORMAL
  zh: 可以使用移动键来选择。
- en: Edits
  id: totrans-49
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 编辑
- en: Everything that you used to do with the mouse, you now do with the keyboard
    using editing commands that compose with movement commands. Here’s where Vim’s
    interface starts to look like a programming language. Vim’s editing commands are
    also called “verbs”, because verbs act on nouns.
  id: totrans-50
  prefs: []
  type: TYPE_NORMAL
  zh: 你现在可以用键盘通过编辑命令来完成你以前用鼠标做的所有事情。这就是Vim界面开始看起来像编程语言的地方。Vim的编辑命令也被称为“动词”，因为动词作用于名词。
- en: '`i` enter Insert mode'
  id: totrans-51
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`i` 进入插入模式'
- en: but for manipulating/deleting text, want to use something more than backspace
  id: totrans-52
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 但对于操作/删除文本，想要使用比退格键更强大的工具
- en: '`o` / `O` insert line below / above'
  id: totrans-53
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`o` / `O` 在下方/上方插入行'
- en: '`d{motion}` delete {motion}'
  id: totrans-54
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`d{动作}` 删除{动作}'
- en: e.g. `dw` is delete word, `d$` is delete to end of line, `d0` is delete to beginning
    of line
  id: totrans-55
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 例如：`dw` 是删除单词，`d$` 是删除到行尾，`d0` 是删除到行首
- en: '`c{motion}` change {motion}'
  id: totrans-56
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`c{动作}` 更改{动作}'
- en: e.g. `cw` is change word
  id: totrans-57
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 例如：`cw` 是更改单词
- en: like `d{motion}` followed by `i`
  id: totrans-58
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 例如：`d{动作}` 后跟 `i`
- en: '`x` delete character (equivalent to `dl`)'
  id: totrans-59
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`x` 删除字符（相当于`dl`）'
- en: '`s` substitute character (equivalent to `cl`)'
  id: totrans-60
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`s` 替换字符（相当于`cl`）'
- en: Visual mode + manipulation
  id: totrans-61
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 视觉模式+操作
- en: select text, `d` to delete it or `c` to change it
  id: totrans-62
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 选择文本，`d` 删除它或`c` 更改它
- en: '`u` to undo, `<C-r>` to redo'
  id: totrans-63
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`u` 撤销，`<C-r>` 重做'
- en: '`y` to copy / “yank” (some other commands like `d` also copy)'
  id: totrans-64
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`y` 复制/“粘贴”（一些其他命令如`d`也复制）'
- en: '`p` to paste'
  id: totrans-65
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`p` 粘贴'
- en: 'Lots more to learn: for example, `~` flips the case of a character, and `J`
    joins together lines'
  id: totrans-66
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 还有更多要学习的内容：例如，`~` 切换字符的大小写，`J` 将行连接起来
- en: Counts
  id: totrans-67
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 计数
- en: You can combine nouns and verbs with a count, which will perform a given action
    a number of times.
  id: totrans-68
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以将名词和动词与一个计数器结合使用，这将执行给定动作多次。
- en: '`3w` move 3 words forward'
  id: totrans-69
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`3w` 向前移动3个单词'
- en: '`5j` move 5 lines down'
  id: totrans-70
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`5j` 向下移动5行'
- en: '`7dw` delete 7 words'
  id: totrans-71
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`7dw` 删除7个单词'
- en: Modifiers
  id: totrans-72
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 修饰符
- en: You can use modifiers to change the meaning of a noun. Some modifiers are `i`,
    which means “inner” or “inside”, and `a`, which means “around”.
  id: totrans-73
  prefs: []
  type: TYPE_NORMAL
  zh: 你可以使用修饰符来改变名词的含义。一些修饰符是`i`，表示“内部”或“里面”，和`a`，表示“周围”。
- en: '`ci(` change the contents inside the current pair of parentheses'
  id: totrans-74
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`ci(` 改变当前对括号内的内容'
- en: '`ci[` change the contents inside the current pair of square brackets'
  id: totrans-75
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`ci[` 改变当前对括号内的内容'
- en: '`da''` delete a single-quoted string, including the surrounding single quotes'
  id: totrans-76
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`da''` 删除单引号字符串，包括周围的单引号'
- en: Putting it all together
  id: totrans-77
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 将所有这些放在一起
- en: 'Here is a broken [fizz buzz](https://en.wikipedia.org/wiki/Fizz_buzz) implementation:'
  id: totrans-78
  prefs: []
  type: TYPE_NORMAL
  zh: 这里是一个损坏的[fizz buzz](https://en.wikipedia.org/wiki/Fizz_buzz)实现：
- en: '[PRE0]'
  id: totrans-79
  prefs: []
  type: TYPE_PRE
  zh: '[PRE0]'
- en: 'We use the following sequence of commands to fix the issues, beginning in Normal
    mode:'
  id: totrans-80
  prefs: []
  type: TYPE_NORMAL
  zh: 我们使用以下命令序列来修复问题，从普通模式开始：
- en: Main is never called
  id: totrans-81
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 主函数永远不会被调用
- en: '`G` to jump to the end of the file'
  id: totrans-82
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`G` 跳到文件末尾'
- en: '`o` to **o**pen a new line below'
  id: totrans-83
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`o` 在下方**打开**新行'
- en: 'Type in `if __name__ == "__main__": main()`'
  id: totrans-84
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '输入`if __name__ == "__main__": main()`'
- en: If your editor has Python language support, it might do some auto-indentation
    for you in Insert mode
  id: totrans-85
  prefs:
  - PREF_IND
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: 如果你的编辑器有Python语言支持，它可能会在插入模式中为你进行一些自动缩进
- en: '`<ESC>` to go back to Normal mode'
  id: totrans-86
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`<ESC>` 返回到普通模式'
- en: Starts at 0 instead of 1
  id: totrans-87
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 从0开始而不是1
- en: '`/` followed by `range` and `<CR>` to search for “range”'
  id: totrans-88
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`/` 后跟 `范围` 和 `<CR>` 搜索“范围”'
- en: '`ww` to move forward two **w**ords (you could also use `2w`, but in practice,
    for small counts it’s common to repeat the key instead of using the count functionality)'
  id: totrans-89
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`ww` 用于向前移动两个 **单词**（你也可以使用 `2w`，但在实际操作中，对于小的计数，重复键通常比使用计数功能更常见）'
- en: '`i` to switch to **i**nsert mode, and add `1,`'
  id: totrans-90
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`i` 用于切换到**插入模式**，并添加 `1,`'
- en: '`<ESC>` to go back to Normal mode'
  id: totrans-91
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`<ESC>` 用于返回到普通模式'
- en: '`e` to jump to the **e**nd of the next word'
  id: totrans-92
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`e` 用于跳转到下一个单词的**末尾**'
- en: '`a` to start **a**ppending text, and add `+ 1`'
  id: totrans-93
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`a` 用于开始**追加文本**，并添加 `+ 1`'
- en: '`<ESC>` to go back to Normal mode'
  id: totrans-94
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`<ESC>` 用于返回到普通模式'
- en: Prints “fizz” for multiples of 5
  id: totrans-95
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 对于 5 的倍数打印“fizz”
- en: '`:6<CR>` to go to line 6'
  id: totrans-96
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`:6<CR>` 用于跳转到第 6 行'
- en: '`ci"` to **c**hange **i**nside the ‘**“**’, change to `"buzz"`'
  id: totrans-97
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`ci"` 用于在‘**“**’内**更改**，更改为 `"buzz"`'
- en: '`<ESC>` to go back to Normal mode'
  id: totrans-98
  prefs:
  - PREF_IND
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`<ESC>` 用于返回到普通模式'
- en: Learning Vim
  id: totrans-99
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 学习 Vim
- en: The best way to learn Vim is to learn the fundamentals (what we’ve covered so
    far) and then just enable Vim mode in all your software and start using it in
    practice. Avoid the temptation to use the mouse or the arrow keys; in some editors,
    you can unbind the arrow keys to force yourself to build good habits.
  id: totrans-100
  prefs: []
  type: TYPE_NORMAL
  zh: 学习 Vim 的最好方法是学习基础知识（我们到目前为止所涵盖的内容），然后只是在你所有的软件中启用 Vim 模式并开始实际使用它。避免使用鼠标或箭头键的诱惑；在某些编辑器中，你可以取消绑定箭头键来强迫自己养成好习惯。
- en: Additional resources
  id: totrans-101
  prefs:
  - PREF_H3
  type: TYPE_NORMAL
  zh: 其他资源
- en: The [Vim lecture](/2020/editors/) from the previous iteration of this class
    — we have covered Vim in more depth there
  id: totrans-102
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 上一次迭代此课程中的 [Vim 讲座](/2020/editors/)——我们在那里更深入地介绍了 Vim
- en: '`vimtutor` is a tutorial that comes installed with Vim — if Vim is installed,
    you should be able to run `vimtutor` from your shell'
  id: totrans-103
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '`vimtutor` 是与 Vim 一起安装的教程——如果 Vim 已安装，你应该可以从你的 shell 中运行 `vimtutor`'
- en: '[Vim Adventures](https://vim-adventures.com/) is a game to learn Vim'
  id: totrans-104
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[Vim Adventures](https://vim-adventures.com/) 是一个学习 Vim 的游戏'
- en: '[Vim Tips Wiki](https://vim.fandom.com/wiki/Vim_Tips_Wiki)'
  id: totrans-105
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[Vim Tips Wiki](https://vim.fandom.com/wiki/Vim_Tips_Wiki)'
- en: '[Vim Advent Calendar](https://vimways.org/2019/) has various Vim tips'
  id: totrans-106
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[Vim Advent Calendar](https://vimways.org/2019/) 提供了各种 Vim 技巧'
- en: '[VimGolf](https://www.vimgolf.com/) is [code golf](https://en.wikipedia.org/wiki/Code_golf),
    but where the programming language is Vim’s UI'
  id: totrans-107
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[VimGolf](https://www.vimgolf.com/) 是 [代码高尔夫](https://en.wikipedia.org/wiki/Code_golf)，但这里的编程语言是
    Vim 的 UI'
- en: '[Vi/Vim Stack Exchange](https://vi.stackexchange.com/)'
  id: totrans-108
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[Vi/Vim Stack Exchange](https://vi.stackexchange.com/)'
- en: '[Vim Screencasts](http://vimcasts.org/)'
  id: totrans-109
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[Vim Screencasts](http://vimcasts.org/)'
- en: '[Practical Vim](https://pragprog.com/titles/dnvim2/) (book)'
  id: totrans-110
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[实用 Vim](https://pragprog.com/titles/dnvim2/)（书籍）'
- en: Code intelligence and language servers
  id: totrans-111
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 代码智能和语言服务器
- en: 'IDEs generally offer language-specific support that requires semantic understanding
    of the code through IDE extensions that connect to *language servers* that implement
    [Language Server Protocol](https://microsoft.github.io/language-server-protocol/).
    For example, the [Python extension for VS Code](https://marketplace.visualstudio.com/items?itemName=ms-python.python)
    relies on [Pylance](https://marketplace.visualstudio.com/items?itemName=ms-python.vscode-pylance),
    and the [Go extension for VS Code](https://marketplace.visualstudio.com/items?itemName=golang.go)
    relies on the first-party [gopls](https://go.dev/gopls/). By installing the extension
    and language server for the languages you work with, you can enable many language-specific
    features in your IDE, such as:'
  id: totrans-112
  prefs: []
  type: TYPE_NORMAL
  zh: IDE 通常提供特定于语言的支撑，这需要通过连接到实现 [语言服务器协议](https://microsoft.github.io/language-server-protocol/)
    的语言服务器扩展来对代码进行语义理解。例如，[VS Code 的 Python 扩展](https://marketplace.visualstudio.com/items?itemName=ms-python.python)
    依赖于 [Pylance](https://marketplace.visualstudio.com/items?itemName=ms-python.vscode-pylance)，而
    [VS Code 的 Go 扩展](https://marketplace.visualstudio.com/items?itemName=golang.go)
    依赖于第一方的 [gopls](https://go.dev/gopls/)。通过安装你使用的语言的扩展和语言服务器，你可以在你的 IDE 中启用许多特定于语言的功能，例如：
- en: '**Code completion.** Better autocomplete and autosuggest, such as being able
    to see an object’s fields and methods after typing `object.`.'
  id: totrans-113
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**代码补全**。更好的自动完成和自动建议，例如在输入 `object.` 后能够看到对象的字段和方法。'
- en: '**Inline documentation.** Seeing documentation on hover and autosuggest.'
  id: totrans-114
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**内联文档**。在悬停和自动建议时查看文档。'
- en: '**Jump-to-definition.** Jumping from a use site to the definition, such as
    being able to go from a field reference `object.field` to the definition of the
    field.'
  id: totrans-115
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**跳转到定义**。从使用位置跳转到定义，例如能够从字段引用 `object.field` 跳转到字段的定义。'
- en: '**Find references.** The inverse of the above, find all sites where a particular
    item such as a field or type is referenced.'
  id: totrans-116
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**查找引用**。上述操作的逆操作，查找特定项（如字段或类型）的所有引用位置。'
- en: '**Help with imports.** Organizing imports, removing unused imports, flagging
    missing imports.'
  id: totrans-117
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**导入帮助。** 组织导入，删除未使用的导入，标记缺失的导入。'
- en: '**Code quality.** These tools can be used standalone, but this functionality
    is often provided by language servers as well. Code formatting auto-indents and
    auto-formats code, and type checkers and linters find errors in your code, as
    you type. We will cover this class of functionality in greater depth in the [lecture
    on code quality](/2026/code-quality/).'
  id: totrans-118
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '**代码质量。** 这些工具可以独立使用，但此类功能通常也由语言服务器提供。代码格式化自动缩进和自动格式化代码，类型检查器和代码检查器在您键入时查找代码中的错误。我们将在[关于代码质量的讲座](/2026/code-quality/)中更深入地介绍此类功能。'
- en: Configuring language servers
  id: totrans-119
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 配置语言服务器
- en: For some languages, all you need to do is install the extension and language
    server, and you’ll be all set. For others, to get the maximum benefit from the
    language server, you need to tell the IDE about your environment. For example,
    pointing VS Code to your [Python environment](https://code.visualstudio.com/docs/python/environments)
    will enable the language server to see your installed packages. Environments are
    covered in more depth in our [lecture on packaging and shipping code](/2026/shipping-code/).
  id: totrans-120
  prefs: []
  type: TYPE_NORMAL
  zh: 对于某些语言，您只需安装扩展和语言服务器即可。对于其他语言，为了从语言服务器中获得最大好处，您需要告诉 IDE 您的环境。例如，将 VS Code 指向您的
    [Python 环境](https://code.visualstudio.com/docs/python/environments)将使语言服务器能够看到您安装的包。环境在我们在[关于打包和分发代码的讲座](/2026/shipping-code/)中进行了更深入的介绍。
- en: Depending on the language, there might be some settings you can configure for
    your language server. For example, using the Python support in VS Code, you can
    disable static type checking for projects that don’t make use of Python’s optional
    type annotations.
  id: totrans-121
  prefs: []
  type: TYPE_NORMAL
  zh: 根据语言的不同，您可能可以为您的语言服务器配置一些设置。例如，使用 VS Code 中的 Python 支持，您可以禁用对不使用 Python 可选类型注解的项目进行静态类型检查。
- en: AI-powered development
  id: totrans-122
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 智能化开发
- en: 'Since the introduction of [GitHub Copilot](https://github.com/features/copilot/ai-code-editor)
    using OpenAI’s [Codex model](https://openai.com/index/openai-codex/) in mid 2021,
    [LLMs](https://en.wikipedia.org/wiki/Large_language_model) have become widely
    adopted in software engineering. There are three main form factors in use right
    now: autocomplete, inline chat, and coding agents.'
  id: totrans-123
  prefs: []
  type: TYPE_NORMAL
  zh: 自从 2021 年中引入 [GitHub Copilot](https://github.com/features/copilot/ai-code-editor)
    并使用 OpenAI 的 [Codex 模型](https://openai.com/index/openai-codex/) 以来，[大型语言模型](https://en.wikipedia.org/wiki/Large_language_model)
    已在软件工程中得到广泛应用。目前主要有三种形式：自动完成、内联聊天和编码代理。
- en: Autocomplete
  id: totrans-124
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 自动完成
- en: AI-powered autocomplete has the same form factor as traditional autocomplete
    in your IDE, suggesting completions at your cursor position as you type. Sometimes,
    it’s used as a passive feature that “just works”. Beyond that, AI autocomplete
    is generally [prompted](https://en.wikipedia.org/wiki/Prompt_engineering) using
    code comments.
  id: totrans-125
  prefs: []
  type: TYPE_NORMAL
  zh: 智能化自动完成与您 IDE 中的传统自动完成具有相同的形式，在您键入时在光标位置提供完成建议。有时，它被用作一个“只需工作”的被动功能。除此之外，AI
    自动完成通常使用代码注释进行提示。
- en: 'For example, let’s write a script to download the contents of these lecture
    notes and extract all the links. We can start with:'
  id: totrans-126
  prefs: []
  type: TYPE_NORMAL
  zh: 例如，让我们编写一个脚本来下载这些讲义的内容并提取所有链接。我们可以从以下开始：
- en: '[PRE1]'
  id: totrans-127
  prefs: []
  type: TYPE_PRE
  zh: '[PRE1]'
- en: 'The model will autocomplete the body of the function:'
  id: totrans-128
  prefs: []
  type: TYPE_NORMAL
  zh: 模型将自动完成函数的主体：
- en: '[PRE2]'
  id: totrans-129
  prefs: []
  type: TYPE_PRE
  zh: '[PRE2]'
- en: 'We can further guide completions using comments. For example, if we start writing
    a function to extract all Markdown links, but it doesn’t have a particularly descriptive
    name:'
  id: totrans-130
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以使用注释进一步引导完成。例如，如果我们开始编写一个提取所有 Markdown 链接的函数，但它的名称没有特别描述性：
- en: '[PRE3]'
  id: totrans-131
  prefs: []
  type: TYPE_PRE
  zh: '[PRE3]'
- en: 'The model will autocomplete something like this:'
  id: totrans-132
  prefs: []
  type: TYPE_NORMAL
  zh: 模型将自动完成如下内容：
- en: '[PRE4]'
  id: totrans-133
  prefs: []
  type: TYPE_PRE
  zh: '[PRE4]'
- en: 'We can guide the completion through code comments:'
  id: totrans-134
  prefs: []
  type: TYPE_NORMAL
  zh: 我们可以通过代码注释来引导完成：
- en: '[PRE5]'
  id: totrans-135
  prefs: []
  type: TYPE_PRE
  zh: '[PRE5]'
- en: 'This time, the model gives a better completion:'
  id: totrans-136
  prefs: []
  type: TYPE_NORMAL
  zh: 这次，模型给出了更好的完成建议：
- en: '[PRE6]'
  id: totrans-137
  prefs: []
  type: TYPE_PRE
  zh: '[PRE6]'
- en: 'Here, we see one downside of this AI coding tool: it can only provide completions
    at the cursor. In this case, it would be better practice to put the `import re`
    at the module level, rather than inside the function.'
  id: totrans-138
  prefs: []
  type: TYPE_NORMAL
  zh: 这里，我们看到了这个 AI 编码工具的一个缺点：它只能提供光标位置的完成建议。在这种情况下，将 `import re` 放在模块级别而不是函数内部会更好。
- en: The example above used a poorly-named function to demonstrate how code completion
    can be steered using comments; in practice, you’d want to write code with functions
    named more descriptively, like `extract_links`, and you’d want to write docstrings
    (and based on this, the model should generate a completion analogous to the one
    above).
  id: totrans-139
  prefs: []
  type: TYPE_NORMAL
  zh: 上面的例子使用了一个命名不佳的函数来演示如何通过注释来引导代码补全；在实践中，您会希望编写具有更具描述性的函数名称，如`extract_links`，并且您会希望编写文档字符串（基于此，模型应该生成类似于上面的补全）。
- en: 'For demonstration purposes, we can complete the script:'
  id: totrans-140
  prefs: []
  type: TYPE_NORMAL
  zh: 为了演示目的，我们可以完成脚本：
- en: '[PRE7]'
  id: totrans-141
  prefs: []
  type: TYPE_PRE
  zh: '[PRE7]'
- en: Inline chat
  id: totrans-142
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 内联聊天
- en: Inline chat lets you select a line or block and then directly prompt the AI
    model to propose an edit. In this interaction mode, the model can make changes
    to existing code (which differs from autocomplete, which only completes code beyond
    the cursor).
  id: totrans-143
  prefs: []
  type: TYPE_NORMAL
  zh: 内联聊天允许您选择一行或一个代码块，然后直接提示AI模型提出编辑建议。在这种交互模式下，模型可以对现有代码进行修改（这与自动完成不同，自动完成只会在光标之后完成代码）。
- en: 'Continuing the example from above, suppose we decided not to use the third-party
    `requests` library. We could select the relevant three lines of code, invoke inline
    chat, and say something like:'
  id: totrans-144
  prefs: []
  type: TYPE_NORMAL
  zh: 继续上面的例子，假设我们决定不使用第三方`requests`库。我们可以选择相关的三行代码，调用内联聊天，并说类似的话：
- en: '[PRE8]'
  id: totrans-145
  prefs: []
  type: TYPE_PRE
  zh: '[PRE8]'
- en: 'The model proposes:'
  id: totrans-146
  prefs: []
  type: TYPE_NORMAL
  zh: 模型建议：
- en: '[PRE9]'
  id: totrans-147
  prefs: []
  type: TYPE_PRE
  zh: '[PRE9]'
- en: Coding agents
  id: totrans-148
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 编码代理
- en: Coding agents are covered in depth in the [Agentic Coding](/2026/agentic-coding/)
    lecture.
  id: totrans-149
  prefs: []
  type: TYPE_NORMAL
  zh: 编码代理在[代理编码](/2026/agentic-coding/)讲座中进行了深入探讨。
- en: Recommended software
  id: totrans-150
  prefs:
  - PREF_H2
  type: TYPE_NORMAL
  zh: 推荐软件
- en: Some popular AI IDEs are [VS Code](https://code.visualstudio.com/) with the
    [GitHub Copilot](https://github.com/features/copilot/ai-code-editor) extension
    and [Cursor](https://cursor.com/). GitHub Copilot is currently available [for
    free for students](https://github.com/education/students), teachers, and maintainers
    of popular open source projects. This is a rapidly evolving space. Many of the
    leading products have roughly equivalent functionality.
  id: totrans-151
  prefs: []
  type: TYPE_NORMAL
  zh: 一些流行的AI IDE包括带有[GitHub Copilot](https://github.com/features/copilot/ai-code-editor)扩展的[VS
    Code](https://code.visualstudio.com/)和[Cursor](https://cursor.com/)。GitHub Copilot目前对学生、教师和流行开源项目的维护者免费提供。这是一个快速发展的领域。许多领先的产品功能大致相当。
- en: Extensions and other IDE functionality
  id: totrans-152
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 扩展和其他IDE功能
- en: IDEs are powerful tools, made even more powerful by *extensions*. We can’t cover
    all of these features in a single lecture, but here we provide some pointers to
    a couple popular extensions. We encourage you to explore this space on your own;
    there are many lists of popular IDE extensions available online, such as [Vim
    Awesome](https://vimawesome.com/) for Vim plugins and [VS Code extensions sorted
    by popularity](https://marketplace.visualstudio.com/search?target=VSCode&category=All%20categories&sortBy=Installs).
  id: totrans-153
  prefs: []
  type: TYPE_NORMAL
  zh: IDEs（集成开发环境）是强大的工具，通过*扩展*功能变得更加强大。我们无法在一个讲座中涵盖所有这些功能，但在这里我们提供了一些指向几个流行扩展的指南。我们鼓励您自己探索这个领域；网上有许多流行的IDE扩展列表，例如[Vim
    Awesome](https://vimawesome.com/)用于Vim插件和[按受欢迎程度排序的VS Code扩展](https://marketplace.visualstudio.com/search?target=VSCode&category=All%20categories&sortBy=Installs)。
- en: '[Development containers](https://containers.dev/): supported by popular IDEs
    (e.g., [supported by VS Code](https://code.visualstudio.com/docs/devcontainers/containers)),
    dev containers let you use a container to run development tools. This can be helpful
    for portability or isolation. The [lecture on packaging and shipping code](/2026/shipping-code/)
    covers containers in more depth.'
  id: totrans-154
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: '[开发容器](https://containers.dev/)：由流行的IDE支持（例如，[由VS Code支持](https://code.visualstudio.com/docs/devcontainers/containers)），开发容器允许您使用容器来运行开发工具。这可能有助于便携性或隔离。关于[打包和分发代码的讲座](/2026/shipping-code/)更深入地介绍了容器。'
- en: 'Remote development: do development on a remote machine using SSH (e.g., with
    the [Remote SSH plugin for VS Code](https://marketplace.visualstudio.com/items?itemName=ms-vscode-remote.remote-ssh)).
    This can be handy, for example, if you want to develop and run code on a beefy
    GPU machine in the cloud.'
  id: totrans-155
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 远程开发：使用SSH在远程机器上进行开发（例如，使用[VS Code的远程SSH插件](https://marketplace.visualstudio.com/items?itemName=ms-vscode-remote.remote-ssh)）。这可能很有用，例如，如果您想在云中的强大GPU机器上开发和运行代码。
- en: 'Collaborative editing: edit the same file, Google Docs style (e.g., with the
    [Live Share plugin for VS Code](https://marketplace.visualstudio.com/items?itemName=MS-vsliveshare.vsliveshare)).'
  id: totrans-156
  prefs:
  - PREF_UL
  type: TYPE_NORMAL
  zh: 协同编辑：以Google Docs风格编辑同一文件（例如，使用[VS Code的Live Share插件](https://marketplace.visualstudio.com/items?itemName=MS-vsliveshare.vsliveshare)）。
- en: Exercises
  id: totrans-157
  prefs:
  - PREF_H1
  type: TYPE_NORMAL
  zh: 练习
- en: Enable Vim mode in all the software you use that supports it, such as your editor
    and your shell, and use Vim mode for all your text editing for the next month.
    Whenever something seems inefficient, or when you think “there must be a better
    way”, try Googling it, there probably is a better way.
  id: totrans-158
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 在所有支持Vim模式的软件中启用Vim模式，例如你的编辑器和你的shell，并在接下来的一个月内使用Vim模式进行所有文本编辑。每当遇到效率低下的问题，或者当你想“一定有更好的方法”时，尝试在Google上搜索，可能真的有更好的方法。
- en: Complete a challenge from [VimGolf](https://www.vimgolf.com/).
  id: totrans-159
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 完成[VimGolf](https://www.vimgolf.com/)的一个挑战。
- en: Configure an IDE extension and language server for a project that you’re working
    on. Ensure that all the expected functionality, such as jump-to-definition for
    library dependencies, works as expected. If you don’t have code that you can use
    for this exercise, you can use some open-source project from GitHub (such as [this
    one](https://github.com/spf13/cobra)).
  id: totrans-160
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 为你正在工作的项目配置一个IDE扩展和语言服务器。确保所有预期的功能，如跳转到库依赖项的定义，都能按预期工作。如果你没有可用于此练习的代码，你可以使用GitHub上的某些开源项目（例如[这个项目](https://github.com/spf13/cobra)）。
- en: Browse a list of IDE extensions and install one that seems useful to you.
  id: totrans-161
  prefs:
  - PREF_OL
  type: TYPE_NORMAL
  zh: 浏览IDE扩展列表并安装一个对你有用的扩展。
